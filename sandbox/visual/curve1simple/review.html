<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finesse · Curve review</title><style>*{box-sizing:border-box}body{margin:0;background:#101e19;color:#eeeedd;font:16px/1.55 system-ui,-apple-system,sans-serif}main{width:min(1440px,calc(100% - 48px));margin:24px auto}h1{font-size:28px;line-height:1.2;margin:0 0 6px}p{margin:8px 0;color:#bccfc1}a{color:#c7e4c9;text-underline-offset:4px}button,select{font:inherit;color:#f0efdf;background:#274237;border:1px solid #52705c;border-radius:8px;padding:9px 14px;cursor:pointer}button:hover,select:hover{background:#355644}button[aria-pressed=true]{border-color:#d9cc8f;background:#3a523b}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:20px 0 14px}label{display:flex;align-items:center;gap:10px;font-weight:600}video{display:block;width:100%;max-height:calc(100vh - 225px);aspect-ratio:16/9;object-fit:contain;background:#285e43;border-radius:10px}footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0 24px;color:#b5c8ba;font-size:14px}#now{font-weight:600;color:#e4e8d6}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #eddaa2;outline-offset:3px}@media(max-width:650px){main{width:calc(100% - 24px);margin:18px auto}h1{font-size:24px}.controls{gap:8px}video{max-height:none}footer{justify-content:flex-start}}</style></head><body><main><h1>Finesse into the top-right corner</h1><p>80 Shot Power · Right foot · Courtois · Behind the shooter</p><div class="controls"><label for="curve">Curve<select id="curve"><option value="" hidden disabled>Comparison</option><option value="0">0</option><option value="25">25</option><option value="50">50</option><option value="60">60</option><option value="70">70</option><option value="75" selected>75</option><option value="80">80</option><option value="85">85</option><option value="90">90</option><option value="95">95</option><option value="99">99</option></select></label><button id="replay" type="button">Replay</button><button id="compare" type="button" aria-pressed="false">Compare 50 / 75 / 90 / 99</button></div><video id="video" controls autoplay muted loop playsinline preload="auto" aria-label="Behind-shooter Finesse replay" src="videos/curve-75-behind-1x.mp4" poster="videos/curve-75-behind-1x-preview.png"></video><footer><span id="now" aria-live="polite">75 Curve · 1× speed</span><span><a id="download" href="videos/curve-75-behind-1x.mp4" download>Download video</a> &nbsp; · &nbsp; <a href="report.html">Measurements and results</a></span></footer></main><script>

</script></body></html>
