<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carry Model Lab</title>
<style>
  :root { --bg: #0f1412; --panel: #18201c; --ink: #e6efe9; --dim: #8fa49a; --acc: #ffd45e; --line: #2a3530; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  button, select { background: #222c27; color: var(--ink); border: 1px solid #34413a; border-radius: 5px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button.on { background: var(--acc); color: #1a1a10; border-color: var(--acc); font-weight: 600; }
  label { display: inline-flex; gap: 4px; align-items: center; }
  #wrap { position: relative; margin: 0 auto; } #gl, #ov { position: absolute; left: 0; top: 0; display: block; }
  #hud { padding: 6px 12px; color: var(--dim); font: 12px/1.4 Menlo, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="bar">
  <button id="bPlay" class="on">❚❚ Pause</button>
  <span>Speed</span><button data-rate="1" class="on">1×</button><button data-rate="0.5">0.5×</button><button data-rate="0.25">0.25×</button><button data-rate="0.1">0.1×</button>
  <span>Case</span><select id="selScn"></select>
  <span>Ball Control</span><select id="selB"></select><span>Dribbling</span><select id="selD"></select><span>Agility</span><select id="selA"></select>
  <span>Preset</span><select id="selPreset"><option value="">—</option><option>99/99/99</option><option>90/90/90</option><option>80/80/80</option><option>70/70/70</option><option>60/60/60</option><option>50/50/50</option><option>99/99/50</option><option>99/50/99</option><option>50/99/99</option><option>95/95/55</option><option>95/55/95</option><option>55/95/95</option></select>
  <span>Style</span><select id="selStyle"></select><span>Foot</span><select id="selFoot"><option value="">profile (R)</option><option value="R">right</option><option value="L">left</option><option value="B">two-footed (weak foot 5)</option></select>
  <span>Turn °</span><input id="inTurn" type="number" min="0" max="180" step="5" style="width:52px"><span>m/s</span><input id="inV" type="number" min="1" max="9" step="0.5" style="width:48px"><select id="selSide"><option value="R">right</option><option value="L">left</option></select><button id="bTurn">run turn</button>
  <span>Pipeline</span><select id="selPipe"><option value="NEW">NEW (technical control)</option><option value="RE1">RECEIVE-ELITE-1</option><option value="CURRENT">CURRENT</option><option value="re1">RECEIVE-ELITE-1 vs NEW</option><option value="compare">CURRENT vs NEW</option></select>
  <span>Carry model</span><select id="selBody"><option value="new">TECHNICAL-CONTROL-1.2 (lanes · outside / instep · same foot)</option><option value="old">TECHNICAL-CONTROL-1 (old, alternating)</option><option value="cmp">old vs new</option></select>
  <span>View</span><select id="selView"><option value="">gameplay + close + top</option><option value="fRun">run: side-front (the whole player)</option><option value="fRear">run: from behind (the ball's lane)</option><option value="fTopRun">run: above</option><option value="quad">feet: quad (front 3/4 · rear 3/4 · side · foot level)</option><option value="fF34">feet: front 3/4</option><option value="fR34">feet: rear 3/4</option><option value="fSide">feet: side (right)</option><option value="fSideL">feet: side (left)</option><option value="fFoot">feet: foot-level close-up</option><option value="nearC">close</option><option value="close">close (low)</option><option value="top">top (angled)</option><option value="topC">top</option><option value="game">gameplay only</option></select>
  <span style="color:var(--dim)">space play · . / , frame · r restart</span>
</div>
<div id="wrap"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
<div id="hud">computing the simulation…</div>
<script src="anim3d/m4.js"></script>
<script src="anim3d/skeleton.js"></script>
<script src="anim3d/ik.js"></script>
<script src="anim3d/of_rig.js"></script>
<script src="anim3d/of_motion.js"></script>
<script src="anim3d/of_loco.js"></script>
<script src="anim3d/of_character.js"></script>
<script src="anim3d/of_char_gl.js"></script>
<script src="run1/run1_gait_v13.js"></script>
<script src="turn1/turn1_loco.js"></script>
<script src="turn1/turn11_body.js"></script>
<script type="module" src="technical_control12/tc12_viewer.js"></script>
</body>
</html>
