<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Touchline Visual V1 — Renderer Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="loading">Loading frozen Visual V1 assets…<br><span id="loadpct">0%</span></div>
  <div id="banner">CAMERA UNLOCKED — VISUAL REVIEW REQUIRED · presentation sandbox · fixture data only (no engine)</div>
</div>

<div id="panel">
  <h1>Visual V1 Sandbox</h1>

  <section>
    <h2>Camera</h2>
    <label>Camera height <span id="v-height"></span>
      <input type="range" id="height" min="8" max="60" step="1"></label>
    <label>Sideline distance <span id="v-dist"></span>
      <input type="range" id="dist" min="4" max="60" step="1"></label>
    <label>FOV (vertical) <span id="v-fov"></span>
      <input type="range" id="fov" min="12" max="70" step="1"></label>
    <label>Look-target depth offset <span id="v-depthoff"></span>
      <input type="range" id="depthoff" min="-20" max="20" step="1"></label>
    <label>Camera pitch (downward angle) <span id="v-pitch"></span>
      <input type="range" id="pitch" min="12" max="45" step="1"></label>
    <div class="row" id="pitch-presets">
      <button data-pitch="15">15°</button>
      <button data-pitch="20">20°</button>
      <button data-pitch="25">25°</button>
      <button data-pitch="30">30°</button>
      <button data-pitch="35">35°</button>
    </div>
    <label>Camera yaw <span id="v-yaw"></span>
      <input type="range" id="yaw" min="-35" max="35" step="1"></label>
    <div class="row" id="yaw-presets">
      <button data-yaw="0">Yaw 0°</button>
      <button data-yaw="10">+10°</button>
      <button data-yaw="15">+15°</button>
      <button data-yaw="20">+20°</button>
      <button data-yaw="25">+25°</button>
    </div>
    <label>Tracking smoothing <span id="v-smooth"></span>
      <input type="range" id="smooth" min="0" max="1.5" step="0.05"></label>
    <div class="row">
      <label class="inline"><input type="radio" name="cammode" value="static" checked> Static</label>
      <label class="inline"><input type="radio" name="cammode" value="ball"> Ball follow</label>
      <label class="inline"><input type="radio" name="cammode" value="play"> Play follow</label>
    </div>
    <button id="reset">Reset to defaults</button>
  </section>

  <section>
    <h2>Players / Animation</h2>
    <label>Player scale ×<span id="v-pscale"></span>
      <input type="range" id="pscale" min="0.5" max="3" step="0.05"></label>
    <label class="inline"><input type="checkbox" id="snap"> Pixel-perfect sprite snap (integer scale)</label>
    <label>Jog FPS <span id="v-jogfps"></span>
      <input type="range" id="jogfps" min="4" max="20" step="1"></label>
    <label>Sprint FPS <span id="v-sprintfps"></span>
      <input type="range" id="sprintfps" min="4" max="24" step="1"></label>
    <label>Playback rate ×<span id="v-rate"></span>
      <input type="range" id="rate" min="0.25" max="2" step="0.05"></label>
    <label class="inline"><input type="checkbox" id="pause"> Pause animation</label>
  </section>

  <section>
    <h2>Test player</h2>
    <div class="row">
      <label class="inline"><input type="radio" name="tstate" value="idle" checked> Idle</label>
      <label class="inline"><input type="radio" name="tstate" value="jog"> Jog</label>
      <label class="inline"><input type="radio" name="tstate" value="sprint"> Sprint</label>
      <label class="inline"><input type="radio" name="tstate" value="ramp"> Speed ramp</label>
    </div>
    <label class="inline"><input type="checkbox" id="autorot"> Auto 360° direction sweep</label>
    <label>Heading (°) <span id="v-heading"></span>
      <input type="range" id="heading" min="0" max="359" step="1"></label>
    <label class="inline"><input type="checkbox" id="ballmove"> Ball auto-move (figure-8)</label>
  </section>

  <section>
    <h2>Net impact tests</h2>
    <div class="scenes">
      <button id="net-centre">Net test — centre</button>
      <button id="net-top">Net test — top corner</button>
      <button id="net-low">Net test — low corner</button>
      <button id="net-power">Net test — power shot</button>
      <button id="net-reset">Reset net</button>
    </div>
  </section>

  <section>
    <h2>Debug</h2>
    <label class="inline"><input type="checkbox" id="dbg-anchors"> Anchors / pivots / bboxes</label>
    <label class="inline"><input type="checkbox" id="dbg-grid"> World-coordinate grid (5 m)</label>
    <label class="inline"><input type="checkbox" id="dbg-track"> Tracking-target marker</label>
  </section>

  <section>
    <h2>Scenes</h2>
    <div class="scenes">
      <button data-scene="midfield">Midfield</button>
      <button data-scene="attacking">Attacking third</button>
      <button data-scene="touchline">Touchline</button>
      <button data-scene="goalmouth">Goalmouth</button>
      <button data-scene="dirtest">Direction test</button>
      <button data-scene="locotest">Locomotion test</button>
      <button data-scene="camcal">Camera calibration</button>
      <button data-scene="goalcam">Goal + camera cal</button>
    </div>
  </section>

  <section id="readout"></section>
</div>

<script src="sandbox.js"></script>
</body>
</html>
