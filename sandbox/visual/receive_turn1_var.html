<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Execution Variance</title>
<style>
  :root { --bg: #0f1412; --panel: #18201c; --ink: #e6efe9; --dim: #8fa49a; --acc: #ffd45e; --line: #2a3530; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 12px/1.35 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); } h1 { font-size: 16px; margin: 0 0 6px; } h1 small { font-weight: 400; color: var(--dim); font-size: 12px; }
  #ctl { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; } select { background: #222c27; color: var(--ink); border: 1px solid #34413a; border-radius: 5px; padding: 3px 6px; font: inherit; } a { color: var(--acc); }
  #title { margin: 8px 14px; font-weight: 600; color: var(--acc); }
  #main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 10px; padding: 0 12px 30px; }
  #grid { display: flex; flex-wrap: wrap; gap: 6px; } .tile { background: #121916; border: 1px solid var(--line); border-radius: 6px; padding: 3px; width: 210px; } .lbl { font: 10.5px/1.35 Menlo, monospace; padding: 2px 3px; } .dim { color: var(--dim); }
  .chip { display: inline-block; padding: 0 4px; border-radius: 3px; color: #111; font-weight: 700; font-size: 9.5px; }
  #side { position: sticky; top: 6px; align-self: start; } #overlay { width: 380px; height: 380px; border-radius: 6px; background: #121916; border: 1px solid var(--line); }
  table { border-collapse: collapse; margin: 4px 0; } td, th { border: 1px solid var(--line); padding: 2px 5px; font: 11px Menlo, monospace; text-align: right; } td:first-child { text-align: left; } th { color: var(--dim); } h3 { font-size: 13px; margin: 10px 0 2px; color: var(--acc); }
  @media (max-width: 900px) { #main { grid-template-columns: 1fr; } #overlay { width: 100%; } .tile { width: calc(50% - 10px); } }
</style>
</head>
<body>
<header>
  <h1>RECEIVE-TURN-1 · execution variance <small>Alternative B is the centre · bounded keyed draws per physical dimension · BC 99 tight · not frozen</small></h1>
  <div id="ctl"></div>
</header>
<div id="title">computing…</div>
<div id="main"><div id="grid"></div><div id="side"><canvas id="overlay"></canvas><div id="summary"></div></div></div>
<script type="module" src="receive_turn1/rt_var_page.js"></script>
</body>
</html>
