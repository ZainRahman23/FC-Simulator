<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technique References Lab</title>
<style>
  :root { --bg: #0f1412; --panel: #18201c; --ink: #e6efe9; --dim: #8fa49a; --acc: #ffd45e; --line: #2a3530; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  button, select { background: #222c27; color: var(--ink); border: 1px solid #34413a; border-radius: 5px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button.on { background: var(--acc); color: #1a1a10; border-color: var(--acc); font-weight: 600; }
  label { display: inline-flex; gap: 4px; align-items: center; }
  #wrap { position: relative; margin: 0 auto; } #gl, #ov { position: absolute; left: 0; top: 0; display: block; }
  #hud { padding: 6px 12px; color: var(--dim); font: 12px/1.4 Menlo, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="bar">
  <button id="bPlay" class="on">❚❚ Pause</button>
  <span>Speed</span><button data-rate="1" class="on">1×</button><button data-rate="0.5">0.5×</button><button data-rate="0.25">0.25×</button><button data-rate="0.1">0.1×</button>
  <span>Reference</span><select id="selTech"></select>
  <span>View</span><select id="selView"><option value="quad">quad: front 3/4 · rear 3/4 · side · top</option><option value="fF34">front 3/4</option><option value="fR34">rear 3/4</option><option value="fSide">side (left)</option><option value="fSideR">side (right)</option><option value="topF">top</option><option value="fRun">run (side-front, the whole player)</option></select>
  <label><input id="cbExp" type="checkbox" checked> pressure lines</label>
  <span style="color:var(--dim)">space play · . / , frame · r restart</span>
</div>
<div id="wrap"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
<div id="hud">building the reference…</div>
<script src="anim3d/m4.js"></script>
<script src="anim3d/skeleton.js"></script>
<script src="anim3d/ik.js"></script>
<script src="anim3d/of_rig.js"></script>
<script src="anim3d/of_motion.js"></script>
<script src="anim3d/of_loco.js"></script>
<script src="anim3d/of_character.js"></script>
<script src="anim3d/of_char_gl.js"></script>
<script src="run1/run1_gait_v13.js"></script>
<script type="module" src="technical_control15/tc15_viewer.js"></script>
</body>
</html>
