<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Swing Review</title>
<style>

  * { box-sizing: border-box; }

  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  h1 { font-size: 17px; margin: 0 0 6px; font-weight: 650; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  input[type=range] { flex: 1; min-width: 200px; }
  .mute { color: var(--mute); }
  #desc { max-width: 1100px; margin: 8px 0 0; }
  main { display: grid; gap: 12px; padding: 12px 16px; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
  .col h2 { font-size: 15px; margin: 0 0 2px; }
  .col .sub { font-size: 12px; color: var(--mute); margin-bottom: 6px; min-height: 2.9em; }
  canvas { width: 100%; display: block; border-radius: 6px; }
  .cap { font-size: 12.5px; margin-top: 6px; white-space: pre-wrap; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); margin-left: 6px; vertical-align: 1px; }
  .tag.bad { color: var(--warn); border-color: var(--warn); } .tag.good { color: var(--ok); border-color: var(--ok); }
  footer { padding: 4px 16px 24px; font-size: 12.5px; color: var(--mute); max-width: 1200px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; font-size: 12px; color: var(--mute); }
  .legend i { width: 12px; height: 8px; border-radius: 2px; display: inline-block; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr !important; } }
</style>
</head>
<body>
<header>
  <h1>G2b speed regulation and swing execution: configurations side by side</h1>
  <div class="row" id="scen"></div>
  <div class="row">
    <span class="mute" id="feetLabel"></span><span id="feet"></span>
    <span class="mute" style="margin-left:12px">view</span><button id="vFoot" class="on">foot close-up</button><button id="vTrace" class="on">traces</button>
    <button id="theme" title="toggle light/dark">◐</button>
  </div>
  <div class="row">
    <button id="play">▶ play</button><button id="back">◀ frame</button><button id="fwd">frame ▶</button>
    <select id="speed"><option value="0.1">0.1×</option><option value="0.25" selected>0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option></select>
    <input type="range" id="t" min="0" max="1000" value="0"><span id="tl" class="mono" style="min-width:150px"></span>
  </div>
  <div class="legend row"><span><i style="background:var(--near)"></i>left leg (near)</span><span><i style="background:var(--far)"></i>right leg (far)</span><span><i style="background:var(--loaded)"></i>foot loaded (&gt; 5 % BW)</span><span>│ traces: focus foot, time aligned to the scenario's event (0 s)</span></div>
  <p id="desc" class="mute"></p>
</header>
<main id="cols"></main>
<footer id="foot"></footer>
<script src="data/manifest.js"></script>
<script>

function init() {

  document.getElementById("vFoot").onclick = (e) => { st.showFoot = !st.showFoot; e.target.classList.toggle("on", st.showFoot); render(); };
  document.getElementById("vTrace").onclick = (e) => { st.showTrace = !st.showTrace; e.target.classList.toggle("on", st.showTrace); render(); };
  document.getElementById("theme").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; render(); };
  document.addEventListener("keydown", (e) => { if (e.key === " ") { e.preventDefault(); document.getElementById("play").click(); } else if (e.key === "ArrowRight") step(1 / 60); else if (e.key === "ArrowLeft") step(-1 / 60); });
  window.addEventListener("resize", render); build(); }
let last = 0; function tick(now) { if (!st.playing) return; const S = M.scenarios[st.scen]; st.tRel += (now - last) / 1000 * st.speed; last = now;
  if (st.tRel >= S.win[1]) { st.tRel = S.win[1]; st.playing = false; document.getElementById("play").textContent = "▶ play"; } document.getElementById("t").value = st.tRel * 1000; render(); if (st.playing) requestAnimationFrame(tick); }
init();
</script>
