<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOUCHLINE — Squad & Tactics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a10; --bg2:#0b0f18; --panel:#101623; --panel2:#151d2d; --panel3:#1b2437;
  --line:rgba(150,170,210,.12); --line2:rgba(150,170,210,.24);
  --ink:#e9eef8; --muted:#8794b0; --dim:#5b6784;
  --accent:#ff4d2e; --accent2:#ffc44d; --lfc:#c8102e; --good:#3ddc84; --warn:#ffb02e; --bad:#ff5b6e;
  --pitch:#0a1120;
  --g1:#fbf0c8; --g2:#e8c979; --g3:#c9a03c; --gink:#4a3312;
  --disp:'Archivo',system-ui,-apple-system,sans-serif;
  --cond:'Barlow Condensed','Archivo Narrow',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.68,.32,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--disp);font-size:14px;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#26314a;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{height:100%;display:flex;flex-direction:column}

.topbar{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--bg2);border-bottom:1px solid var(--line);z-index:60}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-right:6px}
.brand .mk{background:var(--accent);color:#fff;font-weight:900;padding:3px 7px;border-radius:5px;font-size:15px;line-height:1.15}
.brand .wd{font-family:var(--cond);font-weight:700;letter-spacing:.2em;font-size:13px;color:var(--muted)}
.navtabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.navtabs::-webkit-scrollbar{display:none}
.navtab{padding:7px 13px;border-radius:7px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.15s}
.navtab:hover{color:var(--ink);background:#161e2e}
.navtab.on{color:#fff;background:#1e2942}
.tbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);padding:7px 12px;border-radius:8px;
  font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;transition:.15s}
.tbtn:hover{color:var(--ink);border-color:var(--muted);background:#161e2e}
.tbtn.hot{border-color:rgba(255,77,46,.5);color:#ffb9a8}
.view{flex:1;min-height:0;display:none}
.view.on{display:flex}

#v-squad{display:none}
#v-squad.on{display:grid;grid-template-columns:minmax(520px,1fr) clamp(330px,26vw,392px);gap:0;min-height:0}
.squadmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.pitchwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 14px 2px}
.pitchzone{position:relative;overflow:visible;height:100%;max-width:min(96%,940px);aspect-ratio:0.95/1;
  border-radius:12px;border:1px solid rgba(150,190,240,.10);
  background:radial-gradient(125% 88% at 50% -14%,#152238 0%,var(--pitch) 56%,#060a12 100%)}
.pitchzone .stripes{position:absolute;inset:0;pointer-events:none;opacity:.55;border-radius:inherit;overflow:hidden;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 7.14%,transparent 7.14% 14.28%)}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.corner{position:absolute;z-index:20;display:flex;gap:8px;align-items:center}
.corner.tl{left:14px;top:12px}
.corner.tr{right:14px;top:12px}
.slots{position:absolute;inset:0;z-index:5}
.slots.notrans .slot{transition:none}

.slot{position:absolute;width:var(--cw);transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;touch-action:none;
  transition:left .42s var(--ease),top .42s var(--ease)}
.slot .holder{width:100%;cursor:grab;position:relative;transition:transform .16s var(--ease)}
.slot:hover,.slot.sel,.slot.over{z-index:200!important}
.slot .holder:hover{transform:translateY(-5px)}
.slot .holder:active{cursor:grabbing}
.slot.lifted .holder{opacity:.25}
.slot.over .holder{transform:translateY(-3px) scale(1.05)}
.slot.over .empty,.slot.over .card{outline:2px dashed var(--accent2);outline-offset:3px}
.slot.sel .card,.slot.sel .empty{outline:2px solid var(--accent);outline-offset:3px;box-shadow:0 0 0 6px rgba(255,77,46,.12)}
.slot .tag{margin-top:5px;font-family:var(--cond);font-weight:700;font-size:calc(var(--cw)*.105);
  letter-spacing:.1em;padding:1px 9px;border-radius:20px;position:relative;z-index:4;pointer-events:none;
  background:#28324a;color:#dbe3f2;border:1px solid rgba(255,255,255,.08)}
.slot[data-fit="comfortable"] .tag{background:#1f3a46;color:#a6e2f0;border-color:rgba(120,215,240,.25)}
.slot[data-fit="secondary"] .tag{background:#413318;color:#ffd79a;border-color:rgba(255,190,90,.25)}
.slot[data-fit="out"] .tag{background:#4a2131;color:#ffb3bd;border-color:rgba(255,120,140,.28)}
.slot .under{display:flex;align-items:center;gap:5px;margin-top:5px;height:9px;pointer-events:none}
.nrg{width:calc(var(--cw)*.52);height:4px;border-radius:20px;background:rgba(255,255,255,.13);overflow:hidden}
.nrg i{display:block;height:100%;border-radius:20px;background:var(--good);transition:width .5s}
.mrate{font-family:var(--cond);font-weight:700;font-size:calc(var(--cw)*.115);letter-spacing:.04em;
  padding:0 5px;border-radius:4px;background:rgba(255,255,255,.1);color:#dbe3f2}
.empty{width:100%;aspect-ratio:.715;border-radius:9px 9px 16px 16px;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(66,88,132,.28),rgba(28,42,72,.28));
  border:1px solid rgba(150,180,230,.11)}
.empty span{font-family:var(--cond);font-weight:700;font-size:calc(var(--cw)*.22);color:rgba(150,175,220,.22)}

/* png card art — the artwork controls the shape (900x1266 source, never cropped
   or stretched). cards/<id>.png when supplied; otherwise the blank template plus
   an identity overlay so no player ever reads "Random".                        */
.card.pngcard{background:none;box-shadow:none;border-radius:0;overflow:visible;
  aspect-ratio:900/1266;position:relative}
.card.pngcard::before,.card.pngcard::after{display:none}
.card.pngcard img{width:100%;height:auto;display:block;object-fit:contain;
  filter:drop-shadow(0 6px 13px rgba(0,0,0,.5));pointer-events:none;user-select:none;-webkit-user-drag:none}
.card.pngcard img.art{position:absolute;inset:0;display:none}
.card.pngcard.hasart img.art{display:block}
.card.pngcard.hasart .gc,.card.pngcard.hasart img.base{visibility:hidden}
.card.pngcard .gc{position:absolute;inset:0;display:block;color:#32373d;pointer-events:none;
  font-family:var(--disp);text-shadow:0 1px 0 rgba(255,255,255,.18)}
.gc .g-ovr{position:absolute;left:23%;top:19.6%;transform:translateX(-50%);
  font-weight:800;font-size:calc(var(--cw)*.14);line-height:1;letter-spacing:-.02em}
.gc .g-pos{position:absolute;left:23%;top:31.3%;transform:translateX(-50%);
  font-weight:800;font-size:calc(var(--cw)*.063);line-height:1;letter-spacing:.02em}
.gc .g-nm{position:absolute;left:46.5%;top:64.4%;transform:translateX(-50%);
  font-weight:700;font-size:calc(var(--cw)*.068);line-height:1;white-space:nowrap;
  max-width:62%;overflow:hidden;text-overflow:ellipsis}
.gc .g-st{position:absolute;left:9%;top:70.6%;width:74%;display:grid;
  grid-template-columns:repeat(6,1fr);text-align:center}
.gc .g-st i{display:block;font-style:normal;font-weight:600;font-size:calc(var(--cw)*.046);opacity:.85}
.gc .g-st b{display:block;font-weight:800;font-size:calc(var(--cw)*.06);margin-top:6%}
.card{position:relative;width:100%;aspect-ratio:.715;border-radius:9px 9px 17px 17px;overflow:hidden;
  background:linear-gradient(163deg,var(--g1) 0%,var(--g2) 44%,var(--g3) 100%);
  color:var(--gink);box-shadow:0 7px 20px rgba(0,0,0,.5);user-select:none}
.card::before{content:"";position:absolute;left:-12%;top:-6%;width:124%;height:80%;
  background:repeating-conic-gradient(from 184deg at 52% 3%,
    rgba(255,255,255,.34) 0deg 1.3deg,rgba(255,255,255,0) 1.3deg 3.5deg);
  -webkit-mask-image:linear-gradient(#000 38%,transparent 95%);mask-image:linear-gradient(#000 38%,transparent 95%)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  border:1px solid rgba(255,255,255,.42);mix-blend-mode:overlay}
.card>*{position:relative;z-index:2}
.card .meta{position:absolute;left:7.5%;top:5%;line-height:.9;text-align:center}
.card .ovr{font-weight:800;font-size:calc(var(--cw)*.235);letter-spacing:-.025em}
.card .ps{font-weight:700;font-size:calc(var(--cw)*.1);margin-top:.22em;letter-spacing:.02em}
.card .fig{position:absolute;right:1%;top:6%;width:62%;height:52%;display:grid;place-items:end center;overflow:hidden;z-index:1}
.card .fig b{font-weight:900;font-size:calc(var(--cw)*.115);color:rgba(74,51,18,.55);position:absolute;bottom:2%}
.card .silo{width:66%;aspect-ratio:1/1.12;background:rgba(74,51,18,.24);
  clip-path:polygon(50% 0,63% 5%,68% 19%,63% 32%,53% 37%,80% 47%,91% 71%,95% 100%,5% 100%,9% 71%,20% 47%,47% 37%,37% 32%,32% 19%,37% 5%)}
.card .lower{position:absolute;left:0;right:0;bottom:0;height:43%;display:flex;flex-direction:column;
  align-items:center;padding-top:1.5%;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(160,120,40,.04))}
.card .nm{font-weight:800;font-size:calc(var(--cw)*.122);max-width:92%;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;letter-spacing:-.012em}
.card .rule{width:74%;height:1px;background:rgba(74,51,18,.24);margin:3% 0}
.card .stats{display:grid;grid-template-columns:repeat(6,1fr);width:96%;text-align:center;column-gap:2px}
.card .stats b{display:block;font-weight:700;font-size:calc(var(--cw)*.098);line-height:1.05}
.card .stats i{display:block;font-style:normal;font-weight:600;font-size:calc(var(--cw)*.072);opacity:.68;line-height:1.15}
.card .foot{display:flex;gap:4%;align-items:center;margin-top:auto;margin-bottom:4.5%}
.card .foot span{font-family:var(--cond);font-weight:700;font-size:calc(var(--cw)*.088);
  background:rgba(74,51,18,.15);padding:.12em .5em;border-radius:4px;letter-spacing:.05em}
.card .alts{position:absolute;right:0;top:24%;z-index:4;display:flex;flex-direction:column;gap:2px}
.card .alts b{font-family:var(--cond);font-weight:700;font-size:calc(var(--cw)*.085);letter-spacing:.05em;
  background:linear-gradient(180deg,#f7e3a6,#e2bd6c);color:var(--gink);padding:.13em .38em;
  border-radius:3px 0 0 3px;border:1px solid rgba(120,90,30,.28);border-right:0}
.card.mini .alts,.card.mini .foot{display:none}
.card.mini .lower{height:38%;justify-content:flex-start}
.card.mini .stats i{display:none}
.card.mini .stats b{font-size:calc(var(--cw)*.102);line-height:1.2;letter-spacing:-.03em}
.card.mini .nm{font-size:calc(var(--cw)*.132)}
.card.mini .rule{margin:4% 0 2%}
#ghost{position:fixed;z-index:900;pointer-events:none;filter:drop-shadow(0 20px 28px rgba(0,0,0,.65));
  transform:translate(-50%,-50%) scale(1.07) rotate(-2deg)}

.dock{flex:0 0 auto;background:linear-gradient(180deg,rgba(7,10,16,.5),var(--bg2));
  border-top:1px solid var(--line);display:flex;align-items:stretch;gap:10px;padding:7px 14px 8px;z-index:30}
.benchcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.benchhead{display:flex;align-items:center;gap:9px}
.benchhead h4{margin:0;font-family:var(--cond);font-weight:700;letter-spacing:.2em;font-size:13px;color:var(--dim)}
.benchhead .cnt{font-size:11px;color:var(--dim)}
.chev{width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;
  color:var(--muted);font-size:11px}
.bench{display:flex;gap:8px;overflow-x:auto;padding:1px 0 5px;transition:max-height .3s var(--ease),opacity .2s;max-height:150px}
.bench.closed{max-height:0;opacity:0;padding:0;overflow:hidden}
.bench .slot{position:static;transform:none;margin:0;width:66px;flex:0 0 66px;--cw:66px}
.bench{min-height:118px}
.bench .slot .tag{font-size:9px;padding:1px 7px;letter-spacing:.06em}
.bench .addbtn{flex:0 0 62px;height:87px;border:1px dashed var(--line2);border-radius:9px;color:var(--dim);
  font-size:22px;display:grid;place-items:center;align-self:flex-start}
.bench .addbtn:hover{color:var(--ink);border-color:var(--muted)}
.formbox{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px}
.formrow{display:flex;align-items:center;gap:6px}
.formrow .arw{width:28px;height:28px;border-radius:7px;border:1px solid var(--line2);color:var(--muted);display:grid;place-items:center}
.formrow .arw:hover{color:var(--ink);border-color:var(--muted);background:#161e2e}
.formname{font-family:var(--cond);font-weight:700;font-size:29px;letter-spacing:.05em;color:#cfd8ea;
  min-width:116px;text-align:center;line-height:1;padding:2px 4px;border-radius:6px}
.formname:hover{background:#161e2e}
.formsub{font-size:10.5px;color:var(--dim);letter-spacing:.06em}

.scrim{position:fixed;inset:0;background:rgba(4,6,11,.76);backdrop-filter:blur(7px);z-index:400;
  opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg2);
  border-left:1px solid var(--line2);z-index:420;display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .32s var(--ease)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dhead h3{margin:0;font-size:16px;flex:1}
.dhead .sub{font-size:12px;color:var(--dim);margin-top:2px}
.dbody{flex:1;overflow-y:auto;padding:16px 16px 40px}
.dfoot{flex:0 0 auto;padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.x{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted)}
.x:hover{color:var(--ink);border-color:var(--muted)}
.btn{padding:10px 15px;border-radius:9px;font-weight:700;font-size:14px;text-align:center;transition:.15s}
.btn.pri{background:var(--accent);color:#fff;flex:1}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sec{border:1px solid var(--line2);color:var(--muted)}
.btn.sec:hover{color:var(--ink);border-color:var(--muted)}
.btn.sm{padding:7px 11px;font-size:13px}

.tgroup{margin-bottom:20px}
.tgroup>h4{margin:0 0 3px;font-family:var(--cond);font-size:13px;letter-spacing:.18em;color:var(--accent2);font-weight:700}
.tgroup>p{margin:0 0 12px;font-size:12px;color:var(--dim);line-height:1.5}
.ctrl{margin-bottom:13px}
.ctrl .lab{display:flex;align-items:baseline;gap:7px;margin-bottom:6px}
.ctrl .lab b{font-size:13.5px;font-weight:600}
.seg{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{flex:1;padding:7px 4px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.13s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel3);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.why{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:6px}
.presetrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.focus{position:fixed;inset:0;z-index:430;display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column}
.focus.on{display:flex}
.flipstage{width:min(330px,80vw);perspective:1400px;--cw:min(330px,80vw)}
.flipper{position:relative;width:100%;aspect-ratio:.715;transform-style:preserve-3d;transition:transform .62s var(--ease)}
.flipper.back{transform:rotateY(180deg)}
.face-a,.face-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face-b{transform:rotateY(180deg)}
.instr{width:100%;height:100%;border-radius:14px 14px 26px 26px;overflow:hidden;color:var(--gink);
  background:linear-gradient(163deg,var(--g1),var(--g2) 46%,var(--g3));
  box-shadow:0 10px 30px rgba(0,0,0,.55);display:flex;flex-direction:column;padding:5% 6%}
.instr{position:relative}
.instr::before{content:"";position:absolute;left:-12%;top:-6%;width:124%;height:62%;pointer-events:none;
  background:repeating-conic-gradient(from 184deg at 52% 3%,
    rgba(255,255,255,.30) 0deg 1.3deg,rgba(255,255,255,0) 1.3deg 3.5deg);
  -webkit-mask-image:linear-gradient(#000 30%,transparent 92%);mask-image:linear-gradient(#000 30%,transparent 92%)}
.instr>*{position:relative;z-index:2}
.instr h5{margin:0;font-size:calc(var(--cw)*.075);font-weight:800}
.rnote{font-size:calc(var(--cw)*.037);line-height:1.35;opacity:.68;margin-top:1.2%;font-weight:600}
.instr .sub{font-family:var(--cond);letter-spacing:.14em;font-size:calc(var(--cw)*.042);opacity:.7;font-weight:700}
.instr .blk{margin-top:3.5%}
.instr .blk>label{display:block;font-family:var(--cond);font-weight:700;letter-spacing:.16em;
  font-size:calc(var(--cw)*.04);opacity:.62;margin-bottom:1.5%}
.instr select{width:100%;background:rgba(255,255,255,.4);border:1px solid rgba(74,51,18,.22);
  border-radius:7px;padding:2.4% 3%;font-weight:700;font-size:calc(var(--cw)*.048);color:var(--gink);
  -webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,rgba(74,51,18,.6) 50%),linear-gradient(135deg,rgba(74,51,18,.6) 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.effort{margin-top:2%}
.effort .top{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(var(--cw)*.042);font-weight:700}
.effort .top em{font-style:normal;font-family:var(--cond);letter-spacing:.13em;opacity:.65}
.effort input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;margin:1% 0 0;height:14px}
.effort input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:20px;background:rgba(74,51,18,.2)}
.effort input[type=range]::-moz-range-track{height:6px;border-radius:20px;background:rgba(74,51,18,.2)}
.effort input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--gink);margin-top:-4.5px;border:2px solid rgba(255,255,255,.75);cursor:pointer}
.effort input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--gink);
  border:2px solid rgba(255,255,255,.75);cursor:pointer}
.instr .wl{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;
  border-top:1px solid rgba(74,51,18,.2);padding-top:2.5%;font-size:calc(var(--cw)*.042)}
.instr .wl b{display:block;font-size:calc(var(--cw)*.056);font-weight:800}
.instr .wl em{font-style:normal;font-family:var(--cond);letter-spacing:.13em;opacity:.62;font-weight:700}
.focusbtns{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:440;background:var(--bg2);
  border-top:1px solid var(--line2);border-radius:16px 16px 0 0;max-height:84vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .3s var(--ease)}
.sheet.on{transform:none}

.pm.sel .dot{outline:2px solid var(--accent2);outline-offset:1.5px}
.pm.tired .dot{animation:tiredpulse 1.6s ease-in-out infinite}
@keyframes tiredpulse{0%,100%{box-shadow:0 2px 6px rgba(0,0,0,.55)}50%{box-shadow:0 0 10px 3px rgba(255,91,110,.55)}}
.ballm{position:absolute;width:9px;height:9px;margin-left:-4.5px;margin-top:-4.5px;border-radius:50%;z-index:8;
  background:#fff;box-shadow:0 0 7px 2px rgba(255,255,255,.5);pointer-events:none;
  transition:left .38s linear,top .38s linear}

.sidecol{display:flex;flex-direction:column;gap:10px;min-width:0}
.sidebox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sidetabs{display:flex;border-bottom:1px solid var(--line)}
.sidetabs button{flex:1;padding:9px 4px;font-family:var(--cond);font-weight:700;font-size:11px;
  letter-spacing:.16em;color:var(--dim)}
.sidetabs button.on{color:#fff;box-shadow:inset 0 -2px 0 var(--lfc)}
.sidebody{max-height:420px;overflow-y:auto}
.sidebody .feed{border:0;border-radius:0}
.ratingline{display:flex;align-items:center;gap:8px;padding:6px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.ratingline:last-child{border-bottom:0}
.ratingline .en{flex:0 0 34px;height:4px;border-radius:3px;background:#1a2236;overflow:hidden}
.ratingline .en i{display:block;height:100%}
.ratingline .rv{margin-left:auto;font-weight:800;font-family:var(--cond);padding:0 7px;border-radius:4px;font-size:12px}
.rv.r9{background:rgba(61,220,132,.25);color:var(--good)}
.rv.r8{background:rgba(61,220,132,.14);color:#7fe0a8}
.rv.r7{background:rgba(120,170,255,.14);color:#9cc2ff}
.rv.r6{background:rgba(255,255,255,.08);color:var(--muted)}
.rv.rlow{background:rgba(255,91,110,.15);color:var(--bad)}
.pinfo{padding:12px 14px}
.pinfo h4{margin:0 0 2px;font-size:14.5px}
.pinfo .sub{font-size:11px;color:var(--dim);font-family:var(--cond);letter-spacing:.1em;margin-bottom:8px}
.pinfo .grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:12.5px}
.pinfo .grid span{color:var(--dim)} .pinfo .grid b{text-align:right;font-variant-numeric:tabular-nums}
.htpanel{background:linear-gradient(180deg,rgba(120,170,255,.06),var(--panel));border:1px solid rgba(120,170,255,.25);
  border-radius:16px;padding:16px 18px;margin-bottom:12px;text-align:center}
.htpanel h3{margin:0 0 4px;font-family:var(--cond);letter-spacing:.22em;font-size:14px;color:#9cc2ff}
@media (max-width:1100px){.mlayout{grid-template-columns:1fr}}

@media (max-width:760px){
  .brand .wd{display:none}
  .formname{font-size:22px;min-width:86px}
  .navtab{padding:7px 9px;font-size:13px}
  .tbtn .lbl{display:none}
  #recordLabel{display:none}
  .brand{margin-right:0}
  .dock{padding:7px 9px;gap:7px}
  .corner.tl{left:8px;top:8px} .corner.tr{right:8px;top:8px}
}

/* ═══ CLUB FINANCES ════════════════════════════════════════════════════════
   All figures are PLACEHOLDER ESTIMATES (£m unless noted), kept in one
   config so real numbers can be dropped in later. The 2026/27 Premier
   League rule modelled here is the SQUAD COST RATIO (SCR): squad costs
   (player + head-coach wages, agent fees, transfer amortisation) measured
   against football revenue plus net player-sale profit. The green
   threshold is 85% — it is NOT a fixed salary cap. UEFA's separate 70%
   limit would only matter if European competition is added.

   Finances constrain transfers and contracts ONLY. They never touch match
   attributes and are never sent to the match engine.                     */
const INITIAL_CLUB_FINANCES = {
  LIV: {
    cashBalance: 120.0,
    transferBudget: 85.0,
    wageBudgetWeeklyK: 4200,          // board wage ceiling, £k/week
    revenues: {                        // season estimates, £m
      'Premier League distributions': 180,
      'Matchday': 102,
      'Commercial & sponsorship': 272,
      'Merchandise': 60,
      'European competitions': 0
    },
    baselineWeeklyWagesK: 1350,        // squad + staff outside the modelled 18
    coachWagesAnnual: 15,
    agentFeesAnnual: 26,
    existingAmortisationAnnual: 228,   // book amortisation of the current squad
    otherFootballCostsAnnual: 158
  }
};
const SCR_GREEN = 0.85;                // Premier League Squad Cost Limit
const SCR_RED   = 1.15;                // sanction zone shown on the gauge

/* Configurable valuation — replace freely, nothing else depends on its shape */
const VALUATION = {
  base: 8, growth: 1.18, anchor: 75,   // £8m at 75 OVR, ×1.18 per point
  peakAgeMax: 27, ageDecay: 0.92, youthBonus: 1.1,
  potFactor: 0.025, gkFactor: 0.8, minValue: 2
};
function playerValue(pl){
  const V = VALUATION;
  let v = V.base * Math.pow(V.growth, pl.ovr - V.anchor);
  if(pl.age > V.peakAgeMax) v *= Math.pow(V.ageDecay, pl.age - V.peakAgeMax);
  if(pl.age <= 21) v *= V.youthBonus;
  v *= 1 + Math.max(0, (pl.pot ?? pl.ovr) - pl.ovr) * V.potFactor;
  if(pl.pos === 'GK') v *= V.gkFactor;
  const yrs = contractYearsLeft(pl);
  v *= yrs >= 3 ? 1 : yrs === 2 ? 0.85 : 0.7;
  return Math.max(V.minValue, Math.round(v * 2) / 2);
}
function estWeeklyWageK(pl){
  const o = pl.ovr;
  let base = o >= 90 ? 340 : o >= 88 ? 250 : o >= 86 ? 200 : o >= 84 ? 150 :
             o >= 82 ? 115 : o >= 80 ? 90 : o >= 78 ? 65 : o >= 76 ? 50 : 45;
  if(pl.pos === 'GK') base *= 0.85;
  const jitter = ((hashStr(pl.id) % 21) - 10) / 100;
  return Math.round(base * (1 + jitter));
}
/* Optional club-contract data — separate from match attributes. A player's
   salary must NEVER affect his match-engine ability.                     */
function ensureContract(pl){
  if(pl.contract) return pl.contract;
  const yrs = 1 + (hashStr(pl.id + ':c') % 5);
  const val = VALUATION.base * Math.pow(VALUATION.growth, pl.ovr - VALUATION.anchor);
  const fee = Math.round(val * 0.8);
  pl.contract = {
    weeklyWage: estWeeklyWageK(pl),                   // £k/week
    contractEndSeason: 2026 + yrs,
    signedFee: fee,
    remainingBookValue: Math.round(fee * yrs / 5),
    squadRole: pl.ovr >= 87 ? 'Star' : pl.ovr >= 82 ? 'First Team' : pl.ovr >= 78 ? 'Rotation' : 'Squad'
  };
  return pl.contract;
}
const contractYearsLeft = pl => pl.contract ? Math.max(0, pl.contract.contractEndSeason - 2026) : 3;

function blankFinance(){
  const cfg = INITIAL_CLUB_FINANCES.LIV;
  return {...JSON.parse(JSON.stringify(cfg)),
    seasonTransferSpend: 0, seasonSalesIncome: 0, netSalePL: 0};
}
function blankTransfers(){ return {shortlist: [], outgoing: {}, completed: []}; }

/* One snapshot the whole UI reads. squadCost / (revenue + net sale P/L). */
function financeSnapshot(){
  const F = S.finance;
  const weeklyK = clubPool().reduce((a, pl) => a + ensureContract(pl).weeklyWage, 0)
                + F.baselineWeeklyWagesK;
  const annualWages = weeklyK * 52 / 1000;
  const newAmort = S.transfers.completed
    .filter(t => t.type === 'buy' && !t.soldAgain)
    .reduce((a, t) => a + t.annualAmort, 0);
  const amort = F.existingAmortisationAnnual + newAmort;
  const squadCost = annualWages + F.coachWagesAnnual + F.agentFeesAnnual + amort;
  const revenue = Object.values(F.revenues).reduce((a, b) => a + b, 0);
  const den = revenue + F.netSalePL;
  const scr = den > 0 ? squadCost / den : 9.99;
  const status = scr <= 0.75 ? 'Comfortable' : scr <= SCR_GREEN ? 'Watch'
    : scr <= 1.0 ? 'Above Green Threshold' : 'Critical';
  return {
    weeklyK, annualWages, amort, squadCost, revenue, den, scr, status,
    headroom: SCR_GREEN * den - squadCost,
    projectedProfit: revenue + F.netSalePL - squadCost - F.otherFootballCostsAnnual,
    expenses: {
      'Player wages': annualWages,
      'Head coach wages': F.coachWagesAnnual,
      'Transfer amortisation': amort,
      'Agent fees': F.agentFeesAnnual,
      'Transfer fees paid this season': F.seasonTransferSpend,
      'Other football costs': F.otherFootballCostsAnnual
    }
  };
}
/* SCR if annual squad costs changed by dCost (£m) and sale P/L by dPL. */
function scrWith(dCost, dPL = 0){
  const snap = financeSnapshot();
  const den = snap.den + dPL;
  return den > 0 ? (snap.squadCost + dCost) / den : 9.99;
}

/* ── transfer market logic — deterministic, replaceable ─────────────────── */
function interestFor(pl){
  const h = hashStr(pl.id + ':int');
  if(pl.ovr >= 90) return h % 3 === 0 ? 'Uncertain' : 'Unavailable';
  if(pl.ovr >= 86) return ['Open', 'Uncertain', 'Unavailable'][h % 3];
  return h % 4 === 0 ? 'Uncertain' : 'Open';
}
const askingPrice = pl => Math.round(playerValue(pl) * (interestFor(pl) === 'Open' ? 1.02 : 1.2));
const expectedWageK = pl => Math.round(ensureContract(pl).weeklyWage * 1.15);

function completeTransfer(pid, fee, years, wageK, bonus, role){
  if(isLiveMatch()) return;                 // guarded upstream too (agreeContract)
  const pl = P(pid); if(!pl) return;
  const from = pl.clubId;
  S.finance.transferBudget -= fee + bonus;
  S.finance.cashBalance -= fee + bonus;
  S.finance.seasonTransferSpend += fee;
  pl.clubId = 'LIV';
  pl.contract = {weeklyWage: wageK, contractEndSeason: 2026 + years,
    signedFee: fee, remainingBookValue: fee, squadRole: role};
  S.transfers.completed.push({type: 'buy', pid, from, fee, years, wageK, bonus, role,
    annualAmort: Math.round(fee / years * 10) / 10, mw: S.season.matchweek});
  S.transfers.shortlist = S.transfers.shortlist.filter(x => x !== pid);
  saveState();
}
function sellPlayer(pid, fee){
  if(isLiveMatch()) return;                 // guarded upstream too (acceptSale)
  const pl = P(pid); if(!pl || pl.clubId !== 'LIV') return;
  const book = pl.contract ? pl.contract.remainingBookValue : 0;
  removePlayer(pid);
  const buyers = CLUBS.filter(c => c.id !== 'LIV');
  const to = buyers[hashStr(pid + ':buyer') % buyers.length].id;
  pl.clubId = to;
  const buy = S.transfers.completed.find(t => t.type === 'buy' && t.pid === pid && !t.soldAgain);
  if(buy) buy.soldAgain = true;                       // stop amortising a re-sold signing
  S.finance.netSalePL += fee - book;
  S.finance.cashBalance += fee;
  S.finance.transferBudget += Math.round(fee * 0.7);  // the board releases 70% to the budget
  S.finance.seasonSalesIncome += fee;
  delete S.transfers.outgoing[pid];
  S.transfers.completed.push({type: 'sale', pid, to, fee, profit: fee - book, mw: S.season.matchweek});
  saveState();
}
/* Re-apply persisted moves after the registry is rebuilt on boot. */
function applyCompletedTransfers(){
  for(const t of S.transfers.completed){
    const pl = P(t.pid); if(!pl) continue;
    if(t.type === 'buy' && !t.soldAgain){
      pl.clubId = 'LIV';
      pl.contract = {weeklyWage: t.wageK, contractEndSeason: 2026 + t.years,
        signedFee: t.fee, remainingBookValue: t.fee, squadRole: t.role};
    }
    if(t.type === 'sale') pl.clubId = t.to;
  }
}
const fmtM = v => (v < 0 ? '-£' : '£') + Math.abs(v).toFixed(1) + 'm';
const fmtK = v => '£' + Math.round(v) + 'k/wk';

/* ═══ SEASON STATE ═════════════════════════════════════════════════════════
   interface SeasonState {
     competitionId, controlledClubId, matchweek,
     fixtures: Fixture[], results: Record<fixtureId, Result>, standings: Row[]
   }                                                                        */
const hashStr = str => { let h = 2166136261;
  for(const c of String(str)){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0) % 2147483647; };

function makeFixture(mw, home, away){
  const d = new Date(2026, 7, 15 + (mw-1)*7);
  return {id:`MW${String(mw).padStart(2,'0')}-${home}-${away}`, mw, home, away,
    date: d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'})};
}
/* Double round robin over the 20 clubs (circle method for the pairings,
   greedy balancing for venues so no club gets long home/away streaks). */
function generateFixtures(){
  const ids = [...PREMIER_LEAGUE.clubIds];
  const n = ids.length, rounds = n - 1;
  const rot = ids.slice(1);
  const fixtures = [];
  const homeCount = Object.fromEntries(ids.map(id => [id, 0]));
  for(let r = 0; r < rounds; r++){
    const left  = [ids[0], ...rot.slice(0, n/2 - 1)];
    const right = rot.slice(n/2 - 1).reverse();
    for(let i = 0; i < n/2; i++){
      let home = left[i], away = right[i];
      // whoever has hosted less gets this one
      if(homeCount[away] < homeCount[home] ||
        (homeCount[away] === homeCount[home] && (r + i) % 2)) [home, away] = [away, home];
      homeCount[home]++;
      fixtures.push(makeFixture(r + 1, home, away));
      fixtures.push(makeFixture(r + 1 + rounds, away, home));
    }
    rot.push(rot.shift());
  }
  fixtures.sort((a,b) => a.mw - b.mw || a.id.localeCompare(b.id));
  return fixtures;
}
function newSeasonSeed(){
  const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] >>> 0;
}
function blankSeason(){
  return {competitionId:'EPL', controlledClubId:'LIV', matchweek:1, seed: newSeasonSeed(),
    fixtures: generateFixtures(), results:{}, standings:[]};
}
/* Deterministic per-fixture seed: season seed + fixture id + engine version.
   Tactics changes change football — never the base random environment.     */
const fixtureSeed = f => hashStr(`${S.season.seed}|${f.id}|FC_SIM_0.7`);
function computeStandings(){
  const t = {};
  CLUBS.forEach(c => t[c.id] = {clubId:c.id, p:0, w:0, d:0, l:0, gf:0, ga:0});
  for(const f of S.season.fixtures){
    const r = S.season.results[f.id]; if(!r) continue;
    const [hg, ag] = r.score, H = t[f.home], A = t[f.away];
    H.p++; A.p++; H.gf += hg; H.ga += ag; A.gf += ag; A.ga += hg;
    if(hg > ag){ H.w++; A.l++; } else if(hg < ag){ H.l++; A.w++; } else { H.d++; A.d++; }
  }
  const rows = Object.values(t).map(r => ({...r, gd:r.gf - r.ga, pts:r.w*3 + r.d}));
  rows.sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf ||
    clubById(a.clubId).name.localeCompare(clubById(b.clubId).name));
  return rows;
}
const livFixtures = () => S.season.fixtures.filter(f => f.home === 'LIV' || f.away === 'LIV');
const nextLivFixture = () => livFixtures().find(f => !S.season.results[f.id]) || null;
const livRow = () => { const r = computeStandings(); const i = r.findIndex(x => x.clubId === 'LIV');
  return {pos: i + 1, ...r[i]}; };

function blankSquad(){
  return {
    formationId:'433',
    starters:{},
    bench:[],
    tactics:{...PRESETS['Balanced']},
    playerInstructions:{}
  };
}
const formationOf = id => FORMATIONS.find(f => f.id === id) || FORMATIONS[0];
const curForm = () => formationOf(S.current.formationId);
const slotById = sid => curForm().slots.find(s => s.id === sid);

/* ── positional suitability ───────────────────────────────────────────────
   Never blocks a placement and never changes an attribute. Display only.  */
function suitability(player, slotPos){
  if(!player) return null;
  if(player.pos === slotPos) return 'natural';
  if(player.elig.includes(slotPos)) return 'comfortable';
  if((POS_NEAR[slotPos]||[]).includes(player.pos)) return 'secondary';
  return 'out';
}
const FIT_LABEL = {natural:'Natural',comfortable:'Comfortable',secondary:'Secondary',out:'Out of position'};

/* ── instructions ─────────────────────────────────────────────────────────
   Keyed by player, defaulted from the slot they occupy.                   */
function rolesFor(slotPos){ return ROLES[slotPos] || ROLES.CM; }
function instrFor(playerId, slotPos){
  const st = S.current;
  if(!st.playerInstructions[playerId]){
    st.playerInstructions[playerId] = {...(DEFAULT_INSTR[slotPos] || DEFAULT_INSTR.CM)};
  }
  const ins = st.playerInstructions[playerId];
  // During a live v0.7 match the engine owns instructions — never "correct"
  // them locally; reconcileLiveFromEngine() keeps them in sync instead.
  if(typeof isLiveMatch === 'function' && isLiveMatch()) return ins;
  const r = rolesFor(slotPos);
  // keep the role valid if the player moved to a different kind of slot
  if(!r.atk.includes(ins.attackRole)) ins.attackRole = (DEFAULT_INSTR[slotPos]||DEFAULT_INSTR.CM).attackRole;
  if(!r.def.includes(ins.defenseRole)) ins.defenseRole = (DEFAULT_INSTR[slotPos]||DEFAULT_INSTR.CM).defenseRole;
  return ins;
}

/* Workload estimate — a tactical read-out, not a stamina number.
   Combines slot height, both roles, both efforts, press and transition. */
function workload(slotPos, ins, tactics){
  const t = tactics || S.current.tactics;
  const load = r => ROLE_LOAD[r] ?? .5;
  let v = load(ins.attackRole)*(ins.attackEffort/100)*.5
        + load(ins.defenseRole)*(ins.defenseEffort/100)*.5;
  v += ({Passive:-.06,Selective:0,Aggressive:.07,Relentless:.14})[t.pressingIntensity] || 0;
  v += ({Regroup:-.04,Balanced:0,Counterpress:.10})[t.afterLosingPossession] || 0;
  v += ({Secure:-.02,Balanced:0,Counter:.06})[t.afterWinningPossession] || 0;
  v += ({Cautious:-.03,Balanced:0,Commit:.07})[t.boxCommitment] || 0;
  v += ({Deep:-.03,Mid:0,High:.05})[t.defensiveBlockHeight] || 0;
  v += ({Narrow:-.02,Balanced:0,Wide:.05})[t.attackingWidth] || 0;
  if(['LB','RB','LM','RM','CM'].includes(slotPos)) v += .05;   // most ground covered
  if(slotPos === 'GK') v -= .35;
  const band = v < .18 ? 'VERY LOW' : v < .34 ? 'LOW' : v < .5 ? 'MODERATE' : v < .66 ? 'HIGH' : 'VERY HIGH';
  return {value:Math.max(0,Math.min(1,v)), band};
}

/* ── squad mutation ───────────────────────────────────────────────────────
   Everything that moves a player goes through these two.                  */
function putInSlot(slotId, playerId){
  if(isLiveMatch()){ liveBlocked(); return; }   // live personnel moves go through the engine
  const st = S.current;
  // if the player is already somewhere, vacate it first
  for(const k in st.starters) if(st.starters[k] === playerId) st.starters[k] = null;
  const bi = st.bench.indexOf(playerId);
  if(bi > -1) st.bench.splice(bi,1);
  st.starters[slotId] = playerId;
  if(playerId) instrFor(playerId, slotById(slotId).position);
}
function swapSlots(a, b){
  if(isLiveMatch()){ liveBlocked('Position swaps are not supported during a live match — change formation or substitute.'); return; }
  const st = S.current, A = st.starters[a] ?? null, B = st.starters[b] ?? null;
  st.starters[a] = B; st.starters[b] = A;
  if(B) instrFor(B, slotById(a).position);
  if(A) instrFor(A, slotById(b).position);
}
function addToBench(playerId){
  if(isLiveMatch()){ liveBlocked('Players leave the pitch only by substitution during a live match.'); return; }
  const st = S.current;
  for(const k in st.starters) if(st.starters[k] === playerId) st.starters[k] = null;
  if(!st.bench.includes(playerId)) st.bench.push(playerId);
}
function removePlayer(playerId){
  if(isLiveMatch()){ liveBlocked('Players cannot be removed during a live match.'); return; }
  const st = S.current;
  for(const k in st.starters) if(st.starters[k] === playerId) st.starters[k] = null;
  const i = st.bench.indexOf(playerId); if(i > -1) st.bench.splice(i,1);
}
const isUsed = id => S.current.bench.includes(id) || Object.values(S.current.starters).includes(id);
const startingIds = () => curForm().slots.map(s => S.current.starters[s.id]).filter(Boolean);

/* ── formation change ─────────────────────────────────────────────────────
   Players are never dropped. Same slot id keeps its player; the rest are
   remapped to the best remaining slot by suitability, then by distance.   */
function setFormation(newId, {log=true} = {}){
  const st = S.current, oldF = curForm(), newF = formationOf(newId);
  const oldSlots = oldF.slots.filter(s => st.starters[s.id]);
  const taken = {}, placed = new Set();

  // 1. identical slot ids stay put
  for(const s of oldSlots){
    if(newF.slots.some(n => n.id === s.id)){ taken[s.id] = st.starters[s.id]; placed.add(s.id); }
  }
  // 2. remaining players claim the best free slot
  const leftovers = oldSlots.filter(s => !placed.has(s.id));
  const rank = {natural:0, comfortable:1, secondary:2, out:3};
  for(const s of leftovers){
    const pid = st.starters[s.id], pl = P(pid);
    const free = newF.slots.filter(n => !(n.id in taken));
    if(!free.length) break;
    free.sort((a,b) => {
      const ra = rank[suitability(pl,a.position)], rb = rank[suitability(pl,b.position)];
      if(ra !== rb) return ra - rb;
      return Math.hypot(a.x-s.x,a.y-s.y) - Math.hypot(b.x-s.x,b.y-s.y);
    });
    taken[free[0].id] = pid;
  }
  const before = oldF.name;
  st.formationId = newId;
  st.starters = {};
  for(const n of newF.slots) st.starters[n.id] = taken[n.id] ?? null;
  for(const n of newF.slots) if(st.starters[n.id]) instrFor(st.starters[n.id], n.position);
  if(log && S.match && S.match.status === 'live' && before !== newF.name){
    S.changes.push({minute:S.match.clock, text:`Shape ${before} → ${newF.name}`});
  }
}

/* ── ratings shown in the UI (display only — the engine does its own) ──── */
function slotOvr(pl, slotPos){
  if(!pl) return 0;
  return pl.ovr;   // attributes never change with position; suitability is shown instead
}
function squadAverage(){
  const ids = startingIds();
  if(!ids.length) return 0;
  return Math.round(ids.reduce((a,id) => a + P(id).ovr, 0) / ids.length);
}
function lineStrength(){
  const f = curForm(), st = S.current, out = {ATT:[],MID:[],DEF:[]};
  for(const s of f.slots){
    const pid = st.starters[s.id]; if(!pid) continue;
    const band = s.y > 66 ? 'DEF' : s.y > 40 ? 'MID' : 'ATT';
    out[band].push(P(pid).ovr);
  }
  const avg = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : 0;
  return {ATT:avg(out.ATT), MID:avg(out.MID), DEF:avg(out.DEF)};
}
function outOfPositionCount(){
  return curForm().slots.filter(s => {
    const pid = S.current.starters[s.id];
    return pid && suitability(P(pid), s.position) === 'out';
  }).length;
}

/* ── persistence ─────────────────────────────────────────────────────────
   window.storage in this host; swap for localStorage when self-hosting.  */
const STORE_KEY = 'touchline:liverpool:v2';
/* RC1: stable save identity + live-match reconnect handle (server is the
   authority for live matches; these are pointers, never football state). */
const SAVE_ID = (() => {
  try{
    let id = localStorage.getItem('touchline:save_id');
    if(!id){ id = 'save-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem('touchline:save_id', id); }
    return id;
  }catch(e){ return 'save-volatile'; }
})();
function setActiveMatchHandle(matchId, fixtureId){
  try{ localStorage.setItem('touchline:active_match', JSON.stringify({matchId, fixtureId})); }catch(e){}
}
function clearActiveMatchHandle(){
  try{ localStorage.removeItem('touchline:active_match'); }catch(e){}
}
function getActiveMatchHandle(){
  try{ return JSON.parse(localStorage.getItem('touchline:active_match') || 'null'); }catch(e){ return null; }
}
async function saveState(){
  try{
    const payload = JSON.stringify({squad:S.current, presets:S.customPresets, season:S.season,
      finance:S.finance, transfers:S.transfers});
    if(window.storage) await window.storage.set(STORE_KEY, payload);
    else localStorage.setItem(STORE_KEY, payload);
    // RC1: mirror the career save server-side for recovery/multi-device testing
    fetch('/api/saves/' + SAVE_ID, {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({state: JSON.parse(payload)})}).catch(() => {});
  }catch(e){ /* saving is best-effort */ }
}
async function loadState(){
  try{
    let raw = null;
    if(window.storage){ const r = await window.storage.get(STORE_KEY); raw = r && r.value; }
    else raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
    // RC1: fresh browser — recover the career from the server-side save
    try{
      const r = await fetch('/api/saves/' + SAVE_ID);
      if(r.ok){ const j = await r.json(); return j.state || null; }
    }catch(e){}
    return null;
  }catch(e){ return null; }
}


/* ═══ SIMULATION BOUNDARY ══════════════════════════════════════════════════
   The UI never calculates football. It builds a MatchSetup, hands it to an
   engine, and renders whatever MatchState comes back.

   interface MatchSetup {
     teamA: { formation, lineup: Record<slotId,playerId>, tactics, playerInstructions }
     teamB: { ...same }
     seed: number
   }
   interface MatchState {
     clock, score:[a,b], playerEnergy:Record<id,0-100>, playerRatings:Record<id,number>,
     substitutions:[], cards:[], formation:{a,b}, tactics:{a,b}, events:[], status
   }

   Replace the mock wholesale with:  TOUCHLINE.setMatchEngine(myEngine)
   An engine only needs { init(setup), step(state, setup) -> state }.
   ══════════════════════════════════════════════════════════════════════════ */

function clubFormation(clubId){
  const plan = clubById(clubId).plan;
  return {'Balanced':'433','Controlled':'4231','Possession':'433','Counter Attack':'4231',
    'High Press':'433','Low Block':'541','End-to-End':'442'}[plan] || '433';
}
/* Line strengths for an AI club: its detailed EPL players, topped up with the
   GENERIC_75 baseline. Names feed the event feed only.                     */
function clubLines(clubId){
  const det = premierLeaguePlayers.filter(p => p.clubId === clubId);
  const bandOf = pos => ['ST','LW','RW','CAM'].includes(pos) ? 'ATT'
    : ['CM','CDM','LM','RM'].includes(pos) ? 'MID' : pos === 'GK' ? 'GK' : 'DEF';
  const bands = {ATT:[], MID:[], DEF:[], GK:[]};
  det.forEach(p => bands[bandOf(p.pos)].push(p.ovr));
  const target = {ATT:3, MID:3, DEF:4, GK:1};
  const line = b => { const v = [...bands[b]].sort((x,y) => y - x).slice(0, target[b]);
    while(v.length < target[b]) v.push(75);
    return Math.round(v.reduce((a,c) => a + c, 0) / v.length); };
  const names = det.map(p => shortName(p.name));
  const fill = ['Hartley','Okoye','Lindström','Barros','Kavanagh','Duarte','Nilsen','Mbaye'];
  let gi = hashStr(clubId) % fill.length;
  while(names.length < 5) names.push(fill[(gi++) % fill.length]);
  const club = clubById(clubId);
  return {ATT:line('ATT'), MID:line('MID'), DEF:line('DEF'), GK:line('GK'),
    names, synthetic:true, clubId, tactics:{...(PRESETS[club.plan] || PRESETS['Balanced'])}};
}
function buildMatchSetup(fixture, seed){
  const st = S.current;
  const oppId = fixture.home === 'LIV' ? fixture.away : fixture.home;
  const opp = clubLines(oppId);
  return {
    fixtureId: fixture.id,
    teamA:{ clubId:'LIV', formation:st.formationId, lineup:{...st.starters}, tactics:{...st.tactics},
            playerInstructions:JSON.parse(JSON.stringify(st.playerInstructions)) },
    teamB:{ clubId:oppId, formation:clubFormation(oppId), lineup:null, tactics:opp.tactics,
            playerInstructions:null, synthetic:opp },
    seed: seed ?? hashStr(fixture.id)
  };
}

/* ── DeterministicMockEngine ──────────────────────────────────────────────
   A UI-TESTING STUB. The real backend is the custom football simulator v0.7;
   until it is connected, this seeded, fully deterministic mock stands in so
   the season loop can be exercised. Same seed → same match, always. It is
   deliberately thin: openness is produced by the tactical choices themselves
   — there is no scoring boost, chaos value or upset chance anywhere in here. */
const DeterministicMockEngine = (() => {
  const mulberry = a => () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  /* Reads the 13 controls into four behavioural quantities. */
  function profile(t){
    const n = (v,m) => m[v] ?? 0;
    const ambition =
        n(t.buildUpTempo,{Patient:-.10,Balanced:0,Quick:.12})
      + n(t.passingDirectness,{Short:-.06,Mixed:0,Direct:.12})
      + n(t.progressionRisk,{Secure:-.12,Balanced:0,Ambitious:.16})
      + n(t.boxCommitment,{Cautious:-.14,Balanced:0,Commit:.18})
      + n(t.chanceCreationFocus,{Central:0,Balanced:0,Wide:.02,Vertical:.10})
      + n(t.afterWinningPossession,{Secure:-.08,Balanced:0,Counter:.14});
    const exposure =                                   // space conceded behind
        n(t.defensiveBlockHeight,{Deep:-.14,Mid:0,High:.18})
      + n(t.defensiveLineBehavior,{Drop:-.10,Hold:0,'Step Up':.14})
      + n(t.pressingIntensity,{Passive:-.06,Selective:0,Aggressive:.08,Relentless:.16})
      + n(t.afterLosingPossession,{Regroup:-.10,Balanced:0,Counterpress:.12})
      + n(t.boxCommitment,{Cautious:-.08,Balanced:0,Commit:.12});
    const control =                                    // share of the ball
        n(t.buildUpTempo,{Patient:.12,Balanced:0,Quick:-.08})
      + n(t.passingDirectness,{Short:.14,Mixed:0,Direct:-.12})
      + n(t.progressionRisk,{Secure:.06,Balanced:0,Ambitious:-.08})
      + n(t.pressingIntensity,{Passive:-.08,Selective:0,Aggressive:.06,Relentless:.10})
      + n(t.afterLosingPossession,{Regroup:-.06,Balanced:0,Counterpress:.10});
    const compactness =                                // resistance to chances
        n(t.defensiveWidth,{Narrow:.06,Balanced:0,Wide:-.03})
      + n(t.markingOrientation,{Zonal:.04,Hybrid:.02,'Man-Oriented':-.04})
      + n(t.defensiveBlockHeight,{Deep:.10,Mid:0,High:-.08});
    return {ambition, exposure, control, compactness};
  }

  function teamLines(setup, side){
    const team = side === 'A' ? setup.teamA : setup.teamB;
    if(team.synthetic) return team.synthetic;   // clubLines() shape
    const f = formationOf(setup.teamA.formation), lu = setup.teamA.lineup;
    const bands = {ATT:[],MID:[],DEF:[]}; let gk = 70;
    const names = {ATT:[],MID:[],DEF:[]};
    for(const s of f.slots){
      const pid = lu[s.id]; if(!pid) continue;
      const pl = P(pid);
      if(s.position === 'GK'){ gk = pl.ovr; continue; }
      const b = s.y > 66 ? 'DEF' : s.y > 40 ? 'MID' : 'ATT';
      // out of position costs cohesion, not attributes
      const fit = suitability(pl, s.position);
      const coh = fit === 'natural' ? 1 : fit === 'comfortable' ? .985 : fit === 'secondary' ? .95 : .89;
      bands[b].push(pl.ovr * coh);
      names[b].push({id:pid, name:shortName(pl.name), pos:s.position, fin:pl.a.fin, apo:pl.a.apo, vis:pl.a.vis});
    }
    const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 62;
    return {ATT:avg(bands.ATT), MID:avg(bands.MID), DEF:avg(bands.DEF), GK:gk, names};
  }

  function init(setup){
    const A = teamLines(setup,'A'), B = teamLines(setup,'B');
    const pa = profile(setup.teamA.tactics), pb = profile(setup.teamB.tactics);
    const energy = {}, ratings = {}, mins = {};
    if(!setup.teamA.synthetic){
      const f = formationOf(setup.teamA.formation);
      for(const s of f.slots){
        const pid = setup.teamA.lineup[s.id]; if(!pid) continue;
        energy[pid] = 100; ratings[pid] = 6.0; mins[pid] = 0;
      }
    }
    return {
      clock:0, half:1, score:[0,0], status:'live',
      playerEnergy:energy, playerRatings:ratings, minutesPlayed:mins,
      substitutions:[], cards:[], events:[],
      formation:{a:setup.teamA.formation, b:setup.teamB.formation},
      tactics:{a:{...setup.teamA.tactics}, b:{...setup.teamB.tactics}},
      _rnd: mulberry(setup.seed), _shots:[0,0], _sot:[0,0], _xg:[0,0],
      _corners:[0,0], _fouls:[0,0], _scorers:{}, _pos:50, _A:A, _B:B, _pa:pa, _pb:pb
    };
  }

  function step(st, setup){
    st.clock++;
    const r = st._rnd;
    // tactics may have been edited mid-match — reread every minute
    st.tactics.a = {...setup.teamA.tactics};
    const A = teamLines(setup,'A'), B = st._B;
    const pa = profile(st.tactics.a), pb = st._pb;
    st._A = A; st._pa = pa;

    /* possession share follows control, not a dial */
    const ctrl = 50 + (pa.control - pb.control)*40 + (A.MID - B.MID)*1.4;
    st._pos = st._pos*0.94 + Math.max(22, Math.min(78, ctrl))*0.06;

    /* chance rate: what you commit vs what they leave open.
       A committed side against a deep block gets volume, not quality. */
    const chanceFor = (att, def, myAmb, theirExp, theirComp, theirBlockDeep) => {
      const edge = (att - def)/100;
      let rate = 0.068 + edge*0.080 + myAmb*0.05 + theirExp*0.045 - theirComp*0.05;
      return Math.max(0.008, rate);
    };
    const deepB = st.tactics.b.defensiveBlockHeight === 'Deep';
    const deepA = st.tactics.a.defensiveBlockHeight === 'Deep';
    const rateA = chanceFor(A.ATT, B.DEF, pa.ambition, pb.exposure, pb.compactness, deepB) * (st._pos/50);
    const rateB = chanceFor(B.ATT, A.DEF, pb.ambition, pa.exposure, pa.compactness, deepA) * ((100-st._pos)/50);

    /* quality: a siege produces low-value shots; a counter produces high-value ones */
    const qualA = 0.32 + (A.ATT - B.DEF)/260 - (deepB ? 0.09 : 0) +
                  (st.tactics.a.afterWinningPossession === 'Counter' && pb.exposure > .15 ? 0.08 : 0);
    const qualB = 0.32 + (B.ATT - A.DEF)/260 - (deepA ? 0.09 : 0) +
                  (st.tactics.b.afterWinningPossession === 'Counter' && pa.exposure > .15 ? 0.08 : 0);

    const fire = (side, rate, qual) => {
      if(r() > rate) return;
      st._shots[side]++;
      st._xg[side] += Math.min(.72, Math.max(.03, qual * (0.55 + r()*0.35)));
      const gkq = (side === 0 ? B.GK : A.GK)/100;
      const scored = r() < Math.max(.04, qual * (1.28 - gkq*0.55));
      if(scored){
        st._sot[side]++;
        st.score[side]++;
        const who = side === 0 ? pickScorer(A, r) : pickName(B, r);
        st.events.push({minute:st.clock, type: side===0?'goal':'conc',
          text: side===0 ? `GOAL — ${who.name}${who.assist ? ' (assist: '+who.assist+')' : ''}` : `Conceded — ${who} scores`});
        if(side === 0 && who.id){ st.playerRatings[who.id] = Math.min(10, (st.playerRatings[who.id]||6) + 1.1);
          st._scorers[who.id] = (st._scorers[who.id]||0) + 1; }
        if(side === 0 && who.assistId){ st.playerRatings[who.assistId] = Math.min(10, (st.playerRatings[who.assistId]||6) + 0.7); }
      } else if(r() < .35){
        st._sot[side]++;
        const who = side === 0 ? pickScorer(A, r) : {name:pickName(B, r)};
        st.events.push({minute:st.clock, type:'shot',
          text: side===0 ? `Chance — ${who.name} shoots, saved` : `${who.name} tests the keeper`});
      }
    };
    fire(0, rateA, qualA); fire(1, rateB, qualB);

    /* corners and fouls — deterministic colour for the stat sheet */
    if(r() < rateA * 0.62) st._corners[0]++;
    if(r() < rateB * 0.62) st._corners[1]++;
    const pressOf = t => ({Passive:.5,Selective:.75,Aggressive:1.05,Relentless:1.4})[t.pressingIntensity] || .8;
    if(r() < 0.085 * pressOf(st.tactics.a)) st._fouls[0]++;
    if(r() < 0.085 * pressOf(st.tactics.b)) st._fouls[1]++;

    /* energy: workload spends it, nothing else */
    const f = setup.teamA.synthetic ? {slots:[]} : formationOf(setup.teamA.formation);
    for(const s of f.slots){
      const pid = setup.teamA.lineup[s.id]; if(!pid) continue;
      const ins = setup.teamA.playerInstructions[pid] || DEFAULT_INSTR[s.position] || DEFAULT_INSTR.CM;
      const wl = workload(s.position, ins, st.tactics.a).value;
      const stam = P(pid).a.stam || 70;
      const drain = (0.22 + wl*0.85) * (1.6 - stam/100) * (st.clock > 65 ? 1.18 : 1);
      st.playerEnergy[pid] = Math.max(4, (st.playerEnergy[pid] ?? 100) - drain);
      st.minutesPlayed[pid] = (st.minutesPlayed[pid]||0) + 1;
      if(r() < 0.012) st.playerRatings[pid] = Math.min(10, Math.max(4, (st.playerRatings[pid]||6) + (r()-0.42)*0.5));
    }

    /* cards: aggression and pressing put players in more duels */
    const press = ({Passive:.4,Selective:.7,Aggressive:1.1,Relentless:1.6})[st.tactics.a.pressingIntensity] || 1;
    if(r() < 0.0055*press){
      const ids = Object.keys(st.playerEnergy);
      const pid = ids[Math.floor(r()*ids.length)];
      if(pid){ st.cards.push({minute:st.clock, playerId:pid, type:'yellow'});
        st.events.push({minute:st.clock, type:'cardev', text:`Yellow card — ${shortName(P(pid).name)}`}); }
    }
    if(st.clock === 45) st.events.push({minute:45, type:'info', text:`Half time — ${st.score[0]}-${st.score[1]}`});
    if(st.clock >= 90){
      st.status = 'ft';
      st.events.push({minute:90, type:'info', text:`Full time — ${st.score[0]}-${st.score[1]}`});
    }
    return st;
  }

  function pickScorer(A, r){
    if(A.synthetic) return {name: A.names[Math.floor(r()*A.names.length)] || 'a forward'};
    const pool = [...A.names.ATT.map(p=>({...p,w:6})), ...A.names.MID.map(p=>({...p,w:2})), ...A.names.DEF.map(p=>({...p,w:.5}))];
    if(!pool.length) return {name:'—'};
    const weighted = pool.map(p => ({...p, w: p.w * (0.5 + (p.fin||50)/100)}));
    const tot = weighted.reduce((a,b)=>a+b.w,0);
    let x = r()*tot, hit = weighted[0];
    for(const p of weighted){ x -= p.w; if(x <= 0){ hit = p; break; } }
    let assist = null, assistId = null;
    if(r() < 0.72){
      const others = weighted.filter(p => p.id !== hit.id).map(p => ({...p, w:(p.vis||50)/100 + 0.3}));
      if(others.length){
        const t2 = others.reduce((a,b)=>a+b.w,0); let y = r()*t2, a2 = others[0];
        for(const p of others){ y -= p.w; if(y <= 0){ a2 = p; break; } }
        assist = a2.name; assistId = a2.id;
      }
    }
    return {name:hit.name, id:hit.id, assist, assistId};
  }
  const pickName = (B, r) => B.names[Math.floor(r()*B.names.length)] || 'a forward';

  return {init, step};
})();

let ENGINE = DeterministicMockEngine;

/* ═══ MATCH ENGINE ADAPTER ═════════════════════════════════════════════════
   The seam where football simulator v0.7 plugs in. The UI only ever builds a
   request and reads a result; it never computes outcomes itself.
   request = { seed, fixtureId,
               homeTeam: {clubId, formationId, starters, bench, tactics, playerInstructions},
               awayTeam: {...} }                                            */
const MatchEngineAdapter = {
  simulate(request){
    const mk = side => side.starters
      ? {clubId:side.clubId, formation:side.formationId, lineup:{...side.starters},
         tactics:{...side.tactics}, playerInstructions:side.playerInstructions || {}}
      : {clubId:side.clubId, formation:clubFormation(side.clubId), lineup:null,
         tactics:clubLines(side.clubId).tactics, playerInstructions:null,
         synthetic:clubLines(side.clubId)};
    const setup = {fixtureId:request.fixtureId, seed:request.seed,
      teamA: mk(request.homeTeam), teamB: mk(request.awayTeam)};
    const st = ENGINE.init(setup);
    st.status = 'live';
    let guard = 0;
    while(st.status !== 'ft' && guard++ < 200) ENGINE.step(st, setup);
    return {
      fixtureId: request.fixtureId,
      score: [st.score[0], st.score[1]],
      stats: {shots:st._shots, sot:st._sot, xg:st._xg.map(v => Math.round(v*100)/100),
              possession:[Math.round(st._pos), 100 - Math.round(st._pos)],
              corners:st._corners, fouls:st._fouls},
      scorers: {...st._scorers},
      ratings: {...st.playerRatings}
    };
  }
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function shortName(full){

/* ── card ────────────────────────────────────────────────────────────────
   Six face stats, OVR, position, name, foot / weak foot / skills, eligible
   positions down the side. Scales entirely off --cw.                     */
const FACE_LABELS = {
  gk:['DIV','HAN','KIC','REF','SPD','POS'],
  out:['PAC','SHO','PAS','DRI','DEF','PHY']
};
/* Card art lives in cards/, organised by league folder and named by surname —
   e.g. "cards/Premier League/Salah.png". Candidates are tried in order;
   whichever loads replaces the blank template + identity overlay. If none
   exists the player keeps his own name and numbers — never "Random". The
   PNG is visual only; every number on it comes from JS state.              */
const CARD_DIR = 'cards/';
const CARD_BLANK = CARD_DIR + '_blank.png';
const CARD_AR = 900/1266;   // true aspect ratio of the card artwork
const LEAGUE_ART_DIR = CARD_DIR + 'Premier League/';
function artCandidates(pl){
  const c = [LEAGUE_ART_DIR + shortName(pl.name) + '.png'];
  const last = String(pl.name).split(' ').pop();
  if(last !== shortName(pl.name)) c.push(LEAGUE_ART_DIR + last + '.png');
  c.push(CARD_DIR + pl.id + '.png');               // legacy flat naming
  return c.map(encodeURI);
}
function cardArtStep(img){
  const alts = (img.dataset.alt || '').split('|').filter(Boolean);
  if(alts.length){ img.dataset.alt = alts.slice(1).join('|'); img.src = alts[0]; }
  else img.remove();
}
function cardHTML(pl, opts = {}){
  if(!pl) return '';

  return `<div class="card pngcard ${opts.mini?'mini':''}" role="img"
      aria-label="${esc(pl.name)} — ${pl.ovr} ${esc(pl.pos)}">

}

/* ── slot rendering ─────────────────────────────────────────────────────── */
function slotInner(pid, slotPos, opts = {}){
  const pl = P(pid);
  const fit = suitability(pl, slotPos);

  let under = '';

    <div class="tag">${esc(slotPos)}</div>${under}`;

/* Maps a formation's 0-100 coordinates onto the pitch in pixels, inset by half
   a card so that no slot — the keeper especially — can clip off an edge. */
function pitchPoint(x, y, cw){
  const z = $('.pitchzone');
  const W = z ? z.clientWidth : 640, H = z ? z.clientHeight : 700;
  cw = cw || S.ui.cw;
  const ch = cw/CARD_AR;
  const padX = cw/2 + 4;
  const padTop = ch/2 + 2, padBot = ch/2 + 24;   // tag sits fully BELOW the art
  return {
    x: Math.round(padX + (x/100) * Math.max(0, W - padX*2)),
    y: Math.round(padTop + (y/100) * Math.max(0, H - padTop - padBot))
  };
}

/* UI-only fallback: if any two card rects still intersect after the designed
   board coordinates are applied, push them apart. Never touches formation
   data — pixels in, pixels out.                                            */
function enforceVisualCardSeparation(pts, cw, ch, W, H){
  const minX = cw + 4, minY = ch + 6;
  for(let it = 0; it < 60; it++){
    let moved = false;
    for(let i = 0; i < pts.length; i++) for(let j = i + 1; j < pts.length; j++){
      const a = pts[i], b = pts[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const ox = minX - Math.abs(dx), oy = minY - Math.abs(dy);
      if(ox > 0 && oy > 0){
        moved = true;
        if(ox <= oy){ const push = ox/2 + .5, sg = dx >= 0 ? 1 : -1;
          a.x -= sg*push; b.x += sg*push;
        } else { const push = oy/2 + .5, sg = dy >= 0 ? 1 : -1;
          a.y -= sg*push; b.y += sg*push; }
        for(const q of [a, b]){
          q.x = Math.max(cw/2 + 2, Math.min(W - cw/2 - 2, q.x));
          q.y = Math.max(ch/2 + 2, Math.min(H - ch/2 - 26, q.y));
        }
      }
    }
    if(!moved) break;
  }
}

function renderPitch(){
  const f = curForm(), st = S.current;
  const zone = $('.pitchzone');
  const wrap = $('.slots');
  const cw = S.ui.cw;
  wrap.style.setProperty('--cw', cw+'px');

  // board geometry: presentation coordinates + per-formation card scale,
  // then a UI-only separation fallback so no two cards ever overlap
  const effCw = Math.round(cw * (FORMATION_UI_SCALE[f.id] || 1));
  const effCh = effCw / CARD_AR;
  const zoneEl = $('.pitchzone');
  const ZW = zoneEl ? zoneEl.clientWidth : 640, ZH = zoneEl ? zoneEl.clientHeight : 700;
  const pts = f.slots.map(sl => {
    const [ux, uy] = uiCoord(f.id, sl);
    return {id: sl.id, ...pitchPoint(ux, uy, effCw)};
  });
  enforceVisualCardSeparation(pts, effCw, effCh, ZW, ZH);
  const ptById = Object.fromEntries(pts.map(q => [q.id, q]));

  // reuse nodes so the CSS position transition animates on formation change
  const existing = {};
  $$('.slot', wrap).forEach(n => existing[n.dataset.slot] = n);
  const keep = new Set();

  for(const s of f.slots){
    keep.add(s.id);
    const pt = ptById[s.id];
    let n = existing[s.id];
    if(!n){
      n = document.createElement('div');
      n.className = 'slot'; n.dataset.slot = s.id; n.dataset.zone = 'pitch';
      n.style.left = pt.x+'px'; n.style.top = pt.y+'px';
      wrap.appendChild(n);
    }
    n.style.setProperty('--cw', effCw+'px');
    n.style.zIndex = Math.round(s.y);
    n.style.left = pt.x+'px'; n.style.top = pt.y+'px';
    const pid = st.starters[s.id] ?? null;
    const fit = suitability(P(pid), s.position);
    n.dataset.fit = fit || '';
    n.dataset.player = pid || '';
    n.innerHTML = slotInner(pid, s.position, {mini:effCw < 108});
  }
  for(const id in existing) if(!keep.has(id)) existing[id].remove();

  $('.formname').textContent = f.name;
  $('.formsub').textContent = `${outOfPositionCount() ? outOfPositionCount()+' out of position · ' : ''}${startingIds().length}/11 selected`;
  renderBench();
  renderTopMeta();
}

function renderBench(){

    const pl = P(pid);
    return `<div class="slot" data-zone="bench" data-player="${pid}" data-slot="bench:${pid}" style="--cw:62px">
      ${slotInner(pid, pl.pos, {mini:true})}</div>`;

/* ── pointer drag & drop ─────────────────────────────────────────────────
   One implementation for mouse, pen and touch. Under 6px of movement is a
   click, which selects; beyond that it is a drag.                        */
let drag = null;
function onPointerDown(e){
  const slot = e.target.closest('.slot');
  if(!slot || e.button === 2) return;
  const pid = slot.dataset.player;
  if(!pid){ // empty slot → open the picker
    if(slot.dataset.zone === 'pitch'){ e.preventDefault(); openPicker(slot.dataset.slot); }
    return;
  }
  e.preventDefault();
  const card = slot.querySelector('.holder');
  const r = card.getBoundingClientRect();
  drag = {slot, pid, startX:e.clientX, startY:e.clientY, moved:false, w:r.width, ghost:null};
  slot.setPointerCapture?.(e.pointerId);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp, {once:true});
}
function onPointerMove(e){
  if(!drag) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if(!drag.moved && Math.hypot(dx,dy) < 6) return;
  if(!drag.moved){
    drag.moved = true;
    const g = document.createElement('div');
    g.id = 'ghost'; g.style.width = Math.max(drag.w, 84)+'px';
    g.style.setProperty('--cw', Math.max(drag.w,84)+'px');
    g.innerHTML = cardHTML(P(drag.pid));
    document.body.appendChild(g);
    drag.ghost = g;
    drag.slot.classList.add('lifted');
  }
  drag.ghost.style.left = e.clientX+'px';
  drag.ghost.style.top  = e.clientY+'px';
  drag.ghost.style.display = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.slot, .bench');
  drag.ghost.style.display = '';
  $$('.slot.over').forEach(n => n.classList.remove('over'));
  $('.bench')?.classList.remove('over');
  if(under && under !== drag.slot) under.classList.add('over');
  drag.target = under && under !== drag.slot ? under : null;
}
function onPointerUp(e){
  window.removeEventListener('pointermove', onPointerMove);
  if(!drag) return;
  const d = drag; drag = null;
  d.ghost?.remove();
  d.slot.classList.remove('lifted');
  $$('.over').forEach(n => n.classList.remove('over'));

  if(!d.moved){ openFocus(d.pid, d.slot); return; }   // a click, not a drag
  const t = d.target;
  if(!t) return;

  if(t.classList.contains('bench') || t.dataset.zone === 'bench'){
    if(t.dataset.player && d.slot.dataset.zone === 'pitch'){
      // bench card ← swap with the starter (live: this is a substitution)
      const benchPid = t.dataset.player, slotId = d.slot.dataset.slot;
      if(isLiveMatch()){
        if(S.match.snap && (S.match.snap.substitutions_used || {})[livTeamId()] >= 5)
          return liveBlocked('All five substitutions have been used.');
        return confirmSub(benchPid, d.pid, slotId, true);
      }
      const i = S.current.bench.indexOf(benchPid);
      S.current.bench[i] = d.pid;
      S.current.starters[slotId] = benchPid;
      instrFor(benchPid, slotById(slotId).position);
    } else {
      if(isLiveMatch()) return liveBlocked('Players leave the pitch only by substitution during a live match.');
      addToBench(d.pid);
    }
  } else if(t.dataset.zone === 'pitch'){
    const from = d.slot.dataset.zone, toSlot = t.dataset.slot;
    if(from === 'pitch'){
      if(isLiveMatch()) return liveBlocked('Position swaps are not supported during a live match — change formation or substitute.');
      swapSlots(d.slot.dataset.slot, toSlot);
    } else {
      const outgoing = S.current.starters[toSlot];
      if(isLiveMatch()){
        if(outgoing) return confirmSub(d.pid, outgoing, toSlot, true);
        return liveBlocked();
      }
      putInSlot(toSlot, d.pid);
      if(outgoing) addToBench(outgoing);
    }
  }
  renderPitch(); saveState();
}

function bindDrag(){
  const zone = $('#v-squad');
  zone.addEventListener('pointerdown', onPointerDown);
  zone.addEventListener('contextmenu', e => {
    const s = e.target.closest('.slot');
    if(s && s.dataset.player){ e.preventDefault();
      if(isLiveMatch()) return liveBlocked('Players cannot be removed during a live match.');
      removePlayer(s.dataset.player); renderPitch(); saveState(); }
  });
}

/* ── substitution confirm ───────────────────────────────────────────────── */
function confirmSub(inId, outId, slotId){
  const wrap = $('#subConfirm');
  wrap.innerHTML = `<div class="board" style="max-width:380px;margin:0 auto">
    <h3 style="margin:0 0 14px;font-size:17px">Substitute?</h3>
    <div style="display:flex;align-items:center;justify-content:center;gap:16px;--cw:88px">
      <div style="width:88px">${cardHTML(P(outId),{mini:true})}<div class="fitline">OFF</div></div>
      <div style="font-size:22px;color:var(--dim)">→</div>
      <div style="width:88px">${cardHTML(P(inId),{mini:true})}<div class="fitline">ON</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn pri" onclick="doSub('${inId}','${outId}','${slotId}')">Confirm</button>
      <button class="btn sec" onclick="closeAll()">Cancel</button>
    </div></div>`;
  $('#scrim').classList.add('on');
  wrap.classList.add('on');
}
async function doSub(inId, outId, slotId){
  if(isLiveMatch()){
    if(mgmtPending){ closeAll(); return; }
    mgmtPending = true;
    try{
      const r = await api(`/matches/${S.match.matchId}/substitution`, {method: 'POST',
        body: {team: livTeamId(), player_off: outId, player_on: inId, target_slot: engineSlot(slotId)}});
      mgmtPending = false;
      reconcileLiveFromEngine(r.management);   // board rendered from engine state
      S.changes.push({minute:S.match.clock, text:`${shortName(P(inId).name)} on for ${shortName(P(outId).name)}`});
      saveState();
    }catch(e){
      mgmtPending = false;
      toast('Substitution rejected: ' + e.message);   // nothing committed locally
    }
    closeAll(); renderPitch(); renderMatch();
    return;
  }
  // pre-match / mock: plain local swap
  const st = S.current;
  const i = st.bench.indexOf(inId);
  if(i > -1) st.bench.splice(i,1);
  st.starters[slotId] = inId;
  st.bench.push(outId);
  instrFor(inId, slotById(slotId).position);
  closeAll(); renderPitch(); renderMatch(); saveState();
}


/* ── flip card in place ───────────────────────────────────────────────────
   Clicking a pitch card enlarges THAT card where it stands and rotates it
   around the Y axis to reveal the instruction back. No detached modal —
   the card stays visually anchored to its slot.                          */
function openFocus(pid, anchorEl){
  S.ui.focusPlayer = pid;
  const pl = P(pid);
  const slotId = Object.keys(S.current.starters).find(k => S.current.starters[k] === pid);
  const slotPos = slotId ? slotById(slotId).position : pl.pos;
  const ins = instrFor(pid, slotPos);
  const r = rolesFor(slotPos);
  const wl = workload(slotPos, ins);

  // where the card sits on screen right now
  const art = anchorEl && anchorEl.querySelector('.holder .pngcard');
  const o = art ? art.getBoundingClientRect()
    : {left: innerWidth/2 - 55, top: innerHeight/2 - 78, width: 110, height: 155};

  // grown size + position, clamped to the viewport but pulled toward the slot
  const tw = Math.min(272, Math.max(220, Math.round(innerHeight * 0.30)));
  const th = tw / CARD_AR;
  const tx = Math.max(14, Math.min(innerWidth  - tw - 14, o.left + o.width/2  - tw/2));
  const ty = Math.max(12, Math.min(innerHeight - th - 64, o.top  + o.height/2 - th/2));

  $('#focus').innerHTML = `
   <div class="flipanchor" id="flipA" style="left:${o.left}px;top:${o.top}px;width:${o.width}px;--cw:${tw}px">
    <div class="flipper" id="flipper">
      <div class="face-a" onclick="flipCard()" title="Flip">${cardHTML(pl)}</div>
      <div class="face-b"><div class="instr">
        <div><h5>${esc(shortName(pl.name).toUpperCase())}</h5>
          <div class="sub">${esc(slotPos)}${slotPos !== pl.pos ? ` · ${FIT_LABEL[suitability(pl, slotPos)]}` : ''}</div></div>

        <div class="blk"><label>ATTACK PLAYSTYLE</label>
          <select onchange="setInstr('${pid}','attackRole',this.value)" title="${esc(ROLE_NOTE[ins.attackRole] || '')}">
            ${r.atk.map(x => `<option ${x===ins.attackRole?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="blk"><label>ATTACK INTENSITY</label>
          <div class="effort"><input type="range" min="0" max="100" value="${ins.attackEffort}"
            oninput="updateIntensityDisplay('ae',this.value)"
            onchange="setInstr('${pid}','attackEffort',+this.value)" aria-label="Attack intensity"></div>
          <div class="ival"><b id="ae">${ins.attackEffort} / 100</b><em id="aeb">${effortBand(ins.attackEffort).toUpperCase()}</em></div></div>

        <div class="blk"><label>DEFENSIVE PLAYSTYLE</label>
          <select onchange="setInstr('${pid}','defenseRole',this.value)" title="${esc(ROLE_NOTE[ins.defenseRole] || '')}">
            ${r.def.map(x => `<option ${x===ins.defenseRole?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="blk"><label>DEFENSE INTENSITY</label>
          <div class="effort"><input type="range" min="0" max="100" value="${ins.defenseEffort}"
            oninput="updateIntensityDisplay('de',this.value)"
            onchange="setInstr('${pid}','defenseEffort',+this.value)" aria-label="Defense intensity"></div>
          <div class="ival"><b id="de">${ins.defenseEffort} / 100</b><em id="deb">${effortBand(ins.defenseEffort).toUpperCase()}</em></div></div>

        <div class="wl">
          <div><em>EXPECTED WORKLOAD</em><b id="wlv">${wl.band}</b></div>
          <div style="text-align:right"><em>FLIP</em><b style="cursor:pointer" onclick="flipCard()">⟳</b></div>
        </div>
      </div></div>
    </div>
    <div class="fbtns">
      <button class="btn sec sm" onclick="flipCard()" id="flipbtn">Card ⟳</button>
      <button class="btn sec sm" onclick="openDetails('${pid}')">Details</button>
      <button class="btn sec sm" onclick="benchThis('${pid}')">To bench</button>
      <button class="btn sec sm" onclick="closeAll()">Close</button>
    </div>
   </div>`;
  $('#scrim').classList.add('on');
  $('#focus').classList.add('on');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const a = $('#flipA'); if(!a) return;
    a.style.left = tx + 'px'; a.style.top = ty + 'px'; a.style.width = tw + 'px';
    a.classList.add('grown');
    $('#flipper').classList.add('back');   // rotate to the instruction back
  }));
}
function flipCard(){
  const f = $('#flipper'); if(!f) return;
  f.classList.toggle('back');
  const b = $('#flipbtn');
  if(b) b.textContent = f.classList.contains('back') ? 'Card ⟳' : 'Instructions ⟳';
}
/* display-only intensity readout while a slider is being dragged */
function updateIntensityDisplay(which, val){
  const a = $('#' + which), b = $('#' + which + 'b');
  if(a) a.textContent = `${val} / 100`;
  if(b) b.textContent = effortBand(+val).toUpperCase();
}
/* re-sync the flip-card controls to the COMMITTED instruction state */
function syncInstrControls(pid){
  const ins = S.current.playerInstructions[pid]; if(!ins) return;
  const back = $('#flipA .face-b'); if(!back) return;
  const sels = back.querySelectorAll('select');
  if(sels[0]) sels[0].value = ins.attackRole;
  if(sels[1]) sels[1].value = ins.defenseRole;
  const ranges = back.querySelectorAll('input[type=range]');
  if(ranges[0]) ranges[0].value = ins.attackEffort;
  if(ranges[1]) ranges[1].value = ins.defenseEffort;
  updateIntensityDisplay('ae', ins.attackEffort);
  updateIntensityDisplay('de', ins.defenseEffort);
}
async function setInstr(pid, key, val){
  const ins = S.current.playerInstructions[pid];
  if(!ins) return;
  const apply = () => {
    ins[key] = val;
    if(key === 'attackEffort') updateIntensityDisplay('ae', val);
    if(key === 'defenseEffort') updateIntensityDisplay('de', val);
    const slotId = Object.keys(S.current.starters).find(k => S.current.starters[k] === pid);
    const slotPos = slotId ? slotById(slotId).position : P(pid).pos;
    const el = $('#wlv'); if(el) el.textContent = workload(slotPos, ins).band;
  };
  if(isLiveMatch()){
    if(mgmtPending){ syncInstrControls(pid); return; }
    mgmtPending = true;
    const proposed = {...ins, [key]: val};
    try{
      await api(`/matches/${S.match.matchId}/instructions`, {method:'POST',
        body:{team: livTeamId(), player_id: pid, instructions: proposed}});
      apply();                            // commit ONLY after engine acceptance
      S.changes.push({minute:S.match.clock, text:`${shortName(P(pid).name)} — ${key.replace(/([A-Z])/g,' $1').toLowerCase()} → ${val}`});
      saveState();
    }catch(e){
      toast('Engine rejected: ' + e.message);
      syncInstrControls(pid);             // restore controls to committed state
    }finally{
      mgmtPending = false;
    }
    return;
  }
  apply();
  saveState();
}
function benchThis(pid){
  if(isLiveMatch()){ liveBlocked('Use a substitution — drag a bench player onto this starter.'); return; }
  addToBench(pid); closeAll(); renderPitch(); saveState();
}
