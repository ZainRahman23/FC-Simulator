      </div>
      <div class="dock">
        <div class="benchcol">
          <div class="benchhead">
            <button class="chev" onclick="toggleBench()" aria-label="Toggle bench">▾</button>
            <h4>BENCH</h4><span class="cnt"></span>
            <button class="tbtn" style="margin-left:auto;padding:5px 10px;font-size:12px" onclick="openManager()">⚑ Manager</button>
          </div>
          <div class="bench"></div>
        </div>
        <div class="formbox">
          <div class="formrow">
            <button class="arw" onclick="cycleForm(-1)" aria-label="Previous formation">‹</button>
            <button class="formname" onclick="openManager()">4-3-3</button>
            <button class="arw" onclick="cycleForm(1)" aria-label="Next formation">›</button>
          </div>
          <div class="formsub"></div>
        </div>
      </div>
    </div>
    <aside id="tacticsPanel" aria-label="Team tactics"></aside>
  </div>

  <div class="view page" id="v-schedule"><div id="scheduleBody"></div></div>
  <div class="view page" id="v-table"><div id="tableBody"></div></div>

  <div class="view page" id="v-players">
    <div class="pagehead">PREMIER LEAGUE · ${PREMIER_LEAGUE.season}</div>
    <h2 class="pagetitle">Players</h2>
    <div class="filters" style="margin-bottom:12px">
      <input id="listQ" placeholder="Search Premier League players" oninput="listFilters.q=this.value;renderList()">
      <select id="listClub" onchange="listFilters.club=this.value;renderList()">
        <option value="ALL">All clubs</option>
        ${CLUBS.map(c => `<option value="${c.id}">${c.shortName}</option>`).join('')}
      </select>
      <select id="listPos" onchange="listFilters.pos=this.value;renderList()">
        <option value="ALL">All positions</option>
        ${POS_ALL.map(p => `<option>${p}</option>`).join('')}
      </select>
      <select id="listSort" onchange="listFilters.sort=this.value;renderList()">
        <option value="ovr">Overall</option><option value="club">Club</option>
        <option value="pot">Potential</option><option value="age">Age</option><option value="name">Name</option>
      </select>
      <span style="color:var(--dim);font-size:12.5px" id="listCount"></span>
    </div>
    <div class="listgrid" id="listGrid" style="overflow:visible"></div>
  </div>

  <div class="view page" id="v-results"><div id="resultsBody"></div></div>
  <div class="view page" id="v-transfers"><div id="transfersBody"></div></div>
  <div class="view page" id="v-finances"><div id="financesBody"></div></div>

  <div class="view" id="v-match"><div class="mwrap" id="matchBody"></div></div>

  <div class="scrim" id="scrim" onclick="closeAll()"></div>
  <div class="focus" id="focus"></div>
  <div class="focus" id="subConfirm"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-label="Panel">
    <div class="dhead">
      <div style="flex:1"><h3 id="drawerTitle"></h3><div class="sub" id="drawerSub"></div></div>
      <button class="x" onclick="closeAll()" aria-label="Close">✕</button>
    </div>
    <div class="dbody" id="drawerBody"></div>
    <div class="dfoot" id="drawerFoot"></div>
  </aside>
  <div class="sheet" id="sheet" role="dialog" aria-label="Player picker">
    <div class="shead">
      <h3 id="pickTitle">Choose a player</h3>
      <div class="filters">
        <input id="pickQ" placeholder="Search name" oninput="pickFilters.q=this.value;renderPicker()">
        <select id="pickPos" onchange="pickFilters.pos=this.value;renderPicker()">
          <option value="ALL">All</option>${POS_ALL.map(p => `<option>${p}</option>`).join('')}
        </select>
        <select id="pickSort" onchange="pickFilters.sort=this.value;renderPicker()">
          <option value="ovr">Overall</option><option value="fit">Best fit</option>
          <option value="pot">Potential</option><option value="age">Age</option><option value="name">Name</option>
        </select>
      </div>
      <button class="x" onclick="closeAll()" aria-label="Close">✕</button>
    </div>
    <div class="pgrid" id="pickBody"></div>
  </div>`;
}
async function cycleForm(dir){
  const i = FORMATIONS.findIndex(f => f.id === S.current.formationId);
  const n = FORMATIONS[(i + dir + FORMATIONS.length) % FORMATIONS.length];
  if(isLiveMatch()){ await liveFormationChange(n.id); return; }   // engine-authoritative
  setFormation(n.id);
  renderPitch(); saveState();
}

/* ── boot ───────────────────────────────────────────────────────────────── */
async function boot(){
  S.current = blankSquad();
  S.season = blankSeason();
  const saved = await loadState();
  if(saved && saved.squad){
    S.current = {...blankSquad(), ...saved.squad};
    S.customPresets = saved.presets || {};
  }
  if(saved && saved.season) S.season = {...blankSeason(), ...saved.season};
  if(!S.season.seed){ S.season.seed = newSeasonSeed(); }   // migrate pre-engine saves
  S.finance = saved && saved.finance ? {...blankFinance(), ...saved.finance} : blankFinance();
  S.transfers = saved && saved.transfers ? {...blankTransfers(), ...saved.transfers} : blankTransfers();
  applyCompletedTransfers();
  clubPool().forEach(ensureContract);
  shell();
  const f = curForm();
  for(const sl of f.slots) if(!(sl.id in S.current.starters)) S.current.starters[sl.id] = null;
  // this is a Liverpool save — drop anyone who isn't at the club
  const liv = new Set(clubPool().map(p => p.id));
  for(const k in S.current.starters)
    if(S.current.starters[k] && !liv.has(S.current.starters[k])) S.current.starters[k] = null;
  S.current.bench = S.current.bench.filter(id => liv.has(id));
  if(!startingIds().length){ autoFill({silent:true}); fillBench(); }
  fitCards();
  show(['home','squad','schedule','table','players','results'].includes(location.hash.slice(1))
    ? location.hash.slice(1) : 'home');
  renderPitch(); renderTacticsPanel(); renderTopBar();
  checkEngineHealth();
  // RC1: the dev mock is blocked in production configuration
  if(ENGINE_MODE === 'mock'){
    try{
      const cfg = await (await fetch('/api/config')).json();
      if(!cfg.allow_mock){
        toast('Mock engine is disabled on this server');
        location.replace(location.pathname);   // reload without ?engine=mock
        return;
      }
    }catch(e){}
  }
  // RC1: refreshing during a live match reconnects to the same backend match
  await resumeActiveMatch();
  bindDrag();
  window.addEventListener('resize', () => { if(S.ui.view === 'squad'){ fitCards(); renderPitch(); } });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeAll(); });
  setTimeout(() => { if(S.ui.view === 'squad'){ fitCards(); renderPitch(); } }, 200);
}

/* public surface for a real engine + external state */
window.TOUCHLINE = {
  setMatchEngine(e){ ENGINE = e; },          // football simulator v0.7 plugs in here
  MatchEngineAdapter,
  getSquadState: () => JSON.parse(JSON.stringify(S.current)),
  getSeasonState: () => JSON.parse(JSON.stringify(S.season)),
  getMatchSetup: () => S.matchFixture ? buildMatchSetup(S.matchFixture) : null,
  FORMATIONS, ROLES, TACTIC_GROUPS, PRESETS, CLUBS, PREMIER_LEAGUE,
  DETAILED_PLAYER_PROFILES, ATTRIBUTE_PROFILES, PLAYERS
};

boot();

</script>
