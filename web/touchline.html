/* ── permanent team-tactics panel ────────────────────────────────────────
   Always on screen beside the pitch. All 13 controls, no drawer, no modal.
   Selecting a value re-renders only this panel.                          */
function activePlanName(){
  const t = S.current.tactics;
  return Object.keys(PRESETS).find(k => TACTIC_IDS.every(id => PRESETS[k][id] === t[id]))
      || Object.keys(S.customPresets).find(k => TACTIC_IDS.every(id => S.customPresets[k][id] === t[id]))
      || 'Custom';
}
function renderTacticsPanel(){
  const el = $('#tacticsPanel'); if(!el) return;
  const t = S.current.tactics;
  const active = activePlanName();
  const plans = [...Object.keys(PRESETS), ...Object.keys(S.customPresets)];
  el.innerHTML = `
    <div class="tphead">
      <h3>TEAM TACTICS</h3>
      <div class="planrow">
        <label>TACTICAL PLAN</label>
        <select onchange="applyPreset(this.value)" aria-label="Tactical plan">
          ${plans.map(k => `<option ${k===active?'selected':''}>${esc(k)}</option>`).join('')}
          <option disabled ${active==='Custom'?'selected':''}>Custom</option>
        </select>
        <button class="saveb" onclick="savePreset()" title="Save the current 13 settings as a plan">Save</button>
      </div>
    </div>
    <div class="tpbody">
      ${TACTIC_GROUPS.map(g => `<div class="tpg"><h4>${g.title}</h4>
        ${g.controls.map(c => `<div class="tctrl">
          <div class="tlab"><b>${c.label.toUpperCase()}</b>
            <span class="info" title="${esc(c.why[t[c.id]] || '')}">i</span></div>
          <div class="seg">${c.options.map(o =>
            `<button class="${t[c.id]===o?'on':''}" onclick="setTactic('${c.id}','${o}')">${o}</button>`).join('')}</div>
        </div>`).join('')}
      </div>`).join('')}
    </div>`;
}
async function setTactic(id, val){
  if(isLiveMatch()){
    if(mgmtPending) return;
    mgmtPending = true;
    const proposed = {...S.current.tactics, [id]: val};
    try{
      await api(`/matches/${S.match.matchId}/tactics`, {method:'POST',
        body:{team: livTeamId(), tactics: proposed}});
      S.current.tactics = proposed;   // commit ONLY after engine acceptance
      S.changes.push({minute:S.match.clock, text:`${id.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase())} → ${val}`});
      saveState();
    }catch(e){
      toast('Engine rejected: ' + e.message);   // previous state retained untouched
    }finally{
      mgmtPending = false;
      renderTacticsPanel();
    }
    return;
  }
  S.current.tactics[id] = val;
  renderTacticsPanel(); saveState();
}
async function applyPreset(name){
  const p = PRESETS[name] || S.customPresets[name];
  if(!p) return;
  if(isLiveMatch()){
    if(mgmtPending) return;
    mgmtPending = true;
    try{
      await api(`/matches/${S.match.matchId}/tactics`, {method:'POST',
        body:{team: livTeamId(), tactics: {...p}}});
      S.current.tactics = {...p};
      S.changes.push({minute:S.match.clock, text:`Plan → ${name}`});
      saveState();
    }catch(e){
      toast('Engine rejected: ' + e.message);
    }finally{
      mgmtPending = false;
      renderTacticsPanel();
    }
    return;
  }
  S.current.tactics = {...p};
  renderTacticsPanel(); saveState();
}
function savePreset(){
  const name = prompt('Name this plan');
  if(!name) return;
  S.customPresets[name] = {...S.current.tactics};

async function revertToBase(){
  if(!S.base) return;
  if(!isLiveMatch()){
    S.current = JSON.parse(JSON.stringify(S.base));
    renderPitch(); openManager(); saveState(); toast('Reverted to base plan');
    return;
  }
  // Live: restore the tactical plan as far as the engine allows for the
  // players currently on the pitch. Substitutions are never undone.
  if(mgmtPending) return;
  mgmtPending = true;
  const failures = [];
  const m = S.match, team = livTeamId();
  try{
    if(S.current.formationId !== S.base.formationId){
      try{
        await api(`/matches/${m.matchId}/formation`, {method:'POST',
          body:{team, formation: S.base.formationId}});
      }catch(e){ failures.push('formation (' + e.message + ')'); }
    }
    try{
      await api(`/matches/${m.matchId}/tactics`, {method:'POST',
        body:{team, tactics: {...S.base.tactics}}});
    }catch(e){ failures.push('team tactics (' + e.message + ')'); }
    // authoritative state after formation/tactics
    let snap = await api(`/matches/${m.matchId}?since=${m.eventIndex}`);
    const mgmtNow = snap.management[team];
    for(const [pid, p] of Object.entries(mgmtNow.players)){
      if(!p.active) continue;
      const baseIns = S.base.playerInstructions[pid];
      if(!baseIns) continue;   // came on after kickoff: keep the engine's state
      try{
        await api(`/matches/${m.matchId}/instructions`, {method:'POST',
          body:{team, player_id: pid, instructions: {...baseIns}}});
      }catch(e){ failures.push(shortName(P(pid).name) + ' (' + e.message + ')'); }
    }
    snap = await api(`/matches/${m.matchId}?since=${m.eventIndex}`);
    mgmtPending = false;
    reconcileLiveFromEngine(snap.management);   // render exactly what the engine holds
    S.changes.push({minute: m.clock, text: 'Reverted to base plan' + (failures.length ? ' (partial)' : '')});
    saveState();
    if(failures.length)
      toast('Could not fully restore: ' + failures[0] + (failures.length > 1 ? ` (+${failures.length - 1} more)` : ''));
    else
      toast('Reverted to base plan');
  }catch(e){
    toast('Revert failed: ' + e.message);
  }finally{
    mgmtPending = false;
    renderPitch(); renderTacticsPanel(); openManager();
  }
}

const controlledClubId = () => S.season ? S.season.controlledClubId : 'LIV';

function autoFill(opts = {}){
  if(isLiveMatch()){ liveBlocked('The XI cannot be auto-picked during a live match.'); return; }
  const f = curForm(), st = S.current;
  const pool = clubPool();                       // Liverpool players only — never the global list
  const used = new Set();
  const rank = {natural:0, comfortable:1, secondary:2, out:3};
  // fill the most constrained slots first
  const order = [...f.slots].sort((a,b) =>
    pool.filter(p => p.pos === a.position).length - pool.filter(p => p.pos === b.position).length);
  const picks = {};
  for(const s of order){
    const best = pool.filter(p => !used.has(p.id))
      .sort((x,y) => {
        const rx = rank[suitability(x,s.position)], ry = rank[suitability(y,s.position)];
        return rx !== ry ? rx - ry : y.ovr - x.ovr;
      })[0];
    if(best){ picks[s.id] = best.id; used.add(best.id); }
  }
  st.starters = {}; for(const s of f.slots) st.starters[s.id] = picks[s.id] ?? null;
  st.bench = st.bench.filter(id => !used.has(id));
  for(const s of f.slots) if(st.starters[s.id]) instrFor(st.starters[s.id], s.position);
  renderPitch(); saveState();
  if(!opts.silent) toast('Best available Liverpool XI selected');
}
function fillBench(){
  if(isLiveMatch()){ liveBlocked(); return; }
  const st = S.current;
  const need = 7 - st.bench.length;
  if(need <= 0) return;
  const gkOnBench = st.bench.some(id => P(id).pos === 'GK');
  const pool = clubPool().filter(p => !isUsed(p.id)).sort((a,b) => b.ovr - a.ovr);
  if(!gkOnBench){ const gk = pool.find(p => p.pos === 'GK'); if(gk) st.bench.push(gk.id); }
  for(const p of pool){ if(st.bench.length >= 7) break; if(!isUsed(p.id)) st.bench.push(p.id); }
  renderPitch(); saveState();
}
function clearSquad(){
  if(isLiveMatch()){ liveBlocked('The squad cannot be cleared during a live match.'); return; }
  const f = curForm();
  S.current.starters = {}; for(const s of f.slots) S.current.starters[s.id] = null;
  S.current.bench = [];
  renderPitch(); openManager(); saveState();
}

/* ── LIVE AUTHORITY ─────────────────────────────────────────────────────────
   While a real v0.7 match session is running, Python owns all football-
   management state. The browser sends intent, awaits acceptance, and renders
   the engine's returned state. There is no local-only live mutation path.  */
const isLiveMatch = () => !!(S.match && S.match.matchId && S.match.status !== 'ft' && ENGINE_MODE !== 'mock');
let mgmtPending = false;   // serializes live management requests (no double-commits)
function liveBlocked(msg){
  toast(msg || 'Not available during a live match — use a substitution or formation change.');
}

/* engine vocabulary → frontend vocabulary (render what Python is using) */
const FRONTEND_FORMATION_BY_ENGINE = {'4-3-3':'433', '4-2-3-1':'4231', '4-1-4-1':'4141'};
const TACTIC_KEY_BY_ENGINE = {build_up_tempo:'buildUpTempo', passing_directness:'passingDirectness',
  progression_risk:'progressionRisk', attacking_width:'attackingWidth',
  chance_creation_focus:'chanceCreationFocus', box_commitment:'boxCommitment',
  after_winning_possession:'afterWinningPossession', after_losing_possession:'afterLosingPossession',
  defensive_block_height:'defensiveBlockHeight', pressing_intensity:'pressingIntensity',
  defensive_width:'defensiveWidth', marking_orientation:'markingOrientation',
  defensive_line_behavior:'defensiveLineBehavior'};
const prettyTactic = v => ({MAN_ORIENTED:'Man-Oriented', STEP_UP:'Step Up'})[v]
  || String(v)[0] + String(v).slice(1).toLowerCase();

/* Rebuild the Liverpool board from the engine's authoritative management
   state (slots, active/subbed-off, instructions, tactics). Used after every
   accepted live operation and as drift auto-heal from snapshots.          */
function reconcileLiveFromEngine(management, opts = {}){
  if(!management || !S.matchFixture) return;
  const t = management[livTeamId()]; if(!t) return;
  const fid = FRONTEND_FORMATION_BY_ENGINE[t.formation];
  if(!fid) return;
  S.current.formationId = fid;
  const newStarters = {};
  for(const sl of formationOf(fid).slots) newStarters[sl.id] = null;
  const bench = new Set(S.current.bench);
  for(const [pid, p] of Object.entries(t.players)){
    if(p.subbed_off) bench.delete(pid);          // a substituted player cannot return
    if(!p.active) continue;
    const fslot = frontendSlotFor(fid, p.slot);
    if(fslot in newStarters) newStarters[fslot] = pid;
    bench.delete(pid);
  }
  S.current.starters = newStarters;
  S.current.bench = [...bench];
  for(const [pid, p] of Object.entries(t.players)){
    if(!p.active) continue;
    S.current.playerInstructions[pid] = {
      attackRole: prettyRole(p.instructions.attack_role),
      attackEffort: p.instructions.attack_effort,
      defenseRole: prettyRole(p.instructions.defense_role),
      defenseEffort: p.instructions.defense_effort
    };
  }
  if(!opts.skipTactics){
    const tac = {};
    for(const [ek, v] of Object.entries(t.tactics)) tac[TACTIC_KEY_BY_ENGINE[ek]] = prettyTactic(v);
    S.current.tactics = tac;
  }
  saveState();
  if(S.ui.view === 'squad'){ renderPitch(); renderTacticsPanel(); }
}
/* Cheap per-snapshot drift check: does the board disagree with the engine
   about who is on the pitch and where? (e.g. a red card.)                */
function reconcileDriftIfNeeded(management){
  if(mgmtPending || !management || !S.matchFixture) return;
  const t = management[livTeamId()]; if(!t) return;
  const fid = FRONTEND_FORMATION_BY_ENGINE[t.formation];
  if(fid !== S.current.formationId){ reconcileLiveFromEngine(management); return; }
  for(const [pid, p] of Object.entries(t.players)){
    const fslot = p.active ? frontendSlotFor(fid, p.slot) : null;
    const local = Object.keys(S.current.starters).find(k => S.current.starters[k] === pid) || null;
    if((p.active && local !== fslot) || (!p.active && local)){
      reconcileLiveFromEngine(management); return;
    }
  }
}

/* frontend slot → engine slot (per formation); UI coordinates never travel */
const ENGINE_SLOT_MAP = {'433': {CM: 'CDM'}, '4231': {LW: 'LAM', RW: 'RAM'}, '4141': {}};
const SUPPORTED_ENGINE_FORMATIONS = ['433', '4231', '4141'];
const engineSlot = slotId => (ENGINE_SLOT_MAP[S.current.formationId] || {})[slotId] || slotId;
function frontendSlotFor(fid, engSlot){
  const m = ENGINE_SLOT_MAP[fid] || {};
  for(const [f, e] of Object.entries(m)) if(e === engSlot) return f;
  return engSlot;
}

const serializePlayer = pl => ({id: pl.id, name: pl.name, pos: pl.pos, foot: pl.foot,
  wf: pl.wf, side: pl.side, ht: pl.ht ?? null, wt: pl.wt ?? null,
  ovr: pl.ovr, pot: pl.pot, age: pl.age, a: pl.a});

function livSideForRequest(){
  const st = S.current;
  const lineup = {}, instr = {};
  for(const sl of curForm().slots){
    const pid = st.starters[sl.id];
    lineup[sl.id] = pid ? serializePlayer(P(pid)) : null;
    if(pid) instr[pid] = {...instrFor(pid, sl.position)};
  }
  return {club_id: 'LIV', name: 'Liverpool', formation: st.formationId,
    lineup, bench: st.bench.map(id => serializePlayer(P(id))),
    tactics: {...st.tactics}, player_instructions: instr};
}

/* CPU clubs: real detailed players + generic-75 fillers with unique ids.
   Deterministic selection (squad logic may use OVR; the engine never does). */
const CPU_SURNAMES = ['Hartley','Okoye','Lindström','Barros','Kavanagh','Duarte','Nilsen','Mbaye',
  'Ferro','Ashworth','Kalu','Vidal','Brandt','Sørland','Quinn','Abara','Meyer','Rocha','Dobson','Yıldız'];
function cpuName(clubId, idx){
  // collision-free within a club: club-hash offset + squad index walks the pool
  return CPU_SURNAMES[(hashStr(clubId + ':names') + idx) % CPU_SURNAMES.length];
}
function cpuSideForRequest(clubId){
  const club = clubById(clubId);
  const det = premierLeaguePlayers.filter(p => p.clubId === clubId);
  const slots = formationOf('433').slots;
  const used = new Set(), lineup = {};
  const rank = {natural: 0, comfortable: 1, secondary: 2, out: 3};
  const order = [...slots].sort((a, b) =>
    det.filter(p => p.pos === a.position).length - det.filter(p => p.pos === b.position).length);
  for(const sl of order){
    const best = det.filter(p => !used.has(p.id)).sort((x, y) => {
      const rx = rank[suitability(x, sl.position)], ry = rank[suitability(y, sl.position)];
      return rx !== ry ? rx - ry : y.ovr - x.ovr;
    })[0];
    if(best && suitability(best, sl.position) !== 'out'){
      lineup[sl.id] = serializePlayer(best); used.add(best.id);
    }
  }
  let ni = 0;
  for(const sl of slots) if(!lineup[sl.id])
    lineup[sl.id] = serializePlayer(makeGenericPlayer({
      id: `${clubId.toLowerCase()}_gen_${sl.id.toLowerCase()}`,
      name: cpuName(clubId, ni++), pos: sl.position, elig: [sl.position], clubId}));
  const bench = ['GK', 'CB', 'CM', 'ST'].map((pos, i) => serializePlayer(makeGenericPlayer({
    id: `${clubId.toLowerCase()}_gen_b${i}`, name: cpuName(clubId, ni + i), pos, elig: [pos], clubId})));
  return {club_id: clubId, name: club.name, formation: '433', lineup, bench,
    tactics: {...(PRESETS[club.plan] || PRESETS['Balanced'])}, player_instructions: {}};
}

function buildV07MatchRequest(fixture){
  const livHome = isLivHome(fixture);
  const liv = livSideForRequest();
  const opp = cpuSideForRequest(livHome ? fixture.away : fixture.home);
  return {
    save_id: SAVE_ID,
    fixture_id: fixture.id,
    seed: fixtureSeed(fixture),
    mode: 'live',
    config: {duration_seconds: 90 * 60, record_timeline: false},
    coach_ai: {home: !livHome, away: livHome},   // Liverpool is HUMAN MANAGED
    home_team: livHome ? liv : opp,
    away_team: livHome ? opp : liv
  };
}

/* ── event feed: presentation mapping only — raw events kept in state ────── */
function presentEvent(e){
  const min = Math.max(1, Math.ceil(e.timestamp / 60));
  const d = e.detail || {}, nm = e.actor_name || '';
  const liv = teamIdIsLiv(e.team_id);
  switch(e.event_type){
    case 'GOAL': return {min, type: liv ? 'goal' : 'conc',
      text: `GOAL — ${nm}${d.assist ? ' (assist: ' + d.assist + ')' : ''}${d.penalty ? ' (penalty)' : ''}`};
    case 'SHOT':
      if(d.outcome === 'BLOCKED') return {min, type: 'shot', text: `${nm}'s shot is blocked`};
      if(d.outcome === 'MISS') return {min, type: 'shot', text: `${nm} shoots wide`};
      if(String(d.outcome || '').startsWith('SAVED'))
        return {min, type: 'shot', text: `${nm} shoots — saved by ${d.goalkeeper || 'the keeper'}`};
      return null;
    case 'PENALTY': return {min, type: 'cardev', text: `Penalty — ${nm} steps up: ${d.outcome === 'GOAL' ? 'scores' : 'does not score'}`};
    case 'CARD': return {min, type: 'cardev',
      text: `${String(d.card || 'YELLOW').includes('RED') ? 'Red' : 'Yellow'} card — ${nm}`};
    case 'SUBSTITUTION': return {min, type: 'info', text: `${sideName(e.team_id)}: ${d.player_on} on for ${d.player_off}`};
    case 'FORMATION_CHANGE': return {min, type: 'info', text: `${sideName(e.team_id)} switch to ${d.to}`};
    case 'TACTIC_CHANGE': return d.mode === 'MANAGER' ? null
      : {min, type: 'info', text: `${sideName(e.team_id)} adjust their approach`};
    case 'CORNER': return {min, type: 'shot', text: `Corner — ${sideName(e.team_id)}`};
    case 'FOUL': return {min, type: 'shot', text: `Foul by ${nm}`};
    case 'OFFSIDE': return {min, type: 'shot', text: `${nm} is flagged offside`};
    case 'HALFTIME': return {min: 45, type: 'info', text: 'Half time'};
    case 'FULL_TIME': return {min: 90, type: 'info', text: 'Full time'};
    default: return null;
  }
}

function makeLiveMatch(snap){
  const m = {matchId: snap.match_id, engine: snap.engine, status: 'live',
    clock: snap.minute, clockSeconds: snap.clock_seconds,
    score: [snap.score.home, snap.score.away], snap, events: [], feed: [],
    eventIndex: 0, playerEnergy: {}, playerRatings: {}, fullTime: null};
  mergeMatchSnapshot(m, snap);
  return m;
}
function mergeMatchSnapshot(m, snap){
  const _AR = activeAnim();
  if(m.clockSeconds !== undefined && snap.clock_seconds !== undefined && snap.clock_seconds < (_AR.head - 5)) _AR.reset(snap.clock_seconds);
  m.snap = snap;
  _AR.ingest(snap);
  m.clockSeconds = snap.clock_seconds; m.clock = snap.minute;
  m.score = [snap.score.home, snap.score.away];
  for(const [pid, p] of Object.entries(snap.players || {})){
    m.playerEnergy[pid] = p.energy;      // v0.7 owns Energy
    m.playerRatings[pid] = p.rating;     // v0.7 owns ratings
  }
  if(!ANIM3_ON && !ANIM4_ON) for(const e of snap.new_events || []){
    m.events.push(e);                    // raw ledger retained
    const line = presentEvent(e);
    if(line) m.feed.push(line);
  }  // anim3: AnimR3 commits events/feed when the viewer actually SEES them
  m.eventIndex = snap.event_count ?? m.eventIndex;
  if(snap.full_time) m.fullTime = snap.full_time;
  if(snap.status === 'ft') m.status = 'ft';
  if(m.status !== 'ft' && snap.management) reconcileDriftIfNeeded(snap.management);
}

async function kickOff(){
  const fixture = S.matchFixture;
  if(!fixture || S.match) return;
  if(ENGINE_MODE === 'mock') return mockKickOff();
  if(!SUPPORTED_ENGINE_FORMATIONS.includes(S.current.formationId)){
    toast(`${curForm().name} is not yet supported by FC Simulator v0.7 — use 4-3-3, 4-2-3-1 or 4-1-4-1.`);
    return;
  }
  if(startingIds().length < 11){ toast('You need 11 starters to kick off.'); return; }
  if(!(await checkEngineHealth())){
    toast('Match engine unavailable. Start the Touchline server and try again.');
    renderMatch(); return;
  }
  S.base = JSON.parse(JSON.stringify(S.current));
  S.changes = [];
  const req = buildV07MatchRequest(fixture);
  const condenseSide = side => ({
    club_id: side.club_id, formation: side.formation,
    starters: Object.fromEntries(Object.entries(side.lineup).map(([sl, pl]) => [sl, pl ? pl.id : null])),
    bench: side.bench.map(pl => pl.id),
    tactics: {...side.tactics},
    instructions: JSON.parse(JSON.stringify(side.player_instructions || {}))
  });
  let snap;
  try{
    snap = await api('/matches/start', {method: 'POST', body: req});
  }catch(e){ toast('Kickoff failed: ' + e.message); return; }
  // the exact accepted kickoff input — audit/reproduction record
  S.matchKickoff = {fixture_id: fixture.id, seed: req.seed,
    home: condenseSide(req.home_team), away: condenseSide(req.away_team)};
  S.match = makeLiveMatch(snap);
  setActiveMatchHandle(snap.match_id, fixture.id);
  renderMatch(); renderPitch();
  clearInterval(matchTimer);
  matchTimer = setInterval(tick, TICK_MS);
}

/* Sequencing contract: at most one /advance is in flight (advanceInFlight),
   ticks are skipped while a management request is pending (mgmtPending), and
   the server serializes both on a per-match lock — so a management change is
   applied at an unambiguous engine timestamp, exact while paused.          */
async function tick(){
  const m = S.match;
  if(!m || m.status !== 'live' || advanceInFlight || mgmtPending) return;
  advanceInFlight = true;
  try{
    if(ANIM_ANY && activeAnim().frames.length && activeAnim().remaining() > currentBatch() * 1.5){ advanceInFlight = false; return; }
    let secs = currentBatch();
    if(m.clockSeconds < HALF_SECONDS) secs = Math.min(secs, HALF_SECONDS - m.clockSeconds);
    const snap = await api(`/matches/${m.matchId}/advance`,
      {method: 'POST', body: {seconds: secs, last_event_index: m.eventIndex, frames: ANIM_ANY}});
    mergeMatchSnapshot(m, snap);
    if(m.status !== 'ft' && !m.htShown && m.clockSeconds >= HALF_SECONDS){
      m.htShown = true; m.htActive = true;      // half time: stop automatic advancement
      m.status = 'paused';
      clearInterval(matchTimer);
    }
    if(m.status === 'ft'){
      clearInterval(matchTimer);
      clearActiveMatchHandle();
      if(S.ui.view === 'match') renderMatch();   // show the FT report immediately
      await finalizeFixture();                   // league sims run behind the progress bar
    }
  }catch(e){
    // Backend unreachable: never simulate locally — pause, then resync to the
    // authoritative snapshot and resume automatically once the engine answers.
    m.status = 'reconnecting'; clearInterval(matchTimer);
    toast('Engine connection lost — reconnecting…');
    scheduleResync(m.matchId);
  }finally{
    advanceInFlight = false;
  }
  if(S.ui.view === 'match') renderMatch();
  if(S.ui.view === 'squad') renderPitch();
}
let resyncTimer = null;
function scheduleResync(matchId){
  clearTimeout(resyncTimer);
  resyncTimer = setTimeout(async () => {
    const m = S.match;
    if(!m || m.matchId !== matchId || m.status !== 'reconnecting') return;
    try{
      const snap = await api(`/matches/${m.matchId}?since=${m.eventIndex}`);
      activeAnim().reset(snap.clock_seconds || 0);
      mergeMatchSnapshot(m, snap);
      m.status = 'live';
      clearInterval(matchTimer); matchTimer = setInterval(tick, TICK_MS);
      toast('Engine reconnected');
      if(S.ui.view === 'match') renderMatch();
    }catch(e){ scheduleResync(matchId); }
  }, 3000);
}
async function resumeActiveMatch(){
  const h = getActiveMatchHandle();
  if(!h || !h.matchId) return false;
  try{
    const snap = await api(`/matches/${h.matchId}`);
    const fixture = S.season.fixtures.find(f => f.id === h.fixtureId);
    if(!fixture || S.season.results[fixture.id]){ clearActiveMatchHandle(); return false; }
    S.matchFixture = fixture;
    S.match = makeLiveMatch(snap);
    S.match.status = 'paused';        // resume paused; the manager presses play
    show('match'); renderMatch();
    toast('Reconnected to your live match');
    return true;
  }catch(e){
    clearActiveMatchHandle();          // finished/expired: normal navigation
    return false;
  }
}
function togglePlay(){
  const m = S.match; if(!m || m.status === 'ft') return;
  if(m.status === 'live'){ m.status = 'paused'; clearInterval(matchTimer); }
  else {
    m.status = 'live'; m.htActive = false;
    clearInterval(matchTimer); matchTimer = setInterval(tick, TICK_MS);
  }
  renderMatch();
}
function startSecondHalf(){
  const m = S.match; if(!m || !m.htActive) return;
  m.htActive = false;
  m.status = 'live';
  clearInterval(matchTimer); matchTimer = setInterval(tick, TICK_MS);
  renderMatch();
}
function abandonMatch(){
  clearInterval(matchTimer);
  clearActiveMatchHandle();
  const m = S.match;
  if(m && m.matchId) api(`/matches/${m.matchId}`, {method: 'DELETE'}).catch(() => {});
  S.match = null; S.matchFixture = null; S.changes = [];
  show('schedule');
}

/* Live formation change: Python performs its own deterministic remap and the
   returned management state is rendered verbatim. The frontend NEVER runs its
   own suitability/remap algorithm for a live change.                       */
async function liveFormationChange(newId){
  if(mgmtPending) return false;
  mgmtPending = true;
  try{
    const r = await api(`/matches/${S.match.matchId}/formation`, {method: 'POST',
      body: {team: livTeamId(), formation: newId}});
    mgmtPending = false;
    reconcileLiveFromEngine(r.management);
    S.changes.push({minute: S.match.clock, text: `Shape → ${formationOf(newId).name}`});
    saveState();
    return true;
  }catch(e){
    mgmtPending = false;
    toast(e.message);
    return false;
  }
}

   Everything football on this screen is Python state rendered verbatim:

/* rc7 animated renderer: canvas layer above the pitch SVG; legacy circle
   markers are hidden while it is active (?renderer=circles restores them). */
/* (styles) */
/* markers glide between accepted backend positions via CSS transitions —
   interpolation is cosmetic; the next snapshot always wins.               */
/* ══════════════ ANIMATED MATCH RENDERER (rc7 milestone 1) ══════════════
   Visualizes the authoritative simulation only. Consumes per-second server
   keyframes (read-only sampling; digest-neutral) + the event ledger. Never
   decides outcomes, timing, positions or possession; interpolation and
   animation are cosmetic. No simulation RNG is consumed; no cosmetic RNG is
   used at all in milestone 1. */
const RENDERER = new URLSearchParams(location.search).get('renderer') || 'anim2';
const ANIM_ON  = !['circles','anim2','anim3','anim4'].includes(RENDERER);  // Milestone-1 (?renderer=anim1)
const ANIM2_ON = RENDERER === 'anim2';                             // Milestone-2 renderer (DEFAULT since RC8)
const ANIM3_ON = RENDERER === 'anim3';                             // Milestone-3 (comparison/rollback)
const ANIM4_ON = RENDERER === 'anim4';                             // Milestone-4 PHYSICAL BALL (staging)
const ANIM_ANY = ANIM_ON || ANIM2_ON || ANIM3_ON || ANIM4_ON;
function activeAnim(){ return ANIM4_ON ? AnimR4 : ANIM3_ON ? AnimR3 : ANIM2_ON ? AnimR2 : AnimR; }
const PLAY_RATE = {1: 6, 2: 12, 4: 24};          // sim-seconds per real second
const ACT = {IDLE:0, WALK:1, JOG:2, RUN:3, SPRINT:4, ONBALL:5, EVADE:6};
const AnimR = {
  frames: [], roster: null, head: 0, lastTs: null, canvas: null, ctx: null,
  players: {},           // pid -> {x,y,vx,vy,face,gait,anim,animUntil,team,act,active,name}
  ball: {x:50,y:50,state:'KEY',fx:0,fy:0,tx:0,ty:0,t0:0,t1:0,arc:0},
  evq: [], evDone: 0, dbg: {ids:false, auth:false, vel:false, anim:false, energy:false},
  fps: {frames:0, t0:0, value:0},

  bufferedUntil(){ return this.frames.length ? this.frames[this.frames.length-1][0] : this.head; },
  remaining(){ return Math.max(0, this.bufferedUntil() - this.head); },

  reset(clock){ this.frames = []; this.head = clock; this.evq = []; this.ball.state = 'KEY'; },

  ingest(snap){
    if(!ANIM_ON) return;
    if(snap.roster) this.roster = snap.roster;
    if(snap.frames && snap.frames.length){
      if(!this.frames.length) this.head = snap.frames[0][0] - 1;
      const last = this.bufferedUntil();
      for(const f of snap.frames) if(f[0] > last || !this.frames.length) this.frames.push(f);
      while(this.frames.length && this.frames[0][0] < this.head - 3) this.frames.shift();
    }
    for(const e of (snap.new_events || []))
      if(['PASS','CROSS','SHOT','DRIBBLE','TACKLE','CARRY','GOAL','FOUL','OFFSIDE','CORNER','FREE_KICK','PENALTY','GK_SWEEP','CLEARANCE'].includes(e.event_type))
        this.evq.push(e);
    this.evq.sort((a,b) => a.timestamp - b.timestamp);
  },

  frameAt(t){  // returns [before, after, alpha]
    const F = this.frames;
    if(!F.length) return null;
    if(t <= F[0][0]) return [F[0], F[0], 0];
    for(let i=F.length-1; i>=0; i--){
      if(F[i][0] <= t){
        const a = F[i], b = F[Math.min(i+1, F.length-1)];
        const al = b[0] === a[0] ? 0 : (t - a[0]) / (b[0] - a[0]);
        return [a, b, Math.min(1, al)];
      }
    }
    return [F[F.length-1], F[F.length-1], 0];
  },

  ensureCanvas(){
    const pitch = $('#livePitch'); if(!pitch) return false;
    if(ANIM_ANY) pitch.classList.add('anim');
    if(DEBUG_MODE) pitch.classList.add('debugon');
    if(!this.canvas || !pitch.contains(this.canvas)){
      this.canvas = document.createElement('canvas');
      this.canvas.className = 'animcanvas';
      pitch.appendChild(this.canvas);
      this.ctx = this.canvas.getContext('2d');
      this.canvas.onclick = (ev) => {
        const r = this.canvas.getBoundingClientRect();
        const mx = ev.clientX - r.left, my = ev.clientY - r.top;
        let best = null, bd = 26;
        for(const [pid, p] of Object.entries(this.players)){
          const [px, py] = this.toPx(p.x, p.y);
          const d = Math.hypot(px-mx, py-my);
          if(d < bd){ bd = d; best = pid; }
        }
        if(best) selectLivePlayer(best);
      };
      if(DEBUG_MODE && !pitch.querySelector('.animdbg')){
        const d = document.createElement('div');
        d.className = 'animdbg';
        d.innerHTML = ['ids','auth','vel','anim','energy'].map(k =>
          `<label><input type="checkbox" onchange="AnimR.dbg.${k}=this.checked"> ${k}</label>`).join('') +
          `<div id="animdbgline" style="opacity:.75;margin-top:4px"></div>`;
        pitch.appendChild(d);
      }
    }
    const w = pitch.clientWidth, h = pitch.clientHeight, dpr = window.devicePixelRatio || 1;
    if(this.canvas.width !== w*dpr || this.canvas.height !== h*dpr){
      this.canvas.width = w*dpr; this.canvas.height = h*dpr;
      this.canvas.style.width = w+'px'; this.canvas.style.height = h+'px';
      this.ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    return true;
  },

  toPx(x, y){  // engine coords -> canvas px via the drawn-pitch mapping (P4)
    const sc = liveScreen(x, y);
    return [sc.l/100 * this.canvas.clientWidth, sc.t/100 * this.canvas.clientHeight];
  },

  step(dt){
    const m = S.match; if(!m) return;
    const paused = m.status !== 'live';
    const rate = paused ? 0 : (PLAY_RATE[S.ui.matchSpeed || 1] || 6);
    let target = this.head + dt * rate;
    target = Math.min(target, this.bufferedUntil());
    // fire events crossed by the playhead
    while(this.evq.length && this.evq[0].timestamp <= target){
      this.applyEvent(this.evq.shift());
    }
    this.head = target;
    const fr = this.frameAt(this.head);
    if(!fr) return;
    const [a, b, al] = fr;
    const speedScale = S.ui.matchSpeed || 1;
    const names = m.snap && m.snap.players ? m.snap.players : {};
    (this.roster || []).forEach((pid, k) => {
      const pa = a[4][k], pb = b[4][k];
      if(!pa) return;
      const x = pa[0] + (pb[0]-pa[0])*al, y = pa[1] + (pb[1]-pa[1])*al;
      let p = this.players[pid];
      if(!p){ p = this.players[pid] = {x, y, vx:0, vy:0, face:0, gait:0, anim:null, animUntil:0,
                                       team:(names[pid]||{}).team || (k<16?'HOME':'AWAY')}; }
      const vx = (pb[0]-pa[0]) * 1.05, vy = (pb[1]-pa[1]) * 0.68;   // m per sim-second
      p.vx = vx; p.vy = vy;
      p.x = x; p.y = y;
      p.act = pa[2]; p.active = pa[3];
      p.energy = (names[pid]||{}).energy;
      p.name = (names[pid]||{}).name || pid;
      p.team = (names[pid]||{}).team || p.team;
      // facing: action target > ball if on-ball > velocity > hold
      let want = p.face;
      const sp = Math.hypot(vx, vy);
      if(p.anim && this.head < p.animUntil && p.animTx !== undefined){
        want = Math.atan2(p.animTy - y, p.animTx - x);
      } else if(pa[2] === 5 || pa[2] === 6){       // on ball: face ball travel dir / opponent goal
        want = Math.atan2((p.team==='HOME'?50:50) - y, (p.team==='HOME'?100:0) - x);
      } else if(sp > 0.6){
        want = Math.atan2(vy/0.68, vx/1.05);
      }
      let dfa = ((want - p.face + Math.PI*3) % (Math.PI*2)) - Math.PI;
      const maxTurn = 7.2 * dt * speedScale;        // rad/s, shortened turns at speed
      p.face += Math.max(-maxTurn, Math.min(maxTurn, dfa));
      // gait phase advances with speed
      p.gait += dt * rate * Math.max(0.6, sp) * 1.6;
      if(p.anim && this.head >= p.animUntil) p.anim = null;
    });
    // ball
    const bl = this.ball;
    if(bl.state === 'FLIGHT'){
      if(this.head >= bl.t1){ bl.state = 'KEY'; }
      else {
        const u = (this.head - bl.t0) / Math.max(0.01, bl.t1 - bl.t0);
        bl.x = bl.fx + (bl.tx - bl.fx) * u;
        bl.y = bl.fy + (bl.ty - bl.fy) * u;
        bl.h = bl.arc ? Math.sin(Math.PI * u) : 0;
      }
    }
    if(bl.state !== 'FLIGHT'){
      const bx = a[1] + (b[1]-a[1])*al, by = a[2] + (b[2]-a[2])*al;
      // controlled: offset toward carrier facing
      let carrier = null, cd = 2.6;
      for(const [pid, p] of Object.entries(this.players)){
        const d = Math.hypot((p.x-bx)*1.05, (p.y-by)*0.68);
        if(d < cd){ cd = d; carrier = p; }
      }
      if(carrier && cd < 1.8){
        bl.x = carrier.x + Math.cos(carrier.face) * 0.9;
        bl.y = carrier.y + Math.sin(carrier.face) * 1.2;
      } else { bl.x = bx; bl.y = by; }
      bl.h = 0;
    }
  },

  applyEvent(e){
    const d = e.detail || {};
    const actor = this.players[e.actor_id];
    const dur = (S.ui.matchSpeed||1) === 1 ? 0.6 : 0.3;
    const setAnim = (p, name, tx, ty, dr) => {
      if(!p) return;
      p.anim = name; p.animUntil = e.timestamp + (dr || dur);
      if(tx !== undefined){ p.animTx = tx; p.animTy = ty; } else { p.animTx = undefined; }
    };
    const flight = (fx, fy, tx, ty, arc) => {
      const dist = Math.hypot((tx-fx)*1.05, (ty-fy)*0.68);
      const bl = this.ball;
      bl.state = 'FLIGHT'; bl.fx = fx; bl.fy = fy; bl.tx = tx; bl.ty = ty;
      bl.t0 = e.timestamp; bl.t1 = e.timestamp + Math.min(1.0, Math.max(0.18, dist/22));
      bl.arc = arc ? 1 : 0;
    };
    if(e.event_type === 'PASS' && d.actual_target && actor){
      const aerial = ['LONG','CROSS','THROUGH'].includes(d.pass_type) && d.distance_m > 24;
      setAnim(actor, d.pass_type === 'LONG' ? 'LONG_PASS' : 'PASS', d.actual_target[0], d.actual_target[1]);
      flight(actor.x, actor.y, d.actual_target[0], d.actual_target[1], aerial);
    } else if(e.event_type === 'CROSS' && d.landing && actor){
      setAnim(actor, 'CROSS', d.landing[0], d.landing[1]);
      flight(actor.x, actor.y, d.landing[0], d.landing[1], true);
    } else if(e.event_type === 'SHOT' && actor){
      const gx = actor.team === 'HOME' ? 100 : 0;
      let gy = 50;
      if(d.outcome === 'MISS') gy = 44;                          // visually wide
      if(d.outcome === 'BLOCKED'){ setAnim(actor, 'SHOOT', gx, gy);
        flight(actor.x, actor.y, actor.x + (gx>actor.x?3:-3), actor.y, false); }
      else { setAnim(actor, 'SHOOT', gx, gy); flight(actor.x, actor.y, gx, gy, d.shot_type==='HEADER'); }
      // GK reaction
      for(const [pid, p] of Object.entries(this.players)){
        if(p.team !== actor.team && (S.match.snap.players[pid]||{}).slot === 'GK')
          setAnim(p, ['SAVED_PARRIED','SAVED_CAUGHT','SAVED'].some(o=>String(d.outcome||'').startsWith(o.split('_')[0])) ? 'DIVE' : 'SET', gx, gy, 0.9);
      }
    } else if(e.event_type === 'DRIBBLE' && actor){
      setAnim(actor, d.outcome === 'BEAT' ? 'BEAT' : 'TAKE_ON', undefined, undefined, 0.8);
    } else if(e.event_type === 'TACKLE' && actor){
      setAnim(actor, 'TACKLE', undefined, undefined, 0.7);
    } else if(e.event_type === 'FOUL' && actor){
      setAnim(this.players[e.actor_id], 'FOUL', undefined, undefined, 0.8);
    } else if(e.event_type === 'CARRY' && actor && d.outcome === 'HEAVY_TOUCH'){
      setAnim(actor, 'CONTROL', undefined, undefined, 0.5);
    }
  },

  drawPlayer(p, pid){
    const c = this.ctx;
    const [px, py] = this.toPx(p.x, p.y);
    const liv = teamIdIsLiv(p.team);
    const shirt = liv ? '#d33c47' : '#5b84d6';
    const shorts = liv ? '#a02832' : '#2f4f8f';
    const sp = Math.hypot(p.vx, p.vy);
    const stride = (p.act >= 3 || sp > 3.5) ? 4.2 : (p.act === 2 || sp > 1.4) ? 3 : (sp > 0.4 ? 1.8 : 0);
    const lg = Math.sin(p.gait) * stride;
    c.save();
    c.translate(px, py);
    c.rotate(p.face + Math.PI/2);
    // shadow
    c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(0, 2, 6, 3, 0, 0, Math.PI*2); c.fill();
    // legs (skin+shorts side)
    c.strokeStyle = '#c8916b'; c.lineWidth = 2.6; c.lineCap = 'round';
    let kick = 0;
    if(p.anim && ['PASS','LONG_PASS','CROSS','SHOOT'].includes(p.anim)) kick = 6;
    c.beginPath(); c.moveTo(-2.4, 1); c.lineTo(-2.4, 6 + (stride? lg : 0)); c.stroke();
    c.beginPath(); c.moveTo(2.4, 1); c.lineTo(2.4 , 6 + (stride? -lg : 0) - kick*0.0); c.stroke();
    if(kick){ c.beginPath(); c.moveTo(2.4, 1); c.lineTo(2.4, -4); c.stroke(); }
    // shorts
    c.fillStyle = shorts; c.fillRect(-4, -1, 8, 4);
    // torso
    c.fillStyle = shirt; c.beginPath(); c.roundRect(-4.6, -8, 9.2, 8, 3); c.fill();
    // arms
    c.strokeStyle = shirt; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(-4.6, -6); c.lineTo(-6.4, -1 + (stride? -lg*0.7 : 0)); c.stroke();
    c.beginPath(); c.moveTo(4.6, -6); c.lineTo(6.4, -1 + (stride? lg*0.7 : 0)); c.stroke();
    // head
    c.fillStyle = '#d9a679'; c.beginPath(); c.arc(0, -10.5, 3.4, 0, Math.PI*2); c.fill();
    // tackle pose: rotate slightly + slide line
    if(p.anim === 'TACKLE'){ c.strokeStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(0,8); c.lineTo(0,14); c.stroke(); }
    if(p.anim === 'DIVE'){ c.strokeStyle = 'rgba(255,255,120,.5)'; c.beginPath(); c.moveTo(-8,0); c.lineTo(8,0); c.stroke(); }
    c.restore();
    // name
    c.fillStyle = 'rgba(233,240,236,.75)'; c.font = '9px system-ui'; c.textAlign = 'center';
    c.fillText(shortName(p.name || pid), px, py + 16);
    // debug overlays
    if(DEBUG_MODE){
      if(this.dbg.ids){ c.fillStyle = '#8fd'; c.fillText(pid, px, py - 18); }
      if(this.dbg.anim && p.anim){ c.fillStyle = '#fd8'; c.fillText(p.anim, px, py - 18); }
      if(this.dbg.vel && (p.vx || p.vy)){
        c.strokeStyle = 'rgba(120,220,255,.7)'; c.beginPath(); c.moveTo(px, py);
        c.lineTo(px + p.vx*4, py + p.vy*4); c.stroke();
      }
      if(this.dbg.energy && p.energy !== undefined){
        c.fillStyle = energyColor(p.energy); c.fillRect(px-8, py+18, 16 * p.energy/100, 2);
      }
    }
  },

  draw(){
    if(!this.ensureCanvas()) return;
    const c = this.ctx;
    c.clearRect(0, 0, this.canvas.clientWidth, this.canvas.clientHeight);
    if(!this.frames.length) return;
    const fr = this.frameAt(this.head);
    if(!fr) return;
    // debug: authoritative keyframe dots
    if(DEBUG_MODE && this.dbg.auth){
      const [a] = fr;
      c.fillStyle = 'rgba(255,255,255,.35)';
      (this.roster||[]).forEach((pid,k) => {
        const pa = a[4][k]; if(!pa) return;
        const [px,py] = this.toPx(pa[0], pa[1]);
        c.beginPath(); c.arc(px, py, 2, 0, Math.PI*2); c.fill();
      });
    }
    // players sorted by y for painter's order
    const entries = Object.entries(this.players).filter(([,p]) => p.active !== 0);
    entries.sort((x,y) => x[1].y - y[1].y);
    for(const [pid, p] of entries) this.drawPlayer(p, pid);
    // ball
    const [bx, by] = this.toPx(this.ball.x, this.ball.y);
    const h = this.ball.h || 0;
    c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(bx, by+1, 3, 1.6, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#f4f4ec'; c.beginPath(); c.arc(bx, by - h*10, 3.2 + h*1.6, 0, Math.PI*2); c.fill();
    c.strokeStyle = '#333'; c.lineWidth = .7; c.stroke();
    if(DEBUG_MODE){
      const el = document.getElementById('animdbgline');
      if(el) el.textContent = `t=${this.head.toFixed(1)}s buf=${this.remaining().toFixed(0)}s fps=${this.fps.value}`;
    }
  },

  loop(ts){
    if(ANIM_ON && S.match && S.ui.view === 'match'){
      const dt = this.lastTs ? Math.min(0.1, (ts - this.lastTs)/1000) : 0.016;
      this.step(dt);
      this.draw();
      this.fps.frames++;
      if(ts - this.fps.t0 > 1000){ this.fps.value = this.fps.frames; this.fps.frames = 0; this.fps.t0 = ts; }
    }
    this.lastTs = ts;
    requestAnimationFrame((t) => this.loop(t));
  },
};
if(typeof window !== 'undefined') requestAnimationFrame((t) => AnimR.loop(t));

/* ═══════════════════ RENDERER MILESTONE 2 PROTOTYPE (?renderer=anim2) ═══════════════════
   Three clocks: (1) authoritative sim clock — buffered 1 Hz frames + events, never altered;
   (2) presentation timeline — deterministic event-aware temporal compression so a 90-minute
   match plays in ~5/7.5/10 real minutes while humans move at believable speeds;
   (3) ~60 fps render clock. Presentation player positions PURSUE the authoritative state
   under a human speed cap and are anchored exactly at authoritative events; the ball is an
   independent presentation object with cosmetic height z, ground shadow, per-action flight
   profiles, bounce/roll — always reconciling to the next authoritative ball state.
   Deterministic: NO Math.random anywhere; cosmetic variation hashes player ids.
   PRESENTATION ONLY: consumes the same frames/events feed as anim1; zero server changes. */
const ANIM2_LEN = {quick: 300, standard: 450, extended: 600};
const A2 = {                       // pose/state ids
  IDLE:0, JOG:1, RUN:2, SPRINT:3, TURN:4, RECEIVE:5, PASS:6, SHOT:7,
  DRIBBLE:8, TAKEON:9, TACKLE:10, RECOVERY:11, GKDIVE:12, SHIELD:13,
};
function a2hash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0); }

const AnimR2 = {
  frames: [], roster: null, canvas: null, ctx: null, lastTs: null,
  S: 0, P: 0, rate: 8, targetLen: ANIM2_LEN.standard, lenMode: 'standard',
  players: {},                     // pid -> presentation state (world meters)
  ball: {x:55.1, y:34, z:0, state:'LOOSE', vx:0, vy:0, sh:null, holder:null},
  evq: [], interest: {}, holdS: null, holdUntilP: 0,
  cam: {mode:'gameplay', x:52.6, y:34, vx:0, vy:0, scale:16},
  dbg: {on:false, panel:null}, fps: {frames:0, t0:0, value:0}, frameMs: {sum:0,n:0,max:0},
  totalSim: 5400,

  get head(){ return this.S; },
  bufferedUntil(){ return this.frames.length ? this.frames[this.frames.length-1][0] : this.S; },
  remaining(){ return Math.max(0, this.bufferedUntil() - this.S); },
  reset(clock){ this.frames = []; this.S = clock; this.P = clock / (this.totalSim / this.targetLen);
                this.evq = []; this.interest = {}; this.holdS = null; this.ball.state = 'LOOSE'; },

  /* world coords: meters, same visual orientation as liveScreen (LIV attacks a fixed way) */
  flip(){ return S.matchFixture && !isLivHome(S.matchFixture); },
  wx(x){ return (this.flip() ? 100 - x : x) * 1.05; },
  wy(y){ return y * 0.68; },

  ingest(snap){
    if(!ANIM2_ON) return;
    if(snap.roster) this.roster = snap.roster;
    if(snap.frames && snap.frames.length){
      if(!this.frames.length) this.S = snap.frames[0][0] - 1;
      const last = this.bufferedUntil();
      for(const f of snap.frames) if(f[0] > last || !this.frames.length) this.frames.push(f);
      while(this.frames.length && this.frames[0][0] < this.S - 4) this.frames.shift();
    }
    for(const e of (snap.new_events || []))
      if(['PASS','CROSS','SHOT','DRIBBLE','TACKLE','CARRY','GOAL','FOUL','OFFSIDE','CORNER',
          'FREE_KICK','PENALTY','CLEARANCE','BOX_ENTRY','GROUND_DUEL','SHIELD','GOAL_KICK',
          'THROW_IN','POSSESSION_CHANGE'].includes(e.event_type)) this.evq.push(e);
    this.evq.sort((a,b) => a.timestamp - b.timestamp);
  },

  /* ── event-aware interest: deterministic score per sim-second ── */
  interestAt(t){
    t = Math.max(1, Math.round(t));
    if(this.interest[t] !== undefined) return this.interest[t];
    let sc = 0.5;
    for(const e of this.evq){
      const d = Math.abs(e.timestamp - t);
      if(d > 5) continue;
      const w = d <= 1 ? 1 : d <= 3 ? 0.6 : 0.3;
      const base = {SHOT:10, GOAL:10, PENALTY:10, DRIBBLE:8, TACKLE:7, BOX_ENTRY:8, CROSS:7,
                    CORNER:7, FREE_KICK:6, GROUND_DUEL:5, CLEARANCE:4, FOUL:5, OFFSIDE:5,
                    GOAL_KICK:1, THROW_IN:2, SHIELD:3, CARRY:1.5, POSSESSION_CHANGE:4}[e.event_type] || 0;
      let b = base;
      if(e.event_type === 'PASS'){
        const pt = (e.detail || {}).pass_type;
        b = (pt === 'THROUGH' || pt === 'CUTBACK') ? 8 : (pt === 'PROGRESSIVE' || pt === 'LONG' || pt === 'AERIAL_LONG' || pt === 'CROSS') ? 4.5 : 1.5;
      }
      sc = Math.max(sc, b * w);
    }
    const fr = this.frameAtSim(t);
    if(fr){
      const bx = fr[0][1];
      const rel = Math.max(bx, 100 - bx);          // proximity to either goal
      if(rel >= 83) sc = Math.max(sc, 6); else if(rel >= 66) sc = Math.max(sc, 3);
    }
    this.interest[t] = sc;
    return sc;
  },

  frameAtSim(t){
    const F = this.frames;
    if(!F.length) return null;
    let lo = 0, hi = F.length - 1;
    while(lo < hi){ const m = (lo + hi) >> 1; if(F[m][0] < t) lo = m + 1; else hi = m; }
    const b = F[lo], a = F[Math.max(0, lo - 1)];
    const al = a[0] === b[0] ? 0 : Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0])));
    return [a, b, al];
  },
  authPos(pid, t){
    const fr = this.frameAtSim(t);
    if(!fr || !this.roster) return null;
    const k = this.roster.indexOf(pid);
    if(k < 0) return null;
    const pa = fr[0][4][k], pb = fr[1][4][k];
    if(!pa || !pb) return null;
    return {x: this.wx(pa[0] + (pb[0]-pa[0])*fr[2]), y: this.wy(pa[1] + (pb[1]-pa[1])*fr[2]),
            act: pa[2], active: pa[3],
            vx: (this.wx(pb[0]) - this.wx(pa[0])), vy: (this.wy(pb[1]) - this.wy(pa[1]))};
  },
  authBall(t){
    const fr = this.frameAtSim(t);
    if(!fr) return null;
    return {x: this.wx(fr[0][1] + (fr[1][1]-fr[0][1])*fr[2]), y: this.wy(fr[0][2] + (fr[1][2]-fr[0][2])*fr[2])};
  },

  ensureCanvas(){
    const pitch = $('#livePitch'); if(!pitch) return;
    if(this.canvas && pitch.contains(this.canvas)) return;
    this.canvas = document.createElement('canvas');
    this.canvas.className = 'animcanvas anim2';
    pitch.appendChild(this.canvas);
    this.ctx = this.canvas.getContext('2d');
    this.dbg.on = DEBUG_MODE;
    if(this.dbg.on && !this.dbg.panel){
      const d = document.createElement('div');
      d.className = 'animdbg';
      d.innerHTML = `<div id="a2status" style="white-space:pre"></div>
        <label><input type="checkbox" id="a2cam" checked> gameplay cam</label>
        <label>len <select id="a2len"><option>quick</option><option selected>standard</option><option>extended</option></select></label>`;
      pitch.appendChild(d);
      d.querySelector('#a2cam').addEventListener('change', ev => { this.cam.mode = ev.target.checked ? 'gameplay' : 'tactical'; });
      d.querySelector('#a2len').addEventListener('change', ev => { this.lenMode = ev.target.value; this.targetLen = ANIM2_LEN[ev.target.value]; });
      this.dbg.panel = d;
    }
    const qc = new URLSearchParams(location.search).get('cam');
    if(qc === 'tactical') this.cam.mode = 'tactical';
    const ql = new URLSearchParams(location.search).get('len');
    if(ql && ANIM2_LEN[ql]){ this.lenMode = ql; this.targetLen = ANIM2_LEN[ql]; }
  },

  /* ── presentation step: variable-rate sim consumption + pursuit motion ── */
  step(dt){
    const m = S.match; if(!m) return;
    const spd = S.ui.matchSpeed || 1;
    // presentation runs whenever buffered sim remains; only a USER pause freezes it
    // (halftime/FT/reconnect drain the already-authoritative buffer, never simulate)
    const live = !(m.status === 'paused' && !m.htActive) && this.S < this.bufferedUntil() + 0.5;
    if(live && this.frames.length){
      // rate shaping from interest, budget-corrected (deterministic)
      const i = this.interestAt(this.S + 1);
      let shape = i >= 8 ? 2.0 : i >= 6 ? 3.5 : i >= 4 ? 6 : i >= 2 ? 12 : 24;
      const pace = this.totalSim / this.targetLen;                    // avg sim-s per real-s
      // deficit-proportional pacing: keep S tracking P*pace without ever
      // skipping events; a 45-sim-s deficit doubles the local rate.
      const deficit = this.P * pace - this.S;
      const g = Math.min(4.0, Math.max(0.45, 1 + deficit / 35));
      const rDes = Math.min(40, Math.max(1.6, shape * g * (pace / 12)));
      this.rate += (rDes - this.rate) * Math.min(1, dt * 3);
      let limit = this.bufferedUntil();
      // ball-flight sync: hold the sim clock just past the launch event until the
      // visual flight lands, so receivers never act before the ball arrives.
      if(this.ball.state === 'FLIGHT' && this.holdS !== null
         && this.P < this.ball.p0 + (this.ball.p1 - this.ball.p0) * 0.5) limit = Math.min(limit, this.holdS);
      const S0 = this.S;
      this.S = Math.min(limit, this.S + this.rate * dt * spd);
      this.P += dt * spd;
      // fire events crossed by the sim head
      while(this.evq.length && this.evq[0].timestamp <= this.S){
        const e = this.evq.shift();
        if(e.timestamp > S0 - 2) this.applyEvent(e);
      }
    }
    // ── players: capped-speed pursuit of authoritative state ──
    const names = m.snap && m.snap.players ? m.snap.players : {};
    if(this.roster) for(const pid of this.roster){
      const A = this.authPos(pid, this.S);
      if(!A) continue;
      let p = this.players[pid];
      if(!p){
        p = this.players[pid] = {x:A.x, y:A.y, vx:0, vy:0, face:0, gait:a2hash(pid)%628/100, pose:A2.IDLE,
                                 poseT:0, poseDur:0, poseTx:0, poseTy:0, team:(names[pid]||{}).team,
                                 touch:0, name:(names[pid]||{}).name || pid};
      }
      p.active = A.active; p.team = (names[pid]||{}).team || p.team; p.name = (names[pid]||{}).name || p.name;
      if(!A.active) continue;
      const dx = A.x - p.x, dy = A.y - p.y, dist = Math.hypot(dx, dy);
      if(dist > 25){ p.x = A.x; p.y = A.y; p.vx = p.vy = 0; continue; }   // restart/half snap
      const catchup = dist > 10 ? 1 + (dist - 10) * 0.35 : 1;             // laggards accelerate, never teleport
      const vmax = Math.min(14, 9.2 * catchup);                            // hard human ceiling
      let sp = Math.min(vmax, dist / 0.38);
      if(dist < 0.15) sp = 0;
      const ux = dist ? dx / dist : 0, uy = dist ? dy / dist : 0;
      const nvx = ux * sp, nvy = uy * sp;
      p.vx += (nvx - p.vx) * Math.min(1, dt * 8); p.vy += (nvy - p.vy) * Math.min(1, dt * 8);
      p.x += p.vx * dt * (live ? spd : 0); p.y += p.vy * dt * (live ? spd : 0);
      const v = Math.hypot(p.vx, p.vy);
      // facing: pose target > motion > ball
      let want = p.face;
      if(p.poseT < p.poseDur && (p.poseTx || p.poseTy)) want = Math.atan2(p.poseTy - p.y, p.poseTx - p.x);
      else if(v > 0.6) want = Math.atan2(p.vy, p.vx);
      else want = Math.atan2(this.ball.y - p.y, this.ball.x - p.x);
      let dfc = ((want - p.face + Math.PI*3) % (Math.PI*2)) - Math.PI;
      const maxTurn = 9 * dt * Math.max(0.5, Math.min(1, v/3 + 0.5));
      p.face += Math.abs(dfc) > maxTurn ? Math.sign(dfc) * maxTurn : dfc;
      // locomotion state from PRESENTATION speed (believable cadence by design)
      p.pose = p.poseT < p.poseDur ? p.pose
             : v > 6.4 ? A2.SPRINT : v > 4.2 ? A2.RUN : v > 1.2 ? A2.JOG : A2.IDLE;
      p.poseT += dt;
      p.gait += v * dt * 1.35;                                          // stride cadence ∝ speed
    }
    // ── ball ──
    this.stepBall(dt, live ? spd : 0);
    // ── camera ──
    this.stepCam(dt);
  },

  setPose(pid, pose, dur, tx, ty){
    const p = this.players[pid]; if(!p) return;
    p.pose = pose; p.poseT = 0; p.poseDur = dur; p.poseTx = tx || 0; p.poseTy = ty || 0;
  },

  /* flight profiles: cosmetic z apex (m) + speed (m/s) by action type — Part M */
  flightProfile(kind, distM){
    switch(kind){
      case 'GROUND':   return {apex: 0,                      v: 26};
      case 'DRIVEN':   return {apex: Math.min(0.8, distM*0.02), v: 30};
      case 'LOFTED':   return {apex: Math.min(6, 1.5 + distM*0.14), v: 22};
      case 'THROUGH':  return {apex: Math.min(0.5, distM*0.015), v: 28};
      case 'CROSS':    return {apex: Math.min(4.5, 1.2 + distM*0.11), v: 24};
      case 'CUTBACK':  return {apex: 0,                      v: 24};
      case 'CLEAR':    return {apex: Math.min(11, 3 + distM*0.18), v: 26};
      case 'SHOT':     return {apex: Math.min(1.6, 0.2 + distM*0.035), v: 34};
      case 'GKDIST':   return {apex: Math.min(9, 2 + distM*0.15), v: 24};
      default:         return {apex: 0.3, v: 24};
    }
  },

  launch(fromX, fromY, toX, toY, kind, simReconcile){
    const b = this.ball;
    const dist = Math.hypot(toX - fromX, toY - fromY);
    const pr = this.flightProfile(kind, dist);
    b.state = 'FLIGHT'; b.fx = fromX; b.fy = fromY; b.tx = toX; b.ty = toY;
    b.x = fromX; b.y = fromY; b.apex = pr.apex; b.holder = null;
    b.p0 = this.P; b.p1 = this.P + Math.min(1.0, Math.max(0.22, dist / pr.v));
    this.holdS = simReconcile;                    // sim clock waits here until the ball lands
  },

  stepBall(dt, spd){
    const b = this.ball;
    if(b.state === 'FLIGHT'){
      const al = Math.min(1, (this.P - b.p0) / Math.max(0.001, b.p1 - b.p0));
      b.x = b.fx + (b.tx - b.fx) * al; b.y = b.fy + (b.ty - b.fy) * al;
      b.z = b.apex * 4 * al * (1 - al);
      if(al >= 1){
        b.z = 0;
        this.holdS = null;
        // bounce/roll reconstruction if the sim gives us quiet room (Part O)
        b.state = b.apex > 2 ? 'BOUNCE' : 'LOOSE'; b.bv = b.apex * 0.35; b.bt = 0;
      }
    } else if(b.state === 'BOUNCE'){
      b.bt += dt * spd;
      b.z = Math.max(0, b.bv * 4 * (b.bt/0.4) * (1 - b.bt/0.4));
      if(b.bt >= 0.4){ b.bv *= 0.42; b.bt = 0; if(b.bv < 0.25){ b.z = 0; b.state = 'LOOSE'; } }
      const A = this.authBall(this.S);
      if(A){ b.x += (A.x - b.x) * Math.min(1, dt*4); b.y += (A.y - b.y) * Math.min(1, dt*4); }
    } else if(b.holder && this.players[b.holder] && this.players[b.holder].active){
      // CONTROLLED with repeated-touch model (Part R): the ball is knocked ahead each
      // stride and the carrier catches up to it — never glued.
      const p = this.players[b.holder];
      const v = Math.hypot(p.vx, p.vy);
      const lead = v > 6 ? 1.5 : v > 4 ? 0.95 : v > 1.2 ? 0.55 : 0.3;
      const knock = 1 + 0.5 * Math.sin(p.gait * 0.9);                  // deterministic touch rhythm
      const tx = p.x + Math.cos(p.face) * lead * knock;
      const ty = p.y + Math.sin(p.face) * lead * knock;
      b.x += (tx - b.x) * Math.min(1, dt * 10); b.y += (ty - b.y) * Math.min(1, dt * 10);
      b.z = 0;
    } else {
      const A = this.authBall(this.S);
      if(A){
        const d = Math.hypot(A.x - b.x, A.y - b.y);
        if(d > 30){ b.x = A.x; b.y = A.y; }
        else { b.x += (A.x - b.x) * Math.min(1, dt * 5); b.y += (A.y - b.y) * Math.min(1, dt * 5); }
      }
      b.z = 0;
    }
  },

  pidByName(name){
    const players = S.match && S.match.snap ? S.match.snap.players : null;
    if(!players || !name) return null;
    for(const [pid, p] of Object.entries(players)) if(p.name === name) return pid;
    return null;
  },

  applyEvent(e){
    const d = e.detail || {};
    const actor = this.players[e.actor_id];
    const bx = k => this.wx(k[0]), by = k => this.wy(k[1]);
    switch(e.event_type){
      case 'PASS': {
        if(!d.actual_target || !actor) break;
        const tx = bx(d.actual_target), ty = by(d.actual_target);
        const pt = d.pass_type, dist = d.distance_m || Math.hypot(tx-actor.x, ty-actor.y);
        const kind = pt === 'CROSS' ? 'CROSS' : pt === 'CUTBACK' ? 'CUTBACK'
                   : pt === 'THROUGH' ? 'THROUGH'
                   : (pt === 'LONG' || pt === 'AERIAL_LONG') ? (dist > 22 ? 'LOFTED' : 'DRIVEN')
                   : pt === 'PROGRESSIVE' ? (dist > 26 ? 'DRIVEN' : 'GROUND') : 'GROUND';
        this.setPose(e.actor_id, A2.PASS, 0.42, tx, ty);
        this.launch(actor.x, actor.y, tx, ty, kind, e.timestamp + 1.0);
        const rec = d.target_id;
        if(rec && (d.outcome === 'COMPLETED' || d.outcome === 'AERIAL_COMPLETED')) this._pendingRecv = {pid: rec, at: this.ball.p1};
        break;
      }
      case 'CROSS': {
        if(!actor) break;
        const L = d.landing || d.actual_target; if(!L) break;
        this.setPose(e.actor_id, A2.PASS, 0.5, bx(L), by(L));
        this.launch(actor.x, actor.y, bx(L), by(L), 'CROSS', e.timestamp + 1.2);
        break;
      }
      case 'CLEARANCE': {
        if(!actor) break;
        const gx = actor.team === 'HOME' ? this.wx(85) : this.wx(15);
        this.setPose(e.actor_id, A2.SHOT, 0.4, gx, actor.y);
        this.launch(actor.x, actor.y, actor.x + Math.cos(actor.face)*26, actor.y + Math.sin(actor.face)*10, 'CLEAR', e.timestamp + 1.2);
        break;
      }
      case 'SHOT': {
        if(!actor) break;
        const home = (S.match.snap.players[e.actor_id]||{}).team === 'HOME';
        const gx = this.flip() ? (home ? 0 : 105) : (home ? 105 : 0);
        const gy = 34;
        let tx = gx, ty = gy, kind = 'SHOT';
        if(d.outcome === 'MISS'){ ty = gy + (a2hash(String(e.event_id)) % 2 ? 5.3 : -5.3); }
        if(d.outcome === 'BLOCKED'){ tx = actor.x + (gx - actor.x)*0.25; ty = actor.y + (gy - actor.y)*0.25; }
        if(d.shot_type === 'HEADER') kind = 'DRIVEN';
        this.setPose(e.actor_id, A2.SHOT, 0.5, gx, gy);
        this.launch(actor.x, actor.y, tx, ty, kind, e.timestamp + 1.0);
        // GK reaction — pose only, side from shot geometry (deterministic)
        const gk = Object.entries(S.match.snap.players).find(([pid, p]) => p.team !== (home?'HOME':'AWAY') && p.slot === 'GK');
        if(gk && ['SAVED_PARRIED','SAVED_CAUGHT','MISS','GOAL'].includes(d.outcome))
          this.setPose(gk[0], d.outcome === 'SAVED_CAUGHT' ? A2.RECEIVE : A2.GKDIVE, 0.8, tx, ty);
        break;
      }
      case 'DRIBBLE': {
        if(!actor) break;
        const dpid = this.pidByName(d.defender);
        this.setPose(e.actor_id, A2.TAKEON, 0.7, actor.x + Math.cos(actor.face)*6, actor.y + Math.sin(actor.face)*6);
        if(dpid){
          if(d.outcome === 'BEAT') this.setPose(dpid, A2.RECOVERY, 1.1, actor.x, actor.y);
          else if(d.outcome === 'TACKLED'){ this.setPose(dpid, A2.TACKLE, 0.7, actor.x, actor.y); this.ball.holder = dpid; }
          else this.setPose(dpid, A2.TACKLE, 0.5, actor.x, actor.y);
        }
        break;
      }
      case 'TACKLE': {
        this.setPose(e.actor_id, A2.TACKLE, 0.7, this.ball.x, this.ball.y);
        break;
      }
      case 'GROUND_DUEL': case 'SHIELD': {
        this.setPose(e.actor_id, A2.SHIELD, 0.8, this.ball.x, this.ball.y);
        break;
      }
      case 'CARRY': {
        this.ball.holder = e.actor_id;
        if(actor && this.ball.state !== 'FLIGHT'){
          const dpid = null;
          this.setPose(e.actor_id, A2.DRIBBLE, 0.4,
                       d.to ? bx(d.to) : actor.x + Math.cos(actor.face)*4,
                       d.to ? by(d.to) : actor.y + Math.sin(actor.face)*4);
        }
        break;
      }
      case 'GOAL_KICK': {
        if(actor) this.launch(actor.x, actor.y, this.wx(55), actor.y, 'GKDIST', e.timestamp + 1.4);
        break;
      }
      case 'POSSESSION_CHANGE': this.ball.holder = null; break;
      case 'GOAL': break;
    }
    // reception pose when a completed pass lands
    if(this._pendingRecv && this.P >= this._pendingRecv.at - 0.05){ /* handled in draw loop tick below */ }
  },

  /* ── camera (Part S): never affects simulation ── */
  stepCam(dt){
    const c = this.cam, cv = this.canvas;
    if(!cv) return;
    const W = cv.width / (window.devicePixelRatio || 1), H = cv.height / (window.devicePixelRatio || 1);
    if(c.mode === 'tactical'){
      c.scale += (Math.max(0.4, (W - 8) / 105) - c.scale) * Math.min(1, dt*4);
      c.scale = Math.max(0.4, c.scale);
      c.x += (52.5 - c.x) * Math.min(1, dt*4); c.y += (34 - c.y) * Math.min(1, dt*4);
      return;
    }
    const targetScale = Math.max(0.6, (W - 8) / 44);          // gameplay: ~44 m visible width (guarded vs collapsed container)
    c.scale += (targetScale - c.scale) * Math.min(1, dt*2.5);
    c.scale = Math.max(0.6, c.scale);
    const b = this.ball;
    let tx = b.x + b.vx * 0 + (b.state === 'FLIGHT' ? (b.tx - b.x) * 0.45 : 0);
    let ty = b.y + (b.state === 'FLIGHT' ? (b.ty - b.y) * 0.45 : 0);
    const viewW = W / c.scale, viewH = H / c.scale;
    tx = Math.max(viewW/2 - 3, Math.min(105 - viewW/2 + 3, tx));
    ty = Math.max(viewH/2 - 2, Math.min(68 - viewH/2 + 2, ty));
    const k1 = 6.5, k2 = 4.4;                                 // spring-damper
    c.vx += ((tx - c.x) * k1 - c.vx * k2) * dt; c.vy += ((ty - c.y) * k1 - c.vy * k2) * dt;
    c.x += c.vx * dt; c.y += c.vy * dt;
  },
  toScr(x, y){
    const cv = this.canvas, W = cv.width/(window.devicePixelRatio||1), H = cv.height/(window.devicePixelRatio||1);
    return [ (x - this.cam.x) * this.cam.scale + W/2, (y - this.cam.y) * this.cam.scale + H/2 ];
  },

  /* ── drawing ── */
  drawPitch(c){
    const sc = this.cam.scale;
    const [x0, y0] = this.toScr(0, 0), [x1, y1] = this.toScr(105, 68);
    c.fillStyle = '#256b3a'; c.fillRect(0, 0, this.canvas.width, this.canvas.height);
    // mown stripes
    for(let i = 0; i < 12; i++){
      c.fillStyle = i % 2 ? '#2b7a43' : '#256b3a';
      const [sx] = this.toScr(i * 105/12, 0);
      const [sx2] = this.toScr((i+1) * 105/12, 0);
      c.fillRect(sx, y0, sx2 - sx, y1 - y0);
    }
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = Math.max(1, sc * 0.12);
    const R = (x, y, w, h) => { const [a,b] = this.toScr(x,y); c.strokeRect(a, b, w*sc, h*sc); };
    R(0, 0, 105, 68);
    c.beginPath(); const [mx0,my0] = this.toScr(52.5, 0), [mx1,my1] = this.toScr(52.5, 68);
    c.moveTo(mx0,my0); c.lineTo(mx1,my1); c.stroke();
    const [ccx, ccy] = this.toScr(52.5, 34);
    c.beginPath(); c.arc(ccx, ccy, 9.15*sc, 0, Math.PI*2); c.stroke();
    R(0, 13.85, 16.5, 40.3); R(105-16.5, 13.85, 16.5, 40.3);
    R(0, 24.85, 5.5, 18.3);  R(105-5.5, 24.85, 5.5, 18.3);
    for(const gx of [11, 94]){ const [px, py] = this.toScr(gx, 34); c.beginPath(); c.arc(px, py, Math.max(1.2, sc*0.16), 0, Math.PI*2); c.fillStyle='rgba(255,255,255,.75)'; c.fill(); }
    c.beginPath(); const [a1x,a1y]=this.toScr(16.5,34); c.arc(a1x - 16.5*sc + 11*sc, a1y, 9.15*sc, -0.93, 0.93); c.stroke();
    c.beginPath(); const [a2x,a2y]=this.toScr(105-16.5,34); c.arc(a2x + 16.5*sc - 11*sc, a2y, 9.15*sc, Math.PI-0.93, Math.PI+0.93); c.stroke();
    // goals
    c.fillStyle = 'rgba(255,255,255,.55)';
    for(const [gx, dxs] of [[0,-1],[105,1]]){
      const [px, py] = this.toScr(gx, 34 - 3.66);
      c.fillRect(px + (dxs<0 ? -sc*1.6 : 0), py, sc*1.6, 7.32*sc);
    }
  },

  drawPlayer(c, p, pid){
    const sc = this.cam.scale;
    const [px, py] = this.toScr(p.x, p.y);
    const cv = this.canvas;
    if(px < -40 || py < -40 || px > cv.width + 40 || py > cv.height + 40) return;
    const isLiv = p.team === livTeamId();
    const shirt = isLiv ? '#d33c47' : '#5b84d6';
    const shirt2 = isLiv ? '#a92835' : '#3f66b5';
    const shorts = isLiv ? '#7c1420' : '#233a63';
    const skin = '#e8b98a', hair = ['#2b2019','#4a331f','#151210','#6b4f2c','#83552e'][a2hash(pid) % 5];
    const h = sc * 1.9;                                      // ~1.9 m tall, upright 3/4 view
    const v = Math.hypot(p.vx, p.vy);
    const ph = p.gait;
    const stride = p.pose === A2.SPRINT ? 1 : p.pose === A2.RUN ? 0.75 : p.pose === A2.JOG ? 0.5 : 0.1;
    const mirror = Math.cos(p.face) < 0 ? -1 : 1;            // face left/right on screen
    const inPose = p.poseT < p.poseDur;
    const pp = inPose ? p.poseT / p.poseDur : 0;
    // limb swing (screen-space run cycle)
    let legF = Math.sin(ph) * stride, legB = -Math.sin(ph) * stride;
    let armF = -Math.sin(ph) * stride * 0.8, armB = Math.sin(ph) * stride * 0.8;
    let lean = Math.min(0.22, v * 0.024) * mirror, rise = Math.abs(Math.sin(ph)) * stride * h * 0.03;
    let bodyRot = 0;
    if(inPose){
      if(p.pose === A2.PASS || p.pose === A2.SHOT){
        const power = p.pose === A2.SHOT ? 1.35 : 1.0;
        const sw = pp < 0.4 ? -(pp/0.4) : ((pp-0.4)/0.6 * 2 - 1);   // backswing → strike → follow-through
        legF = sw * power; legB = -0.25; armF = -sw*0.7; armB = sw*0.7; lean = 0.12*mirror;
      } else if(p.pose === A2.TACKLE){ bodyRot = 0.9 * mirror; legF = 1.2; legB = 0.9; rise = -h*0.1; }
      else if(p.pose === A2.RECOVERY){ lean = -0.3 * mirror; legF *= 0.4; legB *= 0.4; }
      else if(p.pose === A2.TAKEON){ lean = 0.32 * mirror; }
      else if(p.pose === A2.GKDIVE){ bodyRot = ((p.poseTy || 34) < p.y ? -1.15 : 1.15); armF = -1.6; armB = -1.4; rise = h*0.05; }
      else if(p.pose === A2.RECEIVE){ legF = 0.7; legB = 0; armF = armB = -0.4; }
      else if(p.pose === A2.SHIELD){ armF = 1.1; armB = -1.1; lean = -0.14*mirror; }
    }
    c.save();
    // shadow at the feet
    c.fillStyle = 'rgba(0,0,0,.28)';
    c.beginPath(); c.ellipse(px, py + h*0.02, h*0.20, h*0.07, 0, 0, Math.PI*2); c.fill();
    c.translate(px, py - rise);
    c.scale(mirror, 1);
    c.rotate(bodyRot + lean * 0.5);
    const lw = Math.max(1.4, h*0.085);
    c.lineCap = 'round';
    const hipY = -h*0.34;
    // back arm (behind torso)
    c.strokeStyle = skin; c.lineWidth = lw*0.7;
    c.beginPath(); c.moveTo(-h*0.02, -h*0.52);
    c.lineTo(-h*0.02 + Math.sin(armB)*h*0.16 - h*0.06, -h*0.52 + Math.abs(Math.cos(armB))*h*0.17); c.stroke();
    // legs: white socks + dark boots, scissor stride
    for(const [ang, back] of [[legB, true], [legF, false]]){
      const fx = Math.sin(ang) * h * 0.17 + (back ? -h*0.02 : h*0.03);
      const fy = hipY + h*0.34 - Math.max(0, -Math.cos(ang)+0.55) * h * 0.06;
      c.strokeStyle = back ? '#d8d8d8' : '#ffffff';
      c.lineWidth = lw;
      c.beginPath(); c.moveTo(back ? -h*0.05 : h*0.05, hipY + h*0.05); c.lineTo(fx, fy - h*0.02); c.stroke();
      c.fillStyle = '#191919';
      c.beginPath(); c.ellipse(fx + h*0.025, fy, lw*0.62, lw*0.4, 0, 0, Math.PI*2); c.fill();
    }
    // shorts
    c.fillStyle = shorts;
    c.beginPath(); c.roundRect(-h*0.14, hipY - h*0.04, h*0.28, h*0.15, lw*0.4); c.fill();
    // torso shirt with sleeve band
    c.fillStyle = shirt;
    c.beginPath(); c.roundRect(-h*0.15, -h*0.62, h*0.30, h*0.26, lw*0.55); c.fill();
    c.fillStyle = shirt2; c.fillRect(-h*0.15, -h*0.42, h*0.30, h*0.045);
    // front arm
    c.strokeStyle = skin; c.lineWidth = lw*0.7;
    c.beginPath(); c.moveTo(h*0.10, -h*0.54);
    c.lineTo(h*0.10 + Math.sin(armF)*h*0.17 + h*0.05, -h*0.54 + Math.abs(Math.cos(armF))*h*0.18); c.stroke();
    // head + hair (slight forward offset shows facing)
    c.fillStyle = skin; c.beginPath(); c.arc(h*0.03, -h*0.73, h*0.115, 0, Math.PI*2); c.fill();
    c.fillStyle = hair;
    c.beginPath(); c.arc(h*0.015, -h*0.75, h*0.115, Math.PI*0.95, Math.PI*2.05); c.fill();
    c.restore();
    if(this.cam.scale > 9){
      c.fillStyle = 'rgba(255,255,255,.72)';
      c.font = `${Math.max(8, Math.round(sc*0.5))}px system-ui`;
      c.textAlign = 'center';
      c.fillText(shortName(p.name), px, py + h*0.24);
    }
  },

  drawBall(c){
    const b = this.ball, sc = this.cam.scale;
