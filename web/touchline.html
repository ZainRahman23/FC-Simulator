      if(dist < 0.12) s2 = 0;
      const ux = dist ? dx/dist : 0, uy = dist ? dy/dist : 0;
      p.vx += (ux*s2 - p.vx) * Math.min(1, dt*8); p.vy += (uy*s2 - p.vy) * Math.min(1, dt*8);
      p.x += p.vx * rdt; p.y += p.vy * rdt;
      const v = Math.hypot(p.vx, p.vy);
      let want = p.face;
      if(p.poseT < p.poseDur && (p.poseTx || p.poseTy)) want = Math.atan2(p.poseTy - p.y, p.poseTx - p.x);
      else if(v > 0.6) want = Math.atan2(p.vy, p.vx);
      else want = Math.atan2(this.ball.y - p.y, this.ball.x - p.x);
      let dfc = ((want - p.face + Math.PI*3) % (Math.PI*2)) - Math.PI;
      const mt = 9 * dt * Math.max(0.5, Math.min(1, v/3 + 0.5));
      p.face += Math.abs(dfc) > mt ? Math.sign(dfc) * mt : dfc;
      p.pose = p.poseT < p.poseDur ? p.pose : v > 6.2 ? A2.SPRINT : v > 4.0 ? A2.RUN : v > 1.1 ? A2.JOG : A2.IDLE;
      p.poseT += dt;
      p.gait += v * dt * 1.35;
    }
    this._resync = false;
    // ── ball: exclusively segment-choreographed ──
    this.stepBall(dt, rdt);
    this.stepCam(dt);
  },

  setPose(pid, pose, dur, tx, ty){
    const p = this.players[pid]; if(!p) return;
    p.pose = pose; p.poseT = 0; p.poseDur = dur; p.poseTx = tx || 0; p.poseTy = ty || 0;
  },
  pidByName(name){
    const players = S.match && S.match.snap ? S.match.snap.players : null;
    if(!players || !name) return null;
    for(const [pid, p] of Object.entries(players)) if(p.name === name) return pid;
    return null;
  },

  enterSeg(sg){
    const b = this.ball;
    switch(sg.kind){
      case 'strike': {
        b.holder = sg.actor; b.state = 'CTRL';
        this.setPose(sg.actor, sg.shot ? A2.SHOT : A2.PASS, Math.max(0.3, sg.dur + 0.25), sg.aim.x, sg.aim.y);
        // pull the striker onto the presentation ball (continuity by construction)
        const p = this.players[sg.actor];
        if(p && Math.hypot(p.x - b.x, p.y - b.y) > 2.2){ p.x = b.x + (p.x-b.x)*0.2; p.y = b.y + (p.y-b.y)*0.2; }
        break;
      }
      case 'flight': {
        b.state = 'FLIGHT'; b.fx = b.x; b.fy = b.y; b.tx = sg.to.x; b.ty = sg.to.y; b.apex = sg.apex; b.holder = null;
        if(sg.gk && sg.shot && ['SAVED_PARRIED','SAVED_CAUGHT','MISS','GOAL'].includes(sg.outcome))
          this.setPose(sg.gk, sg.outcome === 'SAVED_CAUGHT' ? A2.RECEIVE : A2.GKDIVE, Math.max(0.8, sg.dur+0.3), sg.to.x, sg.to.y);
        break;
      }
      case 'settle': {
        if(sg.actor){
          b.holder = sg.actor; b.state = 'CTRL';
          this.setPose(sg.actor, A2.RECEIVE, Math.max(0.3, sg.dur), b.x, b.y);
        }
        break;
      }
      case 'carry': {
        b.holder = sg.actor; b.state = 'CTRL';
        const p = this.players[sg.actor];
        if(p && this.players[sg.actor].pose !== A2.SPRINT) this.setPose(sg.actor, A2.DRIBBLE, sg.dur, sg.to.x, sg.to.y);
        break;
      }
      case 'duel': {
        b.state = 'LOOSE_SLOW'; b.holder = null;
        if(sg.takeOn){
          this.setPose(sg.actor, A2.TAKEON, Math.max(0.6, sg.dur), this.ball.x, this.ball.y);
          const dp = this.pidByName(sg.dfd);
          if(dp) this.setPose(dp, sg.outcome === 'BEAT' ? A2.RECOVERY : A2.TACKLE, Math.max(0.6, sg.dur), this.ball.x, this.ball.y);
          if(sg.outcome === 'TACKLED' && dp) b.holder = dp;
          else if(sg.outcome === 'BEAT') b.holder = sg.actor;
        } else {
          this.setPose(sg.actor, sg.tackle ? A2.TACKLE : A2.SHIELD, Math.max(0.4, sg.dur), this.ball.x, this.ball.y);
        }
        break;
      }
      case 'pickup': {
        b.holder = sg.actor; b.state = 'CTRL';
        this.setPose(sg.actor, A2.RECEIVE, Math.max(0.25, sg.dur), b.x, b.y);
        break;
      }
      case 'goalhold': { b.state = 'NET'; this.commitGoal(sg.e); break; }
      case 'reset': { b.state = 'RESETTING'; b.holder = null; b.resetTo = this.authBallW(sg.s1) || {x:52.5,y:34}; break; }
      case 'scramble': { b.state = 'LOOSE_SLOW'; b.holder = null; break; }
      case 'mark': { this.commitMark(sg.e); break; }
      case 'link': break;
    }
    if(sg.e && sg.kind !== 'mark' && !sg._fed){ sg._fed = true; this.commitFeed(sg.e); }
  },
  exitSeg(sg){
    const b = this.ball;
    if(sg.kind === 'flight'){ b.x = sg.to.x; b.y = sg.to.y; b.z = 0; b.state = 'CTRL'; }
    if(sg.kind === 'reset'){ if(b.resetTo){ b.x = b.resetTo.x; b.y = b.resetTo.y; } b.state = 'CTRL'; b.holder = null; }
  },

  stepBall(dt, rdt){
    const b = this.ball;
    const sg = this.seg();
    if(b.state === 'FLIGHT' && sg && sg.kind === 'flight'){
      const al = Math.min(1, sg.dur > 0 ? this.segT / sg.dur : 1);
      b.x = b.fx + (b.tx - b.fx) * al; b.y = b.fy + (b.ty - b.fy) * al;
      b.z = (b.apex || 0) * 4 * al * (1 - al);
    } else if(b.state === 'NET'){
      /* hold in the net */
    } else if(b.state === 'RESETTING' && b.resetTo){
      const d = Math.hypot(b.resetTo.x - b.x, b.resetTo.y - b.y);
      const v = Math.min(26, Math.max(8, d / Math.max(0.2, (sg ? sg.dur - this.segT : 0.4))));
      if(d > 0.2){ b.x += (b.resetTo.x - b.x)/d * v * rdt; b.y += (b.resetTo.y - b.y)/d * v * rdt; }
      b.z = 0;
    } else if(b.holder && this.players[b.holder] && this.players[b.holder].active){
      const p = this.players[b.holder];
      const v = Math.hypot(p.vx, p.vy);
      const lead = v > 6 ? 1.4 : v > 4 ? 0.9 : v > 1.2 ? 0.5 : 0.28;
      const knock = 1 + 0.5 * Math.sin(p.gait * 0.9);
      const tx = p.x + Math.cos(p.face) * lead * knock, ty = p.y + Math.sin(p.face) * lead * knock;
      const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
      if(d < 2.2){ b.x += dx * Math.min(1, dt * 9); b.y += dy * Math.min(1, dt * 9); }
      else {
        // holder not at the ball yet: the ball ROLLS to him at a visible speed
        // (never proportional easing - that is how teleports are born)
        const vv = Math.min(26, 6 + d * 1.5);
        b.x += dx/d * vv * rdt; b.y += dy/d * vv * rdt;
      }
      b.z = 0;
    } else {
      // loose/scramble: follow the authoritative track at bounded visible speed
      const A = this.authBallW(this.simPos());
      if(A){
        const dx = A.x - b.x, dy = A.y - b.y, d = Math.hypot(dx, dy);
        const vv = Math.min(24, 5 + d * 1.4);
        if(d > 0.15){ b.x += dx/d * vv * rdt; b.y += dy/d * vv * rdt; }
      }
      b.z = Math.max(0, b.z - dt * 6);
    }
  },

  /* ── presentation-synchronized UI commits ─────────────────────────── */
  commitFeed(e){
    const m = S.match; if(!m) return;
    m.events.push(e);
    const line = presentEvent(e);
    if(line){ m.feed.push(line); if(typeof updateFeedList === 'function') updateFeedList(m); }
  },
  commitMark(e){
    this.commitFeed(e);
  },
  commitGoal(shotEvent){
    const m = S.match; if(!m) return;
    const names = m.snap.players || {};
    const home = (names[shotEvent.actor_id]||{}).team === 'HOME';
    if(home) this.score.home++; else this.score.away++;
    if(typeof updateMatchHeader === 'function') updateMatchHeader(m);
  },
  presentedView(m){
    const sp = this.simPos();
    let hist = null;
    for(let i = this.statsHist.length - 1; i >= 0; i--)
      if(this.statsHist[i].clock <= sp + 0.5){ hist = this.statsHist[i]; break; }
    const snap = Object.assign({}, m.snap);
    if(hist){
      if(hist.team_stats) snap.team_stats = hist.team_stats;
      if(hist.possession) snap.possession = hist.possession;
      if(hist.half) snap.half = hist.half;
    }
    return Object.assign({}, m, {snap, clock: Math.floor(sp / 60), score: [this.score.home, this.score.away]});
  },

  /* ── broadcast camera: tactical readability first ─────────────────── */
  stepCam(dt){
    const c = this.cam, cv = this.canvas;
    if(!cv) return;
    const W = cv.width/(window.devicePixelRatio||1), H = cv.height/(window.devicePixelRatio||1);
    if(W < 60 || H < 40) return;
    if(c.mode === 'tactical'){
      c.scale += (Math.max(0.4, (W - 8)/105) - c.scale) * Math.min(1, dt*4);
      c.scale = Math.max(0.4, c.scale);
      c.x += (52.5 - c.x) * Math.min(1, dt*4); c.y += (34 - c.y) * Math.min(1, dt*4);
      return;
    }
    // broadcast: ~78 m of pitch visible; never crop more than that
    const targetScale = Math.max(0.6, (W - 8) / 78);
    c.scale += (targetScale - c.scale) * Math.min(1, dt*2);
    c.scale = Math.max(0.6, c.scale);
    const b = this.ball;
    const sg = this.seg();
    let tx = b.x, ty = b.y;
    if(sg && sg.kind === 'flight'){ tx = b.x + (sg.to.x - b.x)*0.5; ty = b.y + (sg.to.y - b.y)*0.5; }
    const viewW = W / c.scale, viewH = H / c.scale;
    tx = Math.max(viewW/2 - 4, Math.min(105 - viewW/2 + 4, tx));
    ty = Math.max(viewH/2 - 3, Math.min(68 - viewH/2 + 3, ty));
    const k1 = 3.4, k2 = 3.4;                                  // slower, calmer than anim2
    c.vx += ((tx - c.x) * k1 - c.vx * k2) * dt; c.vy += ((ty - c.y) * k1 - c.vy * k2) * dt;
    c.x += c.vx * dt; c.y += c.vy * dt;
  },

  ensureCanvas(){
    const pitch = $('#livePitch'); if(!pitch) return;
    if(this.canvas && pitch.contains(this.canvas)) return;
    this.canvas = document.createElement('canvas');
    this.canvas.className = 'animcanvas anim2 anim3';
    pitch.appendChild(this.canvas);
    this.ctx = this.canvas.getContext('2d');
    this.dbg.on = DEBUG_MODE;
    const q = new URLSearchParams(location.search);
    if(q.get('cam') === 'tactical') this.cam.mode = 'tactical';
    const ql = q.get('len');
    if(ql && ANIM3_PROFILE[ql] !== undefined) this.profile = ql;
    if(this.dbg.on && !this.dbg.panel){
      const d = document.createElement('div');
      d.className = 'animdbg';
      d.innerHTML = `<div id="a3status" style="white-space:pre"></div>
        <label><input type="checkbox" id="a3cam" checked> broadcast cam</label>
        <label>len <select id="a3len"><option>quick</option><option selected>standard</option><option>extended</option></select></label>`;
      pitch.appendChild(d);
      d.querySelector('#a3cam').addEventListener('change', ev => { this.cam.mode = ev.target.checked ? 'broadcast' : 'tactical'; });
      d.querySelector('#a3len').addEventListener('change', ev => { this.profile = ev.target.value; });
      this.dbg.panel = d;
    }
  },

  draw(){
    const cv = this.canvas; if(!cv || !this.ctx) return;
    const pr = window.devicePixelRatio || 1;
    const box = cv.parentElement.getBoundingClientRect();
    if(box.width < 60 || box.height < 40) return;
    if(cv.width !== Math.round(box.width*pr) || cv.height !== Math.round(box.height*pr)){
      cv.width = Math.round(box.width*pr); cv.height = Math.round(box.height*pr);
      cv.style.width = box.width+'px'; cv.style.height = box.height+'px';
    }
    const c = this.ctx;
    c.setTransform(pr, 0, 0, pr, 0, 0);
    AnimR2.drawPitch.call(this, c);
    const entries = Object.entries(this.players).filter(([,p]) => p.active !== 0 && p.team);
    entries.sort((a, b) => a[1].y - b[1].y);
    let ballDrawn = false;
    for(const [pid, p] of entries){
      if(!ballDrawn && this.ball.z <= 0.1 && p.y > this.ball.y){ AnimR2.drawBall.call(this, c); ballDrawn = true; }
      AnimR2.drawPlayer.call(this, c, p, pid);
    }
    if(!ballDrawn) AnimR2.drawBall.call(this, c);
    if(this.dbg.on && this.dbg.panel){
      const el = this.dbg.panel.querySelector('#a3status');
      const sg = this.seg();
      if(el) el.textContent =
        `sim ${Math.floor(this.simPos()/60)}:${String(Math.floor(this.simPos()%60)).padStart(2,'0')}  pres ${this.pTotal.toFixed(0)}s (${this.profile})` +
        `\nseg ${sg ? sg.kind : '-'} ${this.segIdx}/${this.segs.length}  buf ${this.remaining().toFixed(0)}s` +
        `\nfps ${this.fps.value}  cam ${this.cam.mode} ${( (this.canvas.width/(window.devicePixelRatio||1))/this.cam.scale).toFixed(0)}m`;
    }
  },

  loop(ts){
    requestAnimationFrame((t) => this.loop(t));          // re-arm first: a draw error must never kill playback
    if(ANIM3_ON && S.match && S.ui.view === 'match' && this.canvas){
      const t0 = performance.now();
      const dt = this.lastTs ? Math.min(0.1, (ts - this.lastTs)/1000) : 0.016;
      this.step(dt);
      this.draw();
      const el = performance.now() - t0;
      this.frameMs.sum += el; this.frameMs.n++; this.frameMs.max = Math.max(this.frameMs.max, el);
      this.fps.frames++;
      if(ts - this.fps.t0 > 1000){ this.fps.value = this.fps.frames; this.fps.frames = 0; this.fps.t0 = ts; }
    }
    this.lastTs = ts;
  },
};
if(typeof window !== 'undefined' && typeof ANIM3_ON !== 'undefined' && ANIM3_ON) requestAnimationFrame((t) => AnimR3.loop(t));

/* ═══════════ RENDERER MILESTONE 4 — PHYSICAL BALL (?renderer=anim4) ═══════════
   ADAPT milestone authorized from SWOS_PHYSICS_MOVEMENT_REFERENCE_STUDY.md.
   Keeps AnimR3's authoritative-alignment segment compiler, importance timing,
   presentation-synced feed/score, goal/restart choreography, poses and cameras.
   REPLACES the ball-as-interpolation-token with a continuous physical ball:

     THE BALL IS NEVER PLACED. It carries x,y,z + vx,vy,vz and moves ONLY by
     integration (gravity, linear ground/air friction, restitution bounce,
     roll) and by kick/touch IMPULSES compiled from authoritative events.
     The single exception: authoritative restarts (kickoff/FK/corner/throw/
     goal-kick spots), where placement IS the football event.

   Physical model behaviorally referenced from OpenSWOS (MIT, (c) 2026 Grzegorz
   Korycki, github.com/angree/openswos — Sim/BallState.cs): continuous z with
   per-tick gravity, LINEAR speed decay (ground/air), once-per-impact bounce
   with restitution + sticky-settle threshold, possession as a radius test with
   kicker exclusion, dribble touches ahead of the carrier. Constants below are
   Touchline-native (metric, 60 Hz) — no SWOS assets, no unlicensed material.
   Deterministic: no Math.random; all physics is a pure function of ingested
   authoritative data and the presentation clock. PRESENTATION ONLY. */
const ANIM4_PROFILE = {quick: 0.72, standard: 1.0, extended: 1.6};
const PB = {
  G: 12.0,            // m/s^2 presentation gravity (slightly heavy: readable arcs)
  MU_ROLL: 6.0,       // linear rolling decel m/s^2 (OpenSWOS-style linear decay)
  MU_AIR: 1.0,        // airborne horizontal decay
  REST: 0.55,         // bounce restitution (vz reflect)
  BOUNCE_KEEP: 0.78,  // horizontal speed kept per impact
  SETTLE_VZ: 1.1,     // below this reflected vz the ball settles (sticky-ball)
  CTRL_R: 1.0,        // outfield control/contact radius (m)
  CAPTURE_Z: 1.3,     // max ball height for ground capture
  EXCL_T: 0.45,       // kicker exclusion (presentation s)
};

const AnimR4 = {
  frames: [], roster: null, evAll: [], evCompiled: 0, canvas: null, ctx: null, lastTs: null,
  segs: [], segIdx: 0, segT: 0, pTotal: 0, simEnd: 0,
  players: {},
  ball: {x:55.1, y:34, z:0, vx:0, vy:0, vz:0, mode:'FREE', ctrl:null, exclPid:null, exclUntil:0,
         flight:null, touchT:0, netHold:false},
  cam: {mode:'broadcast', x:52.5, y:34, scale:12},
  statsHist: [], score: {home:0, away:0},
  profile: 'standard', dbg: {on:false, panel:null},
  fps: {frames:0, t0:0, value:0}, frameMs: {sum:0, n:0, max:0},
  totalSim: 5400, waitBall: 0,

  get head(){ return this.simPos(); },
  bufferedUntil(){ return this.frames.length ? this.frames[this.frames.length-1][0] : 0; },
  remaining(){ return Math.max(0, this.bufferedUntil() - this.simPos()); },
  reset(clock){
    this.frames = []; this.evAll = []; this.evCompiled = 0; this.segs = []; this.segIdx = 0;
    this.segT = 0; this.simEnd = clock; this.statsHist = []; this._resync = true;
    const b = this.ball; b.mode = 'FREE'; b.ctrl = null; b.flight = null; b.vx = b.vy = b.vz = 0; b.netHold = false;
  },

  flip(){ return S.matchFixture && !isLivHome(S.matchFixture); },
  wx(x){ return (this.flip() ? 100 - x : x) * 1.05; },
  wy(y){ return y * 0.68; },
  toScr(x, y){
    const cv = this.canvas, W = cv.width/(window.devicePixelRatio||1), H = cv.height/(window.devicePixelRatio||1);
    return [ (x - this.cam.x) * this.cam.scale + W/2, (y - this.cam.y) * this.cam.scale + H/2 ];
  },

  ingest(snap){
    if(!ANIM4_ON) return;
    if(snap.roster) this.roster = snap.roster;
    if(snap.frames && snap.frames.length){
      const last = this.bufferedUntil();
      for(const f of snap.frames) if(f[0] > last || !this.frames.length) this.frames.push(f);
      const keep = this.segs.length ? this.segs[Math.max(0, this.segIdx - 2)].s0 - 6 : 0;
      while(this.frames.length > 400 && this.frames[0][0] < keep) this.frames.shift();
    }
    for(const e of (snap.new_events || [])) this.evAll.push(e);
    if(snap.team_stats || snap.score)
      this.statsHist.push({clock: snap.clock_seconds, score: snap.score,
                           team_stats: snap.team_stats, possession: snap.possession, half: snap.half});
    this.compile();
  },

  frameAtSim(t){
    const F = this.frames;
    if(!F.length) return null;
    let lo = 0, hi = F.length - 1;
    while(lo < hi){ const m = (lo + hi) >> 1; if(F[m][0] < t) lo = m + 1; else hi = m; }
    const b = F[lo], a = F[Math.max(0, lo - 1)];
    const al = a[0] === b[0] ? 0 : Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0])));
    return [a, b, al];
  },
  authBallW(t){
    const fr = this.frameAtSim(t);
    if(!fr) return null;
    return {x: this.wx(fr[0][1] + (fr[1][1]-fr[0][1])*fr[2]), y: this.wy(fr[0][2] + (fr[1][2]-fr[0][2])*fr[2])};
  },
  authPosW(pid, t){
    const fr = this.frameAtSim(t);
    if(!fr || !this.roster) return null;
    const k = this.roster.indexOf(pid);
    if(k < 0) return null;
    const pa = fr[0][4][k], pb = fr[1][4][k];
    if(!pa || !pb) return null;
    return {x: this.wx(pa[0] + (pb[0]-pa[0])*fr[2]), y: this.wy(pa[1] + (pb[1]-pa[1])*fr[2]), active: pa[3]};
  },

  /* ── kick impulse solver: authoritative destination -> physical launch ──
     Ground families use OpenSWOS-style LINEAR decel (closed-form invertible);
     lofted families solve a symmetric parabola landing at the destination.
     Pure function -> deterministic. Curve/spin slots in later as a lateral
     acceleration term without touching this interface. */
  solveKick(ox, oy, dx2, dy2, fam, brisk){
    // Sensible-pace physics (study SS15/SS21): routine circulation plays ~2x real
    // ball speed UNIFORMLY - the SWOS readability model - while important balls
    // (brisk=false) stay closer to real pace. All trajectories remain physical.
    const D = Math.max(0.5, Math.hypot(dx2 - ox, dy2 - oy));
    const ux = (dx2 - ox) / D, uy = (dy2 - oy) / D;
    const q = (brisk ? 1.75 : 1.25) * ((ANIM4_PROFILE[this.profile] || 1) <= 0.75 ? 1.15 : 1);
    let v0, vz = 0, T, apex = 0;
    const MU = PB.MU_ROLL * q * q;
    const groundSolve = (v) => {
      v0 = Math.max(v, Math.sqrt(2 * MU * D) + 1.5);       // must reach the destination
      const vArr = Math.sqrt(Math.max(0, v0*v0 - 2*MU*D));
      T = (v0 - vArr) / MU;
    };
    switch(fam){
      case 'SHORT':    groundSolve((23 + Math.min(16, D*0.6)) * q); break;
      case 'DRIVEN':   groundSolve((26 + Math.min(14, D*0.45)) * q); break;
      case 'THROUGH':  groundSolve((24 + Math.min(14, D*0.5)) * q); break;
      case 'CUTBACK':  groundSolve((18 + Math.min(12, D*0.5)) * q); break;
      case 'SHOT':     groundSolve(Math.min(38, 28 + D*0.35)); vz = Math.min(2.6, 0.4 + D*0.05); break;
      case 'CROSS':    T = Math.min(1.1, Math.max(0.4, D/(30*q))); apex = 2.2; v0 = D/T; break;
      case 'LOFT':     T = Math.min(1.1, Math.max(0.45, D/(34*q))); apex = 1.8; v0 = D/T; break;
      case 'CLEAR':    T = Math.min(1.1, Math.max(0.45, D/(34*q))); apex = 3.0; v0 = D/T; break;
      case 'GKDIST':   T = Math.min(1.2, Math.max(0.5, D/(30*q))); apex = 2.2; v0 = D/T; break;
      case 'HEADER':   groundSolve(Math.min(28, 16 + D*0.5)); vz = 2.2; break;
      default:         groundSolve((20 + Math.min(16, D*0.6)) * q);
    }
    T = Math.max(0.18, T || 0.4);                       // tap passes still visibly travel
    let gEff = PB.G;
    if(apex > 0){
      // stylized per-flight gravity: the arc peaks at `apex` and completes in T
      gEff = 8 * apex / (T * T);
      vz = gEff * T / 2;
    }
    return {vx: ux*v0, vy: uy*v0, vz, T, D, MU, gEff};
  },

  famFor(e){
    const d = e.detail || {}, pt = d.pass_type, dist = d.distance_m || 12;
    if(e.event_type === 'CROSS') return 'CROSS';
    if(e.event_type === 'CLEARANCE') return 'CLEAR';
    if(e.event_type === 'GOAL_KICK') return 'GKDIST';
    if(e.event_type === 'SHOT') return d.shot_type === 'HEADER' ? 'HEADER' : 'SHOT';
    if(pt === 'CROSS') return 'CROSS';
    if(pt === 'CUTBACK') return 'CUTBACK';
    if(pt === 'THROUGH') return 'THROUGH';
    if(pt === 'LONG' || pt === 'AERIAL_LONG') return dist > 22 ? 'LOFT' : 'DRIVEN';
    if(pt === 'PROGRESSIVE') return dist > 26 ? 'DRIVEN' : 'SHORT';
    return 'SHORT';
  },

  importance(e, relx){
    const t = e.event_type, d = e.detail || {};
    if(t === 'SHOT' || t === 'CORNER' || t === 'FREE_KICK') return 1.0;
    if(t === 'CROSS') return 0.9;
    if(t === 'DRIBBLE' || t === 'TACKLE') return 0.8;
    if(t === 'PASS'){
      const pt = d.pass_type;
      if(pt === 'THROUGH' || pt === 'CUTBACK') return 0.9;
      if(pt === 'CROSS') return 0.85;
      let base = (pt === 'PROGRESSIVE' || pt === 'LONG' || pt === 'AERIAL_LONG') ? 0.55 : 0.25;
      if(relx >= 78) base = Math.max(base, 0.7);
      return base;
    }
    if(t === 'CLEARANCE') return 0.45;
    if(t === 'AERIAL_DUEL' || t === 'GROUND_DUEL' || t === 'SHIELD') return 0.35;
    if(t === 'RECOVERY') return 0.2;
    if(t === 'CARRY') return relx >= 80 ? 0.55 : 0.2;
    return 0.3;
  },
  gov(imp){
    if(imp >= 0.7) return 1.0;
    const target = 5400 / (480 * (ANIM4_PROFILE[this.profile] || 1.0));
    const cur = this.pTotal > 20 ? this.simPos() / this.pTotal : target;
    const r = target / Math.max(0.1, cur);
    return Math.min(1.35, Math.max(0.45, Math.pow(1 / r, 1.5)));
  },

  ONBALL: {PASS:1, CROSS:1, SHOT:1, CLEARANCE:1, DRIBBLE:1, TACKLE:1, GROUND_DUEL:1, AERIAL_DUEL:1,
           SHIELD:1, RECOVERY:1, CARRY:1, FREE_KICK:1, GOAL_KICK:1, THROW_IN:1, CORNER:1, KICKOFF:1,
           GK_CLAIM:1, GK_PUNCH:1, GK_HIGH_BALL_MISS:1},

  compile(){
    const g = ANIM4_PROFILE[this.profile] || 1.0;
    const horizon = this.bufferedUntil() - 2;
    const names = S.match && S.match.snap ? S.match.snap.players : {};
    while(this.evCompiled < this.evAll.length){
      const e = this.evAll[this.evCompiled];
      if(e.timestamp > horizon) break;
      this.evCompiled++;
      if(!this.ONBALL[e.event_type]){
        this.push({kind:'mark', s0:e.timestamp, s1:e.timestamp, dur:0, e});
        continue;
      }
      const d = e.detail || {};
      const t = e.timestamp;
      // ORIGIN: the authoritative ball BEFORE the event's engine second
      const bw = this.authBallW(t - 1) || this.authBallW(t) || {x: 52.5, y: 34};
      const relx = Math.max(bw.x/1.05, 100 - bw.x/1.05);
      const imp = this.importance(e, relx);
      switch(e.event_type){
        case 'PASS': case 'CROSS': case 'CLEARANCE': case 'GOAL_KICK': {
          const fam = this.famFor(e);
          let dest;
          const oc = String(d.outcome || '');
          const done_ = oc.startsWith('COMPLETED') || oc.startsWith('AERIAL_COMPLETED');
          if(e.event_type === 'CROSS' && d.landing) dest = {x: this.wx(d.landing[0]), y: this.wy(d.landing[1])};
          else if(d.actual_target && done_) dest = {x: this.wx(d.actual_target[0]), y: this.wy(d.actual_target[1])};
          else { const nb = this.authBallW(t + (fam === 'CLEAR' || fam === 'GKDIST' ? 2 : 1)); dest = nb || (d.actual_target ? {x:this.wx(d.actual_target[0]), y:this.wy(d.actual_target[1])} : bw); }
          const sol = this.solveKick(bw.x, bw.y, dest.x, dest.y, fam, imp < 0.62);
          const rec = done_ ? d.target_id : null;
          const nx = this.evAll.slice(this.evCompiled, this.evCompiled + 5)
                         .find(x => this.ONBALL[x.event_type] && x.timestamp <= t + 1.5);
          const firstTime = nx && rec && nx.actor_id === rec;
          this.push({kind:'strike', s0:t, s1:t, dur:(imp >= 0.7 ? 0.14 : 0.03)*g, actor:e.actor_id, aim:dest, e, needsBall:true});
          this.push({kind:'flight', s0:t, s1:t+1, dur:sol.T, from:bw, to:dest, fam, sol, rec, e, brisk: imp < 0.62});
          if(rec) this.push({kind:'settle', s0:t+1, s1:t+1,
                             dur:firstTime ? 0.05 : (imp >= 0.7 ? 0.34 : imp >= 0.4 ? 0.10 : 0.04)*g*this.gov(imp),
                             actor:rec, first:firstTime, needsBall:true});
          break;
        }
        case 'SHOT': {
          const home = (names[e.actor_id]||{}).team === 'HOME';
          const gx = this.flip() ? (home ? 0 : 105) : (home ? 105 : 0);
          let dest = {x: gx, y: 34}, oc = d.outcome;
          if(oc === 'MISS') dest = {x: gx, y: 34 + ((e.event_id % 2) ? 5.4 : -5.4)};
          if(oc === 'BLOCKED') dest = {x: bw.x + (gx - bw.x)*0.22, y: bw.y + (34 - bw.y)*0.22};
          const fam = d.shot_type === 'HEADER' ? 'HEADER' : 'SHOT';
          const sol = this.solveKick(bw.x, bw.y, dest.x, dest.y, fam);
          this.push({kind:'strike', s0:t, s1:t, dur:0.42, actor:e.actor_id, aim:dest, shot:true, e, needsBall:true});
          this.push({kind:'flight', s0:t, s1:t+1, dur:sol.T, from:bw, to:dest, fam, sol, e, shot:true, outcome:oc,
                     goal: oc === 'GOAL' ? {x: gx, y: 34, dir: gx > 52.5 ? 1 : -1} : null,
                     gk:(Object.entries(names).find(([pid,p]) => p.team !== (home?'HOME':'AWAY') && p.slot === 'GK')||[null])[0]});
          if(oc === 'GOAL'){
            this.push({kind:'goalhold', s0:t+1, s1:t+1, dur:2.0, e});
            const ki = this.evAll.slice(this.evCompiled).find(x => x.event_type === 'KICKOFF' || x.event_type === 'RESTART_POSSESSION' || (x.event_type === 'POSSESSION_CHANGE' && (x.detail||{}).reason === 'kickoff'));
            const rt = ki ? ki.timestamp : t + 12;
            this.push({kind:'reset', s0:t+1, s1:Math.max(t+2, rt), dur:2.6, label:'KICKOFF', place:{x:52.5, y:34}});
          } else if(oc === 'SAVED_PARRIED' || oc === 'BLOCKED'){
            this.push({kind:'scramble', s0:t+1, s1:t+2, dur:0.5*g});
          } else if(oc === 'SAVED_CAUGHT'){
            this.push({kind:'settle', s0:t+1, s1:t+1, dur:0.5, actor:null, gkCatch:true, needsBall:true});
          } else {
            this.push({kind:'settle', s0:t+1, s1:t+1, dur:0.35*g, actor:null});
          }
          break;
        }
        case 'CARRY': {
          const to = this.authBallW(Math.min(t + 1, horizon)) || bw;
          const prev = this.segs[this.segs.length-1];
          const from = prev && prev.kind === 'carry' ? prev.to : bw;
          const dist = Math.hypot(to.x - from.x, to.y - from.y);
          const k = imp >= 0.7 ? 1.0 : imp >= 0.4 ? 0.8 : 0.55;
          if(dist < 3 && imp < 0.5){ this.push({kind:'carry', s0:t-1, s1:t, dur:0.05*g, actor:e.actor_id, to, e}); break; }
          this.push({kind:'carry', s0:t-1, s1:t, dur:Math.max(0.12, dist/11)*k*Math.max(0.8, g)*this.gov(imp), actor:e.actor_id, to, e});
          break;
        }
        case 'DRIBBLE': {
          this.push({kind:'duel', s0:t-0.5, s1:t+0.5, dur:(0.7*(imp>=0.7?1:0.8))*g, actor:e.actor_id,
                     dfd:d.defender, outcome:d.outcome, takeOn:true, e, needsBall:true});
          break;
        }
        case 'TACKLE': case 'GROUND_DUEL': case 'SHIELD': case 'AERIAL_DUEL': {
          const prev = this.segs[this.segs.length-1];
          if(prev && prev.kind === 'duel' && !prev.takeOn && t - prev.s1 <= 3.2){ prev.s1 = t; break; }
          this.push({kind:'duel', s0:t-0.5, s1:t+0.5, dur:(e.event_type==='SHIELD'?0.12:0.18)*g*this.gov(0.35), actor:e.actor_id,
                     dfd:d.defender || d.carrier, tackle:e.event_type==='TACKLE', aerial:e.event_type==='AERIAL_DUEL', e});
          break;
        }
        case 'RECOVERY': {
          const nxt = this.evAll.slice(this.evCompiled, this.evCompiled + 6)
                          .find(x => this.ONBALL[x.event_type] && x.timestamp <= t + 2);
          if(nxt && nxt.actor_id === e.actor_id){ this.push({kind:'mark', s0:t, s1:t, dur:0, e}); break; }
          this.push({kind:'pickup', s0:t, s1:t, dur:0.08*g*this.gov(0.2), actor:e.actor_id, e, needsBall:true});
          break;
        }
        case 'FREE_KICK': case 'CORNER': case 'THROW_IN': case 'KICKOFF': {
          const spot = this.authBallW(t) || bw;
          this.push({kind:'reset', s0:Math.max(this.simEnd, t-4), s1:t, dur:(e.event_type==='KICKOFF'?1.6:1.2)*g,
                     label:e.event_type, place:spot});
          break;
        }
        case 'GK_CLAIM': case 'GK_PUNCH': case 'GK_HIGH_BALL_MISS': {
          this.push({kind:'duel', s0:t-0.5, s1:t+0.5, dur:0.45*g, actor:e.actor_id, aerial:true, e, needsBall:true});
          break;
        }
      }
    }
  },
  push(seg){
    const prevEnd = this.simEnd;
    seg.s0 = Math.max(seg.s0, prevEnd);
    seg.s1 = Math.max(seg.s1, seg.s0);
    if(seg.s0 - prevEnd > 0.05){
      const span = seg.s0 - prevEnd;
      this.segs.push({kind:'link', s0:prevEnd, s1:seg.s0, dur:Math.min(0.25, 0.015 + span * 0.015)});
    }
    this.segs.push(seg);
    this.simEnd = seg.s1;
  },
  seg(){ return this.segs[this.segIdx] || null; },
  simPos(){
    const sg = this.seg();
    if(!sg) return this.simEnd;
    const al = sg.dur > 0 ? Math.min(1, this.segT / sg.dur) : 1;
    return sg.s0 + (sg.s1 - sg.s0) * al;
  },

  /* ── playback ── */
  step(dt0){
    let dt = dt0;
    const m = S.match; if(!m) return;
    const spd = S.ui.matchSpeed || 1;
    const userPaused = m.status === 'paused' && !m.htActive;
    // bounded local compression: routine circulation plays at 1.35x presentation
    // rate (sanctioned "low-information periods compress more aggressively");
    // important sequences and every flight of an important ball run at 1x.
    const sgR = this.seg();
    const lowInfo = sgR && (sgR.kind === 'link' || (sgR.brisk) ||
                    (sgR.kind === 'carry' && sgR.dur <= 0.12) || sgR.kind === 'pickup');
    const rate = lowInfo ? 1.35 : 1.0;
    const rdt = userPaused ? 0 : dt * spd * rate;
    dt = dt * rate;
    let budget = rdt, guard = 0;
    while(budget > 0 && guard++ < 60){
      const sg = this.seg();
      if(!sg) break;
      // PHYSICAL ARRIVAL GATE: a segment that needs the ball cannot begin (or
      // complete for strike) while a flight is still in the air — the receiver
      // can never visually act before the ball physically arrives.
      if(this.segT === 0 && sg.needsBall && this.ball.flight){ this.waitBall += budget; break; }
      if(this.segT === 0) this.enterSeg(sg);
      const left = sg.dur - this.segT;
      if(budget < left){ this.segT += budget; budget = 0; }
      else {
        if(sg.kind === 'strike' && this.ball.flight){ this.segT = sg.dur; this.waitBall += budget; break; }
        budget -= left; this.segT = sg.dur;
        this.exitSeg(sg);
        this.segIdx++; this.segT = 0;
        if(this.segIdx > 600){ this.segs.splice(0, 400); this.segIdx -= 400; }
      }
    }
    if(!userPaused) this.pTotal += dt * spd;
    const sp = this.simPos();
    const names = m.snap && m.snap.players ? m.snap.players : {};
    const sgNow = this.seg();
    const inReset = sgNow && sgNow.kind === 'reset';
    if(this.roster) for(const pid of this.roster){
      const A = this.authPosW(pid, sp);
      if(!A) continue;
      let p = this.players[pid];
      if(!p){
        p = this.players[pid] = {x:A.x, y:A.y, vx:0, vy:0, face:0, gait:a2hash(pid)%628/100, pose:A2.IDLE,
                                 poseT:9, poseDur:0, poseTx:0, poseTy:0, team:(names[pid]||{}).team,
                                 name:(names[pid]||{}).name || pid, active:A.active};
      }
      p.active = A.active; p.team = (names[pid]||{}).team || p.team; p.name = (names[pid]||{}).name || p.name;
      if(!A.active) continue;
      if(this._resync){ p.x = A.x; p.y = A.y; p.vx = p.vy = 0; continue; }
      // physical synchronization targets: striker walks onto the ball; the
      // flight's receiver runs to MEET the ball's landing point
      let tx = A.x, ty = A.y;
      if(sgNow && sgNow.kind === 'strike' && sgNow.actor === pid && !this.ball.flight){ tx = this.ball.x; ty = this.ball.y; }
      else if(this.ball.flight && this.ball.flight.rec === pid){ tx = this.ball.flight.to.x; ty = this.ball.flight.to.y; }
      else if(this.ball.ctrl === pid && this.ball.mode === 'CTRL'){
        const bd = Math.hypot(this.ball.x - p.x, this.ball.y - p.y);
        if(bd > 1.2){ tx = this.ball.x; ty = this.ball.y; }       // chase your own touch
      }
      const dx = tx - p.x, dy = ty - p.y, dist = Math.hypot(dx, dy);
      if(dist > 35){ p.x = tx; p.y = ty; p.vx = p.vy = 0; continue; }
      const vmax = inReset ? 12 : Math.min(11, 8.6 * (dist > 9 ? 1 + (dist - 9) * 0.25 : 1));
      let s2 = Math.min(vmax, dist / 0.34);
      if(dist < 0.12) s2 = 0;
      const ux = dist ? dx/dist : 0, uy = dist ? dy/dist : 0;
      p.vx += (ux*s2 - p.vx) * Math.min(1, dt*8); p.vy += (uy*s2 - p.vy) * Math.min(1, dt*8);
      p.x += p.vx * rdt; p.y += p.vy * rdt;
      const v = Math.hypot(p.vx, p.vy);
      let want = p.face;
      if(p.poseT < p.poseDur && (p.poseTx || p.poseTy)) want = Math.atan2(p.poseTy - p.y, p.poseTx - p.x);
      else if(v > 0.6) want = Math.atan2(p.vy, p.vx);
      else want = Math.atan2(this.ball.y - p.y, this.ball.x - p.x);
      let dfc = ((want - p.face + Math.PI*3) % (Math.PI*2)) - Math.PI;
      const mt = 9 * dt * Math.max(0.5, Math.min(1, v/3 + 0.5));
      p.face += Math.abs(dfc) > mt ? Math.sign(dfc) * mt : dfc;
      p.pose = p.poseT < p.poseDur ? p.pose : v > 6.2 ? A2.SPRINT : v > 4.0 ? A2.RUN : v > 1.1 ? A2.JOG : A2.IDLE;
      p.poseT += dt;
      p.gait += v * dt * 1.35;
    }
    this._resync = false;
    this.stepBall(dt, rdt);
    this.stepCam(dt);
  },

  setPose(pid, pose, dur, tx, ty){
    const p = this.players[pid]; if(!p) return;
    p.pose = pose; p.poseT = 0; p.poseDur = dur; p.poseTx = tx || 0; p.poseTy = ty || 0;
  },
  pidByName(name){
    const players = S.match && S.match.snap ? S.match.snap.players : null;
    if(!players || !name) return null;
    for(const [pid, p] of Object.entries(players)) if(p.name === name) return pid;
    return null;
  },

  /* ── kick: the ONLY way the ball gains large velocity ── */
  kick(sol2, toX, toY, fam, rec, extra, brisk){
    const b = this.ball;
    // re-solve from the ACTUAL physical ball position (continuity absolute)
    const sol = this.solveKick(b.x, b.y, toX, toY, fam, brisk);
    b.vx = sol.vx; b.vy = sol.vy; b.vz = sol.vz; b.gEff = sol.gEff || PB.G;
    b.mode = 'FREE'; b.ctrl = null;
    b.flight = {to:{x:toX, y:toY}, T:sol.T, el:0, fam, rec: rec || null, brisk: !!brisk, ...(extra||{})};
  },

  enterSeg(sg){
    const b = this.ball;
    switch(sg.kind){
      case 'strike': {
        this.setPose(sg.actor, sg.shot ? A2.SHOT : A2.PASS, Math.max(0.3, sg.dur + 0.25), sg.aim.x, sg.aim.y);
        break;
      }
      case 'flight': {
        this.kick(sg.sol, sg.to.x, sg.to.y, sg.fam, sg.rec, sg.goal ? {goal: sg.goal, outcome: sg.outcome} : {outcome: sg.outcome}, sg.brisk);
        b.exclPid = sg.e ? sg.e.actor_id : null; b.exclUntil = this.pTotal + PB.EXCL_T;
        if(sg.gk && sg.shot && ['SAVED_PARRIED','SAVED_CAUGHT','MISS','GOAL'].includes(sg.outcome))
          this.setPose(sg.gk, sg.outcome === 'SAVED_CAUGHT' ? A2.RECEIVE : A2.GKDIVE, Math.max(0.8, sg.sol.T + 0.3), sg.to.x, sg.to.y);
        break;
      }
      case 'settle': {
        if(sg.actor){
          this.setPose(sg.actor, A2.RECEIVE, Math.max(0.3, sg.dur), b.x, b.y);
          b.mode = 'CTRL'; b.ctrl = sg.actor;
        } else { b.mode = 'FREE'; }
        break;
      }
      case 'carry': { b.mode = 'CTRL'; b.ctrl = sg.actor; break; }
      case 'duel': {
        b.mode = 'DUEL'; b.ctrl = null;
        if(sg.takeOn){
          this.setPose(sg.actor, A2.TAKEON, Math.max(0.6, sg.dur), b.x, b.y);
          const dp = this.pidByName(sg.dfd);
          if(dp) this.setPose(dp, sg.outcome === 'BEAT' ? A2.RECOVERY : A2.TACKLE, Math.max(0.6, sg.dur), b.x, b.y);
        } else {
          this.setPose(sg.actor, sg.tackle ? A2.TACKLE : A2.SHIELD, Math.max(0.4, sg.dur), b.x, b.y);
        }
        break;
      }
      case 'pickup': {
        b.mode = 'CTRL'; b.ctrl = sg.actor;
        this.setPose(sg.actor, A2.RECEIVE, Math.max(0.25, sg.dur), b.x, b.y);
        break;
      }
      case 'goalhold': { b.netHold = true; this.commitGoal(sg.e); break; }
      case 'reset': {
        // AUTHORITATIVE RESTART: placement IS the football event (the only
        // sanctioned discontinuity). Ball is placed dead at the restart spot.
        if(sg.place){ b.x = sg.place.x; b.y = sg.place.y; }
        b.z = 0; b.vx = b.vy = b.vz = 0; b.mode = 'FREE'; b.ctrl = null; b.flight = null; b.netHold = false;
        break;
      }
      case 'scramble': { b.mode = 'DUEL'; b.ctrl = null; break; }
      case 'mark': { this.commitMark(sg.e); break; }
      case 'link': break;
    }
    if(sg.e && sg.kind !== 'mark' && !sg._fed){ sg._fed = true; this.commitFeed(sg.e); }
  },
  exitSeg(sg){
    if(sg.kind === 'duel' && sg.takeOn && sg.outcome === 'BEAT'){
      // BEAT: winner knocks the ball past the defender — physical touch impulse
      const b = this.ball, p = this.players[sg.actor];
      if(p){ const a = p.face; b.vx = Math.cos(a)*8.5; b.vy = Math.sin(a)*8.5; b.vz = 0; b.mode = 'CTRL'; b.ctrl = sg.actor; }
    }
  },

  stepBall(dt, rdt){
    const b = this.ball;
    if(b.netHold){ b.vx *= (1 - Math.min(1, dt*8)); b.vy *= (1 - Math.min(1, dt*8)); }
    // ── integrate: THE ONLY WAY THE BALL MOVES ──
    b.x += b.vx * rdt; b.y += b.vy * rdt;
    b.z += b.vz * rdt;
    if(b.z > 0) b.vz -= (b.flight ? (b.gEff || PB.G) : PB.G) * rdt;
    if(b.z <= 0){
      if(b.vz < 0){
        const ref = -b.vz * PB.REST;
        if(ref < PB.SETTLE_VZ){ b.vz = 0; }
        else { b.vz = ref; b.vx *= PB.BOUNCE_KEEP; b.vy *= PB.BOUNCE_KEEP; }
      }
      b.z = Math.max(0, b.z);
    }
    // friction: linear decay (OpenSWOS-style), ground vs air
    const sp2 = Math.hypot(b.vx, b.vy);
    if(sp2 > 0){
      const briskQ = b.flight ? (b.flight.brisk ? 3.1 : 1.32) : 1;
      const mu = b.z > 0.05 ? PB.MU_AIR : PB.MU_ROLL * briskQ;
      const ns = Math.max(0, sp2 - mu * rdt);
      b.vx *= ns / sp2; b.vy *= ns / sp2;
    }
    // ── flight arrival ──
    if(b.flight){
      const f = b.flight; f.el += rdt;
      const dd = Math.hypot(f.to.x - b.x, f.to.y - b.y);
      if(f.goal && ((f.goal.dir > 0 && b.x >= 105) || (f.goal.dir < 0 && b.x <= 0))){
        b.flight = null; b.vx *= 0.25; b.vy *= 0.25;    // into the net, rippling out
      } else if((f.el >= f.T * 0.85 && dd < 1.4 && b.z < PB.CAPTURE_Z) || f.el > f.T + 0.8){
        b.flight = null;
        if(f.rec && this.players[f.rec]){
          // CONTACT: the trap is a physical damping touch, not a stop command
          b.mode = 'CTRL'; b.ctrl = f.rec;
          const p = this.players[f.rec];
          b.vx = b.vx * 0.18 + p.vx * 0.6; b.vy = b.vy * 0.18 + p.vy * 0.6;
          if(b.z > 0 && b.z < 1.6){ b.vz = Math.min(b.vz, 0.5); }
          this.setPose(f.rec, A2.RECEIVE, 0.35, b.x, b.y);
        }
      }
    }
    // ── control: dribble touches (never parenting) ──
    if(b.mode === 'CTRL' && b.ctrl && this.players[b.ctrl] && this.players[b.ctrl].active){
      const p = this.players[b.ctrl];
      const d = Math.hypot(b.x - p.x, b.y - p.y);
      const pv = Math.hypot(p.vx, p.vy);
      b.touchT -= dt;
      if(d < 0.9 && b.touchT <= 0 && !(b.exclPid === b.ctrl && this.pTotal < b.exclUntil)){
        // TOUCH: knock the ball ahead — it exists independently between touches
        const sg = this.seg();
        const aim = sg && sg.kind === 'carry' && sg.to ? Math.atan2(sg.to.y - p.y, sg.to.x - p.x) : p.face;
        const knock = pv > 5 ? pv + 3.0 : pv > 2 ? pv + 1.8 : 2.2;
        b.vx = Math.cos(aim) * knock; b.vy = Math.sin(aim) * knock; b.vz = 0;
        b.touchT = pv > 5 ? 0.5 : 0.38;
      } else if(d > 3.8){
        // control genuinely broken (should not happen mid-carry): ball is loose
        b.mode = 'FREE'; b.ctrl = null;
      }
    } else if(b.mode === 'DUEL'){
      // contested: small physical nudges keep the ball live near the contest
      b.touchT -= dt;
      if(b.touchT <= 0){
        const A = this.authBallW(this.simPos());
        if(A){
          const d = Math.hypot(A.x - b.x, A.y - b.y);
          if(d > 0.4){ const a = Math.atan2(A.y - b.y, A.x - b.x); const v = Math.min(7, 2 + d*1.6);
                       b.vx = Math.cos(a)*v; b.vy = Math.sin(a)*v; }
        }
        b.touchT = 0.3;
      }
    } else if(b.mode === 'FREE' && !b.flight && !b.netHold){
      // free ball drifting from the authoritative track: correct with small
      // physical nudge impulses (a rolling ball, never an eased token)
      b.touchT -= dt;
      if(b.touchT <= 0){
        const A = this.authBallW(this.simPos());
        if(A){
          const d = Math.hypot(A.x - b.x, A.y - b.y);
          if(d > 1.2){ const a = Math.atan2(A.y - b.y, A.x - b.x); const v = Math.min(12, 3 + d*1.8);
                       b.vx = Math.cos(a)*v; b.vy = Math.sin(a)*v; }
        }
        b.touchT = 0.35;
      }
    }
  },

  commitFeed(e){
    const m = S.match; if(!m) return;
    m.events.push(e);
    const line = presentEvent(e);
    if(line){ m.feed.push(line); if(typeof updateFeedList === 'function') updateFeedList(m); }
  },
  commitMark(e){ this.commitFeed(e); },
  commitGoal(shotEvent){
    const m = S.match; if(!m) return;
    const names = m.snap.players || {};
    const home = (names[shotEvent.actor_id]||{}).team === 'HOME';
    if(home) this.score.home++; else this.score.away++;
    if(typeof updateMatchHeader === 'function') updateMatchHeader(m);
  },
  presentedView(m){
    const sp = this.simPos();
    let hist = null;
    for(let i = this.statsHist.length - 1; i >= 0; i--)
      if(this.statsHist[i].clock <= sp + 0.5){ hist = this.statsHist[i]; break; }
    const snap = Object.assign({}, m.snap);
    if(hist){
      if(hist.team_stats) snap.team_stats = hist.team_stats;
      if(hist.possession) snap.possession = hist.possession;
      if(hist.half) snap.half = hist.half;
    }
    return Object.assign({}, m, {snap, clock: Math.floor(sp / 60), score: [this.score.home, this.score.away]});
  },

  /* ── broadcast camera with SWOS slew law (dest-current)/16, clamped ── */
  stepCam(dt){
    const c = this.cam, cv = this.canvas;
    if(!cv) return;
    const W = cv.width/(window.devicePixelRatio||1), H = cv.height/(window.devicePixelRatio||1);
    if(W < 60 || H < 40) return;
    if(c.mode === 'tactical'){
      c.scale += (Math.max(0.4, (W - 8)/105) - c.scale) * Math.min(1, dt*4);
      c.scale = Math.max(0.4, c.scale);
      c.x += (52.5 - c.x) * Math.min(1, dt*4); c.y += (34 - c.y) * Math.min(1, dt*4);
      return;
    }
    const targetScale = Math.max(0.6, (W - 8) / 78);
    c.scale += (targetScale - c.scale) * Math.min(1, dt*2);
    c.scale = Math.max(0.6, c.scale);
    const b = this.ball;
    let tx = b.x + b.vx * 0.35, ty = b.y + b.vy * 0.35;   // velocity feed-forward (SWOS principle)
    const viewW = W / c.scale, viewH = H / c.scale;
    tx = Math.max(viewW/2 - 4, Math.min(105 - viewW/2 + 4, tx));
    ty = Math.max(viewH/2 - 3, Math.min(68 - viewH/2 + 3, ty));
    // SWOS: delta = (dest - current)/16 per tick @70Hz, clamp ±5px(≈0.8m); metric @60fps:
    const k = dt * 60;
    let ddx = (tx - c.x) / 16 * k, ddy = (ty - c.y) / 16 * k;
    const cap = 0.85 * k;
    if(ddx > cap) ddx = cap; else if(ddx < -cap) ddx = -cap;
    if(ddy > cap) ddy = cap; else if(ddy < -cap) ddy = -cap;
    c.x += ddx; c.y += ddy;
  },

  ensureCanvas(){
    const pitch = $('#livePitch'); if(!pitch) return;
    if(this.canvas && pitch.contains(this.canvas)) return;
    this.canvas = document.createElement('canvas');
    this.canvas.className = 'animcanvas anim2 anim4';
    pitch.appendChild(this.canvas);
    this.ctx = this.canvas.getContext('2d');
    this.dbg.on = DEBUG_MODE;
    const q = new URLSearchParams(location.search);
    if(q.get('cam') === 'tactical') this.cam.mode = 'tactical';
    const ql = q.get('len');
    if(ql && ANIM4_PROFILE[ql] !== undefined) this.profile = ql;
    if(this.dbg.on && !this.dbg.panel){
      const d = document.createElement('div');
      d.className = 'animdbg';
      d.innerHTML = `<div id="a4status" style="white-space:pre"></div>
        <label><input type="checkbox" id="a4cam" checked> broadcast cam</label>
        <label>len <select id="a4len"><option>quick</option><option selected>standard</option><option>extended</option></select></label>`;
      pitch.appendChild(d);
      d.querySelector('#a4cam').addEventListener('change', ev => { this.cam.mode = ev.target.checked ? 'broadcast' : 'tactical'; });
      d.querySelector('#a4len').addEventListener('change', ev => { this.profile = ev.target.value; });
      this.dbg.panel = d;
    }
  },

  draw(){
    const cv = this.canvas; if(!cv || !this.ctx) return;
    const pr = window.devicePixelRatio || 1;
    const box = cv.parentElement.getBoundingClientRect();
    if(box.width < 60 || box.height < 40) return;
    if(cv.width !== Math.round(box.width*pr) || cv.height !== Math.round(box.height*pr)){
      cv.width = Math.round(box.width*pr); cv.height = Math.round(box.height*pr);
      cv.style.width = box.width+'px'; cv.style.height = box.height+'px';
    }
    const c = this.ctx;
    c.setTransform(pr, 0, 0, pr, 0, 0);
    AnimR2.drawPitch.call(this, c);
    const entries = Object.entries(this.players).filter(([,p]) => p.active !== 0 && p.team);
    entries.sort((a, b2) => a[1].y - b2[1].y);
    let ballDrawn = false;
    for(const [pid, p] of entries){
      if(!ballDrawn && this.ball.z <= 0.1 && p.y > this.ball.y){ AnimR2.drawBall.call(this, c); ballDrawn = true; }
      AnimR2.drawPlayer.call(this, c, p, pid);
    }
    if(!ballDrawn) AnimR2.drawBall.call(this, c);
    if(this.dbg.on && this.dbg.panel){
      const el = this.dbg.panel.querySelector('#a4status');
      const sg = this.seg(), b = this.ball;
      if(el) el.textContent =
        `sim ${Math.floor(this.simPos()/60)}:${String(Math.floor(this.simPos()%60)).padStart(2,'0')}  pres ${this.pTotal.toFixed(0)}s (${this.profile})` +
        `\nball ${b.x.toFixed(1)},${b.y.toFixed(1)} z${b.z.toFixed(2)}  v ${Math.hypot(b.vx,b.vy).toFixed(1)},${b.vz.toFixed(1)} m/s` +
        `\nmode ${b.mode}${b.flight ? ' FLIGHT '+b.flight.fam : ''}  ctrl ${b.ctrl ? (this.players[b.ctrl]||{}).name || b.ctrl : '-'}` +
        `\nseg ${sg ? sg.kind : '-'} ${this.segIdx}/${this.segs.length}  buf ${this.remaining().toFixed(0)}s  wait ${this.waitBall.toFixed(1)}s` +
        `\nfps ${this.fps.value}  cam ${this.cam.mode} ${((this.canvas.width/(window.devicePixelRatio||1))/this.cam.scale).toFixed(0)}m`;
    }
  },

  loop(ts){
    requestAnimationFrame((t) => this.loop(t));
    if(ANIM4_ON && S.match && S.ui.view === 'match' && this.canvas){
      const t0 = performance.now();
      const dt = this.lastTs ? Math.min(0.1, (ts - this.lastTs)/1000) : 0.016;
      this.step(dt);
      this.draw();
      const el = performance.now() - t0;
      this.frameMs.sum += el; this.frameMs.n++; this.frameMs.max = Math.max(this.frameMs.max, el);
      this.fps.frames++;
      if(ts - this.fps.t0 > 1000){ this.fps.value = this.fps.frames; this.fps.frames = 0; this.fps.t0 = ts; }
    }
    this.lastTs = ts;
  },
};
if(typeof window !== 'undefined' && typeof ANIM4_ON !== 'undefined' && ANIM4_ON) requestAnimationFrame((t) => AnimR4.loop(t));




function updateLivePitch(m){
  const pitch = $('#livePitch'); if(!pitch) return;
  if(ANIM_ANY){ activeAnim().ensureCanvas(); return; }   // rc7+: canvas renderer owns the pitch
  const seen = new Set();
  for(const [pid, p] of Object.entries(m.snap.players || {})){
    let node = m.markers[pid];
    if(!p.active){ if(node){ node.remove(); delete m.markers[pid]; } continue; }
    seen.add(pid);
    const liv = teamIdIsLiv(p.team);
    if(!node){
      node = document.createElement('div');
      node.className = 'pm';
      node.dataset.pid = pid;
      node.innerHTML = `<div class="dot"></div><div class="nm"></div><div class="en"><i></i></div>`;
      node.onclick = () => selectLivePlayer(pid);
      pitch.appendChild(node);
      m.markers[pid] = node;
    }
    node.className = `pm ${liv ? 'liv' : 'opp'} ${p.slot === 'GK' ? 'gk' : ''} ${p.energy < 30 ? 'tired' : ''} ${m.selPid === pid ? 'sel' : ''}`;
    node.dataset.slot = p.slot;
    const sc = liveScreen(p.x, p.y);
    node.style.left = sc.l + '%';
    node.style.top = sc.t + '%';
    node.querySelector('.dot').textContent = p.slot === 'GK' ? 'GK' : '';
    node.querySelector('.nm').textContent = shortName(p.name || (P(pid) || {name: pid}).name);
    const bar = node.querySelector('.en i');
    bar.style.width = Math.max(3, p.energy) + '%';
    bar.style.background = energyColor(p.energy);
  }
  for(const pid of Object.keys(m.markers))
    if(!seen.has(pid)){ m.markers[pid].remove(); delete m.markers[pid]; }
  const ball = $('#ballM');
  if(ball && m.snap.ball){
    const sc = liveScreen(m.snap.ball.x, m.snap.ball.y);
    ball.style.display = '';
    ball.style.left = sc.l + '%';
    ball.style.top = sc.t + '%';
  }
}

function updateFeedList(m){
  const list = $('#feedList'); if(!list) return;
  while(m.renderedFeed < m.feed.length){
    const e = m.feed[m.renderedFeed++];
    const div = document.createElement('div');
    div.className = 'ev ' + e.type;
    div.innerHTML = `<div class="min">${e.min}'</div><div class="txt">${esc(e.text)}</div>`;
    list.prepend(div);
  }
  while(list.children.length > 60) list.lastChild.remove();
}

function updateRatingsList(m){
  const el = $('#ratingsList'); if(!el) return;
  const rows = Object.entries(m.snap.players || {})
    .filter(([pid, p]) => teamIdIsLiv(p.team) && p.active)
    .sort((a, b) => b[1].rating - a[1].rating)

      <span style="flex:1;overflow:hidden;text-overflow:ellipsis"><b>${esc(shortName(p.name || pid))}</b>

  el.innerHTML = rows;

      ${statRow('TACKLES (WON/ATT)', `${arr('tackles',0)[0]}/${arr('tackles',1)[0]}`, `${arr('tackles',0)[1]}/${arr('tackles',1)[1]}`)}

/* ── full time → season state (all results from v0.7) ────────────────────── */
function normalizeTeamStats(ftd){
  const H = ftd.team_stats.home || {}, A = ftd.team_stats.away || {};
  return {
    shots: [H.shots ?? 0, A.shots ?? 0],
    sot: [H.shots_on_target ?? 0, A.shots_on_target ?? 0],
    xg: [H.xg ?? 0, A.xg ?? 0],
    possession: [ftd.possession.home ?? 50, ftd.possession.away ?? 50],
    pass: [Math.round((H.pass_completion ?? 0) * 100), Math.round((A.pass_completion ?? 0) * 100)],
    corners: [H.corners ?? 0, A.corners ?? 0],
    fouls: [H.fouls ?? 0, A.fouls ?? 0]
  };
}
function showSimProgress(done, total){
  const el = $('#simProgress'); if(!el) return;
  if(done >= total){ el.innerHTML = ''; return; }
  const pct = Math.round(100 * done / total);
  el.innerHTML = `<div style="margin-top:12px;font-family:var(--cond);letter-spacing:.14em;font-size:12px;color:var(--dim)">
    SIMULATING PREMIER LEAGUE RESULTS… ${done + 1} / ${total}</div>
    <div style="height:6px;border-radius:20px;background:#1a2236;max-width:300px;margin:8px auto 0">
      <div style="height:100%;width:${pct}%;border-radius:20px;background:var(--lfc)"></div></div>`;
}

async function finalizeFixture(){
  const f = S.matchFixture, m = S.match;
  if(!f || !m || !m.fullTime || S.season.results[f.id]) return;
  const ftd = m.fullTime;
  const scorers = {}, ratings = {};
  for(const e of ftd.events)
    if(e.event_type === 'GOAL' && e.actor_id && P(e.actor_id) && P(e.actor_id).clubId === 'LIV')
      scorers[e.actor_id] = (scorers[e.actor_id] || 0) + 1;
  for(const [pid, ps] of Object.entries(ftd.player_stats))
    if(P(pid) && P(pid).clubId === 'LIV') ratings[pid] = ps.rating;
  S.season.results[f.id] = {
    score: [ftd.score.home, ftd.score.away],
    matchId: m.matchId,                               // persisted backend identity
    engine: ftd.engine,                               // seed + engine + calibration versions
    kickoff: S.matchKickoff,                          // exact submitted+accepted kickoff input
    changes: [...S.changes],                          // manager log (accepted changes only)
    managementEvents: ftd.events                      // engine-recorded management ledger
      .filter(e => ['SUBSTITUTION','FORMATION_CHANGE','TACTIC_CHANGE','INSTRUCTION_CHANGE'].includes(e.event_type))
      .map(e => ({t: e.timestamp, type: e.event_type, team: e.team_id, detail: e.detail})),
    stats: normalizeTeamStats(ftd),
    rich: {team_stats: ftd.team_stats, match_dynamics: ftd.match_dynamics},
    players: ftd.player_stats,
    scorers, ratings
  };
  saveState();
  // the other nine fixtures — same engine, same seed system, stored once
  const others = S.season.fixtures.filter(x => x.mw === f.mw && !S.season.results[x.id]);
  for(let i = 0; i < others.length; i++){
    showSimProgress(i, others.length);
    const o = others[i];
    try{
      const res = await api('/matches/start', {method: 'POST', body: {
        fixture_id: o.id, seed: fixtureSeed(o), mode: 'full',
        config: {duration_seconds: 90 * 60},
        coach_ai: {home: true, away: true},           // CPU vs CPU: coach AI both sides
        home_team: cpuSideForRequest(o.home), away_team: cpuSideForRequest(o.away)}});
      const ft2 = res.full_time;
      S.season.results[o.id] = {score: [ft2.score.home, ft2.score.away], engine: ft2.engine,
        matchId: res.match_id,
        stats: normalizeTeamStats(ft2), scorers: null, ratings: null};
      saveState();
    }catch(e){ toast('League simulation failed: ' + e.message); break; }
  }
  showSimProgress(1, 1);
  S.season.matchweek = Math.min(38, f.mw + 1);
  S.season.standings = computeStandings();
  saveState(); renderTopBar();
}
function continueSeason(){
  S.match = null; S.matchFixture = null; S.changes = []; S.base = null;
  show('results');
}

/* pass completion for the dev mock only — the real number comes from v0.7 */
function passCompletion(m){
  const pc = t => 84 + (({Short:4,Mixed:0,Direct:-5})[t.passingDirectness] || 0)
                     + (({Patient:2,Balanced:0,Quick:-2})[t.buildUpTempo] || 0);
  return [pc(m.tactics.a), pc(m.tactics.b)];
}

/* ── dev-only mock (never the default authority) ─────────────────────────── */
function mockKickOff(){
  const fixture = S.matchFixture; if(!fixture) return;
  toast('MOCK ENGINE (dev): instant simulation, not FC Simulator v0.7');
  const setup = buildMatchSetup(fixture);
  const st = ENGINE.init(setup); st.status = 'live';
  let g = 0; while(st.status !== 'ft' && g++ < 200) ENGINE.step(st, setup);
  const flip = a => isLivHome(fixture) ? a : [a[1], a[0]];
  S.season.results[fixture.id] = {
    score: flip(st.score), engine: {name: 'MockMatchEngine (dev)', engine_version: 'js'},
    stats: {shots: flip(st._shots), sot: flip(st._sot), xg: flip(st._xg.map(v => Math.round(v * 100) / 100)),
      possession: flip([Math.round(st._pos), 100 - Math.round(st._pos)]),
      pass: flip(passCompletion(st)), corners: flip(st._corners), fouls: flip(st._fouls)},
    scorers: {...st._scorers}, ratings: {...st.playerRatings}
  };
  S.season.matchweek = Math.min(38, fixture.mw + 1);
  S.season.standings = computeStandings();
  saveState(); S.match = null; S.matchFixture = null;
  show('results');
}

/* Persisted debug identity for a completed fixture. The BACKEND record is the
   authority: nothing here is reconstructed in the browser. Works when the
   match exists only in persistence (after cleanup or a backend restart). */
async function loadResultDebug(fid, r){
  const el = () => $('#resultDebugBody');
  try{
    const b = r.matchId
      ? await api(`/matches/${r.matchId}/bundle`)
      : await api(`/matches/lookup?save_id=${encodeURIComponent(SAVE_ID)}&fixture_id=${encodeURIComponent(fid)}`);
    if(!el()) return;
    const rows = [
      ['Match ID', b.match_id], ['Save ID', b.save_id], ['Fixture ID', b.fixture_id],
      ['Seed', b.seed], ['App', b.app_version], ['Engine', b.engine_version],
      ['Calibration', b.calibration_version], ['Player data', b.player_data_version],
      ['Ledger', (b.ledger_digest || '—') + (b.ledger_events ? ` (${b.ledger_events} events)` : '')]];
    const text = rows.map(([k, v]) => `${k}: ${v}`).join('\n');
    el().innerHTML = rows.map(([k, v]) =>
        `<div style="display:flex;justify-content:space-between;gap:12px"><span style="opacity:.65">${esc(k)}</span><b style="user-select:all">${esc(String(v))}</b></div>`).join('') +
      `<div style="display:flex;gap:8px;margin-top:8px">
         <button class="btn sec sm" onclick="copyText('${esc(String(b.match_id))}', 'Match ID copied')">Copy Match ID</button>
         <button class="btn sec sm" onclick='copyText(${JSON.stringify(text)}, "Debug info copied")'>Copy Debug Info</button>
       </div>`;
  }catch(e){
    if(el()) el().innerHTML = `<span style="color:var(--bad)">No persisted record reachable (${esc(e.message)})</span>`;
  }
}
function copyText(t, msg){
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
    .then(() => toast(msg))
    .catch(() => { window.prompt('Copy:', t); });
}

    if(listFilters.pos !== 'ALL' && !(p.pos === listFilters.pos || p.elig.includes(listFilters.pos))) return false;
    if(listFilters.q && !p.name.toLowerCase().includes(listFilters.q.toLowerCase())) return false;
    return true;
  });
  const sorters = {ovr:(a,b)=>b.ovr-a.ovr, pot:(a,b)=>b.pot-a.pot, age:(a,b)=>a.age-b.age,
                   club:(a,b)=>a.clubId.localeCompare(b.clubId) || b.ovr-a.ovr,
                   name:(a,b)=>a.name.localeCompare(b.name)};
  list.sort(sorters[listFilters.sort] || sorters.ovr);
  $('#listCount').textContent = `${list.length} of ${all.length} Premier League players`;
  g.innerHTML = list.length ? list.map(p => `
    <div class="pw" onclick="openDetails('${p.id}')">
      ${cardHTML(p)}
      <div class="fitline">${clubById(p.clubId).abbreviation} · POT ${p.pot} · ${p.age}y</div></div>`).join('')
    : `<div class="empty-state">Nothing matches that filter.</div>`;
}

/* ═══ TRANSFERS ════════════════════════════════════════════════════════════ */
let marketFilters = {q:'', pos:'ALL', club:'ALL', sort:'value'};
function renderTransfers(){
  const el = $('#transfersBody'); if(!el) return;
  const tab = S.ui.transferTab || 'market';
  const F = S.finance, snap = financeSnapshot();
  el.innerHTML = `
    <div class="pagehead">LIVERPOOL · ${PREMIER_LEAGUE.season}</div>
    <h2 class="pagetitle">Transfers</h2>
    <div style="display:flex;gap:22px;flex-wrap:wrap;margin:-6px 0 14px;font-size:13px;color:var(--muted)">

      <span>Wage bill <b style="color:var(--ink)">${fmtM(snap.weeklyK/1000)}/wk</b></span>
      <span>SCR <b style="color:var(--ink)">${Math.round(snap.scr*100)}%</b>

function marketPool(){
  return premierLeaguePlayers.filter(pl => pl.clubId && pl.clubId !== 'LIV');
}
function marketRow(pl, extra = ''){
  const short = S.transfers.shortlist.includes(pl.id);
  return `<tr onclick="openTransferProfile('${pl.id}')">
    <td>${esc(pl.name)}</td>
    <td>${clubById(pl.clubId).shortName}</td>
    <td>${pl.pos}</td><td class="num">${pl.age}</td><td class="num"><b>${pl.ovr}</b></td>
    <td class="num">${fmtM(playerValue(pl))}</td>
    <td class="num" onclick="event.stopPropagation();toggleShortlist('${pl.id}')">
      <span class="heart ${short?'on':''}" title="Shortlist">${short?'♥':'♡'}</span></td>
    ${extra}</tr>`;
}
function renderMarket(){
  const body = $('#transferTabBody'); if(!body) return;
  let list = marketPool().filter(pl => {
    if(marketFilters.club !== 'ALL' && pl.clubId !== marketFilters.club) return false;
    if(marketFilters.pos !== 'ALL' && !(pl.pos === marketFilters.pos || pl.elig.includes(marketFilters.pos))) return false;
    if(marketFilters.q && !pl.name.toLowerCase().includes(marketFilters.q.toLowerCase())) return false;
    return true;
  });
  const sorters = {value:(a,b)=>playerValue(b)-playerValue(a), ovr:(a,b)=>b.ovr-a.ovr,
    age:(a,b)=>a.age-b.age, name:(a,b)=>a.name.localeCompare(b.name)};
  list.sort(sorters[marketFilters.sort] || sorters.value);
  body.innerHTML = `
    <div class="filters" style="margin-bottom:12px">
      <input value="${esc(marketFilters.q)}" placeholder="Search players"
        oninput="marketFilters.q=this.value;renderMarket()">
      <select onchange="marketFilters.pos=this.value;renderMarket()">
        <option value="ALL" ${marketFilters.pos==='ALL'?'selected':''}>All positions</option>
        ${POS_ALL.map(x=>`<option ${marketFilters.pos===x?'selected':''}>${x}</option>`).join('')}
      </select>
      <select onchange="marketFilters.club=this.value;renderMarket()">
        <option value="ALL">All clubs</option>
        ${CLUBS.filter(c=>c.id!=='LIV').map(c=>`<option value="${c.id}" ${marketFilters.club===c.id?'selected':''}>${c.shortName}</option>`).join('')}
      </select>
      <select onchange="marketFilters.sort=this.value;renderMarket()">
        <option value="value">Value</option><option value="ovr" ${marketFilters.sort==='ovr'?'selected':''}>Overall</option>
        <option value="age" ${marketFilters.sort==='age'?'selected':''}>Age</option>
        <option value="name" ${marketFilters.sort==='name'?'selected':''}>Name</option>
      </select>
    </div>
    <div class="tablewrap"><table class="market">
      <thead><tr><th>PLAYER</th><th>CLUB</th><th>POS</th><th class="num">AGE</th>
        <th class="num">OVR</th><th class="num">VALUE</th><th></th></tr></thead>
      <tbody>${list.map(pl => marketRow(pl)).join('') ||
        '<tr><td colspan="7" style="text-align:center;padding:26px;color:var(--dim)">No players match.</td></tr>'}</tbody>
    </table></div>`;
}
function renderShortlist(){
  const body = $('#transferTabBody'); if(!body) return;
  const list = S.transfers.shortlist.map(P).filter(Boolean).filter(pl => pl.clubId !== 'LIV');
  body.innerHTML = list.length ? `
    <div class="tablewrap"><table class="market">
      <thead><tr><th>PLAYER</th><th>CLUB</th><th>POS</th><th class="num">AGE</th>
        <th class="num">OVR</th><th class="num">VALUE</th><th></th></tr></thead>
      <tbody>${list.map(pl => marketRow(pl)).join('')}</tbody></table></div>`
    : `<div class="empty-state" style="text-align:left;padding:8px 0">Nothing shortlisted yet. Use the ♡ in the market.</div>`;
}
function toggleShortlist(pid){
  const i = S.transfers.shortlist.indexOf(pid);
  if(i > -1) S.transfers.shortlist.splice(i, 1); else S.transfers.shortlist.push(pid);
  saveState();
  renderTransfers();
}
const OUT_STATUSES = ['Not for sale', 'Available', 'Loan listed', 'Transfer listed'];
function renderOutgoing(){
  const body = $('#transferTabBody'); if(!body) return;
  const list = clubPool().slice().sort((a,b) => b.ovr - a.ovr);
  body.innerHTML = `
    <div class="tablewrap"><table class="market">
      <thead><tr><th>PLAYER</th><th>POS</th><th class="num">OVR</th><th class="num">WAGE</th>
        <th class="num">VALUE</th><th>STATUS</th><th class="num">OFFERS</th></tr></thead>
      <tbody>${list.map(pl => {
        const st = S.transfers.outgoing[pl.id] || 'Not for sale';
        const listed = st === 'Transfer listed' || st === 'Available';
        const bid = Math.round(playerValue(pl) * (st === 'Transfer listed' ? 0.92 : 0.85));
        return `<tr onclick="openDetails('${pl.id}')">
          <td>${esc(pl.name)}</td><td>${pl.pos}</td><td class="num"><b>${pl.ovr}</b></td>
          <td class="num">${fmtK(ensureContract(pl).weeklyWage)}</td>
          <td class="num">${fmtM(playerValue(pl))}</td>
          <td onclick="event.stopPropagation()">
            <select class="finput" style="padding:5px 8px;font-size:12.5px;width:auto"
              onchange="S.transfers.outgoing['${pl.id}']=this.value;saveState();renderTransfers()">
              ${OUT_STATUSES.map(o=>`<option ${o===st?'selected':''}>${o}</option>`).join('')}
            </select></td>
          <td class="num" onclick="event.stopPropagation()">${listed
            ? `<button class="btn sec sm" onclick="acceptSale('${pl.id}', ${bid})">${clubName(CLUBS.filter(c=>c.id!=='LIV')[hashStr(pl.id+':buyer')%19].id)} · ${fmtM(bid)}</button>`
            : '<span style="color:var(--dim)">—</span>'}</td>
        </tr>`; }).join('')}</tbody></table></div>
    <p class="finnote">Listing a player produces a deterministic offer for UI testing — the real market
      logic arrives with the simulator. Sales credit cash in full; the board releases 70% to the transfer
      budget. Profit against remaining book value feeds the Squad Cost Ratio.</p>`;
}
function acceptSale(pid, fee){
  if(isLiveMatch()){ liveBlocked('Transfers cannot be completed during a live match.'); return; }
  const pl = P(pid);
  sellPlayer(pid, fee);
  toast(`${shortName(pl.name)} sold — ${fmtM(fee)}`);
  renderPitch(); renderTransfers();
}

/* ── transfer profile + offer + contract drawers ────────────────────────── */
function openTransferProfile(pid){
  const pl = P(pid); if(!pl) return;
  ensureContract(pl);
  const interest = interestFor(pl);
  $('#drawerTitle').textContent = pl.name;
  $('#drawerSub').textContent = `${clubById(pl.clubId).name} · ${pl.pos} · OVR ${pl.ovr}`;
  $('#drawerBody').innerHTML = `
    <div style="width:150px;margin:0 auto 14px;--cw:150px">${cardHTML(pl)}</div>
    <div class="tprow"><span>Age</span><b>${pl.age}</b></div>
    <div class="tprow"><span>Club</span><b>${clubById(pl.clubId).name}</b></div>
    <div class="tprow"><span>Position</span><b>${pl.pos}${pl.elig.length > 1 ? ' · ' + pl.elig.filter(x=>x!==pl.pos).join(', ') : ''}</b></div>
    <div class="tprow"><span>Estimated value</span><b>${fmtM(playerValue(pl))}</b></div>
    <div class="tprow"><span>Weekly wage</span><b>${fmtK(pl.contract.weeklyWage)}</b></div>
    <div class="tprow"><span>Contract remaining</span><b>${contractYearsLeft(pl)} year${contractYearsLeft(pl)===1?'':'s'}</b></div>
    <div class="tprow"><span>Interest</span><b>${interest}</b></div>`;
  $('#drawerFoot').innerHTML = `
    <button class="btn sec" style="flex:1" onclick="toggleShortlist('${pid}');openTransferProfile('${pid}')">
      ${S.transfers.shortlist.includes(pid) ? '♥ Shortlisted' : '♡ Add to shortlist'}</button>
    <button class="btn pri" onclick="openOffer('${pid}')">Make offer</button>`;
  $('#scrim').classList.add('on');
  $('#drawer').classList.add('on');
}
function openOffer(pid){
  const pl = P(pid);
  const val = playerValue(pl);
  $('#drawerTitle').textContent = `Offer — ${pl.name}`;
  $('#drawerSub').textContent = `${clubById(pl.clubId).name} · estimated value ${fmtM(val)}`;
  $('#drawerBody').innerHTML = `
    <label class="flabel">TRANSFER FEE (£m)</label>
    <input class="finput" id="offFee" type="number" min="0" step="0.5" value="${val}">
    <label class="flabel">ADD-ONS (£m)</label>
    <input class="finput" id="offAddons" type="number" min="0" step="0.5" value="0">
    <div class="impact"><h5>CONTEXT</h5>
      <div class="tprow"><span>Transfer budget</span><b>${fmtM(S.finance.transferBudget)}</b></div>
      <div class="tprow"><span>Club stance</span><b>${interestFor(pl)}</b></div>
    </div>`;
  $('#drawerFoot').innerHTML = `
    <button class="btn sec" onclick="openTransferProfile('${pid}')">Back</button>
    <button class="btn pri" onclick="submitOffer('${pid}')">Submit offer</button>`;
}
function submitOffer(pid){
  const pl = P(pid);
  const fee = +$('#offFee').value || 0;
  const addons = +$('#offAddons').value || 0;
  if(interestFor(pl) === 'Unavailable'){ toast(`${clubById(pl.clubId).shortName} — not for sale.`); return; }
  if(fee + addons > S.finance.transferBudget){ toast('Beyond the transfer budget.'); return; }
  if(fee + addons * 0.5 < askingPrice(pl)){
    toast(`${clubById(pl.clubId).shortName} reject the offer.`); return;
  }
  openContract(pid, fee, addons);
}
function openContract(pid, fee, addons){
  const pl = P(pid);
  const expect = expectedWageK(pl);
  $('#drawerTitle').textContent = `Contract — ${pl.name}`;
  $('#drawerSub').textContent = `Fee agreed: ${fmtM(fee)}${addons ? ' + ' + fmtM(addons) + ' add-ons' : ''}`;
  $('#drawerBody').innerHTML = `
    <label class="flabel">WEEKLY WAGE (£k)</label>
    <input class="finput" id="cWage" type="number" min="10" step="5" value="${expect}" oninput="updateImpact('${pid}', ${fee})">
    <label class="flabel">CONTRACT LENGTH</label>
    <select class="finput" id="cYears" onchange="updateImpact('${pid}', ${fee})">
      ${[2,3,4,5].map(y=>`<option value="${y}" ${y===4?'selected':''}>${y} years</option>`).join('')}</select>
    <label class="flabel">SIGNING BONUS (£m)</label>
    <input class="finput" id="cBonus" type="number" min="0" step="0.5" value="0" oninput="updateImpact('${pid}', ${fee})">
    <label class="flabel">SQUAD ROLE</label>
    <select class="finput" id="cRole">
      ${['Star','First Team','Rotation','Squad'].map(r=>`<option>${r}</option>`).join('')}</select>
    <div class="impact" id="impactBox"></div>`;
  $('#drawerFoot').innerHTML = `
    <button class="btn sec" onclick="openOffer('${pid}')">Back</button>
    <button class="btn pri" onclick="agreeContract('${pid}', ${fee})">Agree contract</button>`;
  updateImpact(pid, fee);
}
function updateImpact(pid, fee){
  const box = $('#impactBox'); if(!box) return;
  const wage = +$('#cWage').value || 0;
  const years = +$('#cYears').value || 4;
  const bonus = +$('#cBonus').value || 0;
  const amort = fee / years;
  const annualWage = wage * 52 / 1000;
  const snap = financeSnapshot();
  const after = scrWith(amort + annualWage);
  box.innerHTML = `<h5>TRANSFER FINANCIAL IMPACT</h5>
    <div class="tprow"><span>Transfer fee</span><b>${fmtM(fee)}</b></div>
    <div class="tprow"><span>Annual amortisation (${years}y)</span><b>${fmtM(amort)}</b></div>
    <div class="tprow"><span>Annual wage</span><b>${fmtM(annualWage)}</b></div>
    <div class="tprow"><span>Projected SCR</span>
      <b>${Math.round(snap.scr*100)}% → ${Math.round(after*100)}%</b></div>
    <div class="tprow"><span>Transfer budget</span>
      <b>${fmtM(S.finance.transferBudget)} → ${fmtM(S.finance.transferBudget - fee - bonus)}</b></div>`;
}
function agreeContract(pid, fee){
  if(isLiveMatch()){ liveBlocked('Transfers cannot be completed during a live match.'); return; }
  const pl = P(pid);
  const wage = +$('#cWage').value || 0;
  const years = +$('#cYears').value || 4;
  const bonus = +$('#cBonus').value || 0;
  const role = $('#cRole').value;
  if(wage < expectedWageK(pl)){ toast(`${shortName(pl.name)} wants at least £${expectedWageK(pl)}k/wk.`); return; }
  completeTransfer(pid, fee, years, wage, bonus, role);
  closeAll();
  toast(`${shortName(pl.name)} signs for Liverpool — ${fmtM(fee)}`);
  renderTransfers(); renderPitch(); renderTopBar();
}

/* ── shell ──────────────────────────────────────────────────────────────── */
function show(v){
  S.ui.view = v;
  $$('.view').forEach(n => n.classList.toggle('on', n.id === 'v-'+v));
  $$('.navtab').forEach(n => n.classList.toggle('on', n.dataset.v === v));
  if(v === 'squad'){
    fitCards();
    const sl = $('.slots');
    if(sl){ sl.classList.add('notrans'); renderPitch(); void sl.offsetWidth; sl.classList.remove('notrans'); }
    renderTacticsPanel();
  }
  if(v === 'home') renderHome();
  if(v === 'schedule') renderSchedule();
  if(v === 'table') renderTable();
  if(v === 'players') renderList();
  if(v === 'results') renderResults();
  if(v === 'transfers') renderTransfers();
  if(v === 'finances') renderFinances();
  if(v === 'match') renderMatch();
}
function closeAll(){
  $('#scrim').classList.remove('on');
  $('#drawer').classList.remove('on');
  $('#sheet').classList.remove('on');
  $('#focus').classList.remove('on');
  $('#subConfirm').classList.remove('on');
}
function toggleBench(){
  S.ui.benchOpen = !S.ui.benchOpen;
  $('.bench').classList.toggle('closed', !S.ui.benchOpen);
  $('.chev').textContent = S.ui.benchOpen ? '▾' : '▸';
  setTimeout(fitCards, 320);
}
function renderTopBar(){
  const el = $('#recordLabel'); if(!el || !S.season) return;
  const row = livRow();
  el.textContent = `MW ${S.season.matchweek} · P${row.pos} · ${row.w}W ${row.d}D ${row.l}L · ${row.pts}pts`;
}

/* Card size follows the space left over after the dock. */
function fitCards(){
  const zone = $('.pitchzone'); if(!zone) return;
  const h = zone.clientHeight, w = zone.clientWidth;
  const narrow = w < 430;
  const cw = Math.max(60, Math.min(112,
             Math.min(w / (narrow ? 6.2 : 6.15), h / 6.85)));
  S.ui.cw = Math.round(cw);
  $$('.slots .slot').forEach(n => n.style.setProperty('--cw', S.ui.cw+'px'));
  $('.slots').style.setProperty('--cw', S.ui.cw+'px');
}
